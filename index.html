.tx-main .tt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-main .tm { font-size: var(--fs-xs); color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; }
.tx-amt { font-family: var(--font-mono); font-weight: 800; white-space: nowrap; font-size: var(--fs-md); }
.tx-amt.in { color: var(--green); } .tx-amt.out { color: var(--red); } .tx-amt.tr { color: var(--blue); }
.tx-row.pending { opacity: .68; border-style: dashed; }
/* Finance pro-polish: money input, KPI tiles, summary strip */
.money-in { display: flex; flex-direction: column; gap: 4px; }
.money-in .money { font-family: var(--font-mono); font-weight: 700; letter-spacing: .3px; text-align: end; }
.money-words { font-size: var(--fs-xs); color: var(--brand); font-weight: 600; min-height: 16px; }
.fin-kpi { border-inline-start: 3px solid var(--kc, var(--brand)); }
.fin-kpi .num { font-family: var(--font-mono); }
.kpi-delta { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); font-weight: 800; padding: 1px 7px; border-radius: 999px; width: fit-content; }
.kpi-delta.good { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
.kpi-delta.bad { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.tx-sumbar { align-items: center; }
.tx-sumbar .lg-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.fin-kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

.acct-card { padding: var(--s-4); border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; cursor: pointer;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
.acct-card:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.acct-bal { font-family: var(--font-mono); font-weight: 800; font-size: var(--fs-xl); letter-spacing: -.02em; }
.acct-bal.neg { color: var(--red); }

.budget-row { display: flex; flex-direction: column; gap: 6px; padding: 9px 11px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); }
.budget-row.over { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.budget-row .bar > span.over { background: var(--red); }
.budget-row .bar > span.warn { background: var(--orange); }

.chart-wrap { display: flex; align-items: center; gap: var(--s-5); flex-wrap: wrap; justify-content: center; }
.chart-legend { display: flex; flex-direction: column; gap: 7px; min-width: 150px; }
.chart-legend .lg-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
.chart-legend .lg-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.chart-legend .lg-val { margin-inline-start: auto; font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-xs); }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; min-width: 0; }
.bar-stack { width: 100%; display: flex; flex-direction: column-reverse; gap: 2px; align-items: center; }
.bar-seg { width: 72%; max-width: 34px; border-radius: 5px 5px 0 0; transition: height var(--dur-3) var(--ease); }
.bar-lbl { font-size: 10px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.spark { width: 100%; height: auto; display: block; }

/* ---- Focus & Health (Phase 7) -------------------------------------------- */
.timer-ring { position: relative; width: 220px; height: 220px; flex: none; display: grid; place-items: center; }
.timer-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer-ring .tr-track { stroke: var(--surface-3); }
.timer-ring .tr-bar { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset 1s linear;
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--brand) 45%, transparent)); }
.timer-ring.brk .tr-bar { stroke: var(--green); }
.timer-ring.lng .tr-bar { stroke: var(--blue); }
.timer-ring .tr-inner { position: relative; text-align: center; }
.timer-ring .tr-time { font-family: var(--font-mono); font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.timer-ring .tr-mode { font-size: var(--fs-sm); font-weight: 700; color: var(--text-3); margin-top: 4px; }
.pomo-dots { display: flex; gap: 6px; justify-content: center; }
.pomo-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-3); display: block; }
.pomo-dots i.on { background: var(--brand); box-shadow: 0 0 8px color-mix(in srgb, var(--brand) 55%, transparent); }

#focusOverlay { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-6); padding: var(--s-6); }
#focusOverlay.open { display: flex; animation: fade var(--dur-3) var(--ease) both; }
#focusOverlay .fo-task { font-size: var(--fs-2xl); font-weight: 700; text-align: center; max-width: 640px; }
#focusOverlay .fo-hint { color: var(--text-3); font-size: var(--fs-sm); }
#focusOverlay .timer-ring { width: min(72vw, 360px); height: min(72vw, 360px); }
#focusOverlay .timer-ring .tr-time { font-size: clamp(38px, 11vw, 68px); }
#focusOverlay .fo-notes { width: min(92vw, 560px); }
#focusOverlay .fo-exit { position: absolute; top: var(--s-5); inset-inline-end: var(--s-5); }

.health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s-4); }
.corr-card { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); border-radius: var(--r-md); background: var(--surface-2); }
.corr-val { font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: 800; flex: none; min-width: 4.5ch; text-align: center; }
.corr-bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; position: relative; }
.corr-bar > span { position: absolute; top: 0; bottom: 0; border-radius: 999px; }

/* ---- History & Statistics (Phase 8) -------------------------------------- */
.tl-group { display: flex; flex-direction: column; gap: var(--s-2); }
.tl-date { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-4) 0 var(--s-2); }
.tl-date .tl-lbl { font-weight: 700; font-size: var(--fs-sm); white-space: nowrap; }
.tl-date .tl-rule { flex: 1; height: 1px; background: var(--border); }
.tl-date .tl-cnt { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.tl-item { display: flex; align-items: flex-start; gap: var(--s-2); padding: 7px 9px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
.tl-item.clickable:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--border)); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.tl-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.tl-ic svg { width: 15px; height: 15px; }
.tl-body { flex: 1; min-width: 0; }
.tl-title { font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.tl-sub { font-size: var(--fs-xs); color: var(--text-3); }
.tl-time { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); flex: none; }
.type-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.rec-row { display: flex; align-items: center; gap: var(--s-2); padding: 8px 10px; border-radius: var(--r-md); background: var(--surface-2); }
.rec-row .rec-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.rec-row .rec-val { font-weight: 800; font-family: var(--font-mono); }

/* ---- Achievements & Search (Phase 9) ------------------------------------- */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: var(--s-2); }
.ach-item { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: var(--s-3) var(--s-2); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid transparent;
  transition: transform var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease); }
.ach-item.on { background: color-mix(in srgb, var(--brand) 9%, var(--surface)); border-color: color-mix(in srgb, var(--brand) 38%, transparent); }
.ach-item.on:hover { transform: translateY(-2px); }
.ach-badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
  background: var(--surface-3); position: relative; }
.ach-item.on .ach-badge { background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 30%, transparent), color-mix(in srgb, var(--pink) 30%, transparent)); }
.ach-item.off .ach-badge { filter: grayscale(1); opacity: .45; }
.ach-name { font-size: var(--fs-sm); font-weight: 700; }
.ach-item.off .ach-name { color: var(--text-3); }
.ach-desc { font-size: 11px; color: var(--text-3); line-height: 1.4; }
.ach-date { font-size: 10px; color: var(--brand); font-weight: 700; }
.ach-xp { font-size: 10px; font-weight: 800; color: var(--orange); }

.cmd-item .cmd-sub { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-item .cmd-txt { min-width: 0; display: flex; flex-direction: column; }
.cmd-item mark { background: color-mix(in srgb, var(--brand) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.cmd-recent { display: flex; gap: 6px; flex-wrap: wrap; padding: var(--s-2) var(--s-3); }
.cmd-recent .rc { font-size: var(--fs-xs); padding: 3px 10px; border-radius: 999px; background: var(--surface-2); cursor: pointer; color: var(--text-2); }
.cmd-recent .rc:hover { background: var(--surface-3); }

/* ---- Reviews & Notifications (Phase 10) ---------------------------------- */
.rv-list { display: flex; flex-direction: column; gap: 6px; }
.rv-line { display: flex; align-items: center; gap: 9px; padding: 7px 11px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); }
.rv-line .rv-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.rv-line.done .rv-txt { color: var(--text-2); }
.rv-line.miss .rv-txt { color: var(--text-2); }
.rv-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.notif-wrap { position: relative; }
.notif-badge { position: absolute; top: 3px; inset-inline-end: 3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
  display: grid; place-items: center; pointer-events: none; }
.notif-panel { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; width: min(320px, calc(100vw - 32px));
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  z-index: var(--z-sheet); overflow: hidden; animation: modalIn var(--dur-2) var(--ease) both; }
.notif-head { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border); }
.notif-body { max-height: 55vh; overflow-y: auto; padding: var(--s-2); }
.notif-item { display: flex; align-items: flex-start; gap: var(--s-2); padding: 8px 9px; border-radius: var(--r-md); cursor: pointer; }
.notif-item:hover { background: var(--surface-2); }
.notif-item.unread { background: color-mix(in srgb, var(--brand) 7%, transparent); }
.notif-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.notif-ic svg { width: 15px; height: 15px; }
.notif-t { font-size: var(--fs-sm); font-weight: 600; }
.notif-s { font-size: var(--fs-xs); color: var(--text-3); }
.notif-when { font-size: 10px; color: var(--text-3); flex: none; font-family: var(--font-mono); }

/* ---- Lock screen & Recovery (Phase 11) ----------------------------------- */
#lockScreen { position: fixed; inset: 0; z-index: 300; display: none; place-items: center;
  background: var(--bg); padding: var(--s-5); }
#lockScreen.on { display: grid; animation: fade var(--dur-3) var(--ease) both; }
.lock-box { width: 100%; max-width: 330px; display: flex; flex-direction: column; align-items: center; gap: var(--s-5); }
.lock-mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--pink)); box-shadow: var(--shadow-lg); }
.lock-mark svg { width: 30px; height: 30px; }
.lock-dots { display: flex; gap: 12px; }
.lock-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-3);
  transition: background var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
.lock-dot.on { background: var(--brand); transform: scale(1.15); }
.lock-box.shake { animation: shake .4s var(--ease); }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); width: 100%; }
/* 52px: a PIN keypad is pure touch, so it keeps a generous target. */
.keypad button { height: 52px; border-radius: var(--r-lg); background: var(--surface-2); font-size: var(--fs-xl); font-weight: 700;
  border: 1px solid var(--border); font-family: var(--font-mono);
  transition: background var(--dur-1) var(--ease), transform var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease); }
.keypad button:hover { background: color-mix(in srgb, var(--brand) 8%, var(--surface-2));
  border-color: color-mix(in srgb, var(--brand) 30%, var(--border)); }
.keypad button:active { transform: scale(.94); }
.keypad button.fn { font-size: var(--fs-md); color: var(--text-2); background: transparent; }
.keypad button.fn:hover { background: var(--surface-2); }
.keypad button.fn svg { width: 20px; height: 20px; }
.lock-err { color: var(--red); font-size: var(--fs-sm); font-weight: 600; min-height: 20px; text-align: center; direction: ltr; }
.keypad button { direction: ltr; font-variant-numeric: tabular-nums; }
.lock-forgot { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 280px; padding: 12px; border: 1px dashed var(--border-strong); border-radius: var(--r-lg); background: var(--surface); }
.lock-forgot.hidden { display: none; }

.issue-row { display: flex; align-items: center; gap: var(--s-2); padding: 7px 9px; border-radius: var(--r-md); background: var(--surface-2); }
.issue-row .issue-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.issue-row .issue-ic svg { width: 14px; height: 14px; }
.issue-row .issue-count { font-family: var(--font-mono); font-weight: 800; font-size: var(--fs-sm); }
.health-hero { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-lg); }
.health-hero.ok { background: color-mix(in srgb, var(--green) 10%, var(--surface)); }
.health-hero.warn { background: color-mix(in srgb, var(--orange) 10%, var(--surface)); }
.health-hero .hh-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }

/* ---- Assistant / Insights (Phase 12) ------------------------------------- */
.next-card { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-4);
  border-radius: var(--r-lg); background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 12%, var(--surface)), var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand) 28%, transparent); }

/* ---------------------------------------------------------------------------
   1. EventBus — decoupled pub/sub between modules
   ------------------------------------------------------------------------- */
const Bus = (() => {
  const map = new Map();
  return {
    on(evt, fn) { if (!map.has(evt)) map.set(evt, new Set()); map.get(evt).add(fn); return () => Bus.off(evt, fn); },
    off(evt, fn) { map.get(evt)?.delete(fn); },
    emit(evt, data) { map.get(evt)?.forEach(fn => { try { fn(data); } catch (e) { console.error('Bus handler', evt, e); } });
      map.get('*')?.forEach(fn => { try { fn(evt, data); } catch (e) {} }); },
  };
})();

/* ---------------------------------------------------------------------------
   2. Prefs — localStorage for lightweight settings only (per PRD)
   ------------------------------------------------------------------------- */
const Prefs = (() => {
  const KEY = 'lifeos.prefs';
  const defaults = {
    theme: 'system', lang: 'fa', accent: '#7C5CFC', density: 'compact',
    lastPage: 'dashboard', sidebarCollapsed: false, weekStart: 0, timeFormat: '24',
    dateSystem: 'jalali', currency: 'IRT', fontSize: 100, animations: true,
    plannerName: 'Life OS', onboarded: false, browserNotif: false,
    pomoWork: 25, pomoBreak: 5, pomoLong: 15, pomoLongEvery: 4, pomoAuto: false,
  };
  let state = load();
  function load() {
    try { return { ...defaults, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; }
    catch { return { ...defaults }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
  return {
    get: (k) => (k ? state[k] : { ...state }),
    set(k, v) { state[k] = v; save(); Bus.emit('prefs:change', { key: k, value: v }); },
    patch(obj) { Object.assign(state, obj); save(); Bus.emit('prefs:change', { patch: obj }); },
    reset() { state = { ...defaults }; save(); },
    defaults,
  };
})();

/* ---------------------------------------------------------------------------
   3. Jalali calendar engine (jalaali-js algorithm — MIT, accurate)
   ------------------------------------------------------------------------- */
const Jalali = (() => {
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const div = (a, b) => ~~(a / b), mod = (a, b) => a - ~~(a / b) * b;
  function jalCal(jy, withoutLeap) {
    const bl = breaks.length; let gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump, leap, leapG, march, n, i;
    if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);
    for (i = 1; i < bl; i += 1) { jm = breaks[i]; jump = jm - jp; if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4); jp = jm; }
    n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    march = 20 + leapJ - leapG;
    if (!withoutLeap) { if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
      leap = mod(mod(n + 1, 33) - 1, 4); if (leap === -1) leap = 4; }
    return { leap, gy, march };
  }
  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752; return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631; j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308, gd = div(mod(i, 153), 5) + 1, gm = mod(div(i, 153), 12) + 1,
      gy = div(j, 1461) - 100100 + div(8 - gm, 6); return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) { const r = jalCal(jy, true); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1; }
  function d2j(jdn) {
    const gy = d2g(jdn).gy; let jy = gy - 621; const r = jalCal(jy, false), jdn1f = g2d(gy, 3, r.march);
    let jd, jm, k = jdn - jdn1f;
    if (k >= 0) { if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy, jm, jd }; } else k -= 186; }
    else { jy -= 1; k += 179; if (r.leap === 1) k += 1; }
    jm = 7 + div(k, 30); jd = mod(k, 30) + 1; return { jy, jm, jd };
  }
  const isLeap = (jy) => jalCal(jy, true).leap === 0;
  function monthLen(jy, jm) { if (jm <= 6) return 31; if (jm <= 11) return 30; return isLeap(jy) ? 30 : 29; }
  const months = { fa: ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
    en: ['Farvardin','Ordibehesht','Khordad','Tir','Mordad','Shahrivar','Mehr','Aban','Azar','Dey','Bahman','Esfand'] };
  /** Gregorian month names — used everywhere a SPECIFIC date is displayed
      (Jalali.label) when the user picks Gregorian as their calendar system.
      Month-GRID pages (Month/Week/Finance headers) keep paginating by Jalali
      month internally — a Jalali month spans two Gregorian months, so there is
      no single correct Gregorian month name for "the currently viewed page";
      re-paginating those by Gregorian month is a separate, larger rework. */
  const gregMonths = { fa: ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'],
    en: ['January','February','March','April','May','June','July','August','September','October','November','December'] };
  const calSystem = () => (Prefs.get('dateSystem') || 'jalali');
  const weekdays = { fa: ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
    en: ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'] };
  const weekdaysLong = { fa: ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
    en: ['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'] };

  /** JS getDay(): 0=Sun..6=Sat → Jalali week index where 0=Saturday */
  const weekIndex = (date) => (date.getDay() + 1) % 7;

  function fromDate(date = new Date()) { const j = d2j(g2d(date.getFullYear(), date.getMonth() + 1, date.getDate()));
    return { ...j, wd: weekIndex(date) }; }
  function toDate(jy, jm, jd) { const g = d2g(j2d(jy, jm, jd)); return new Date(g.gy, g.gm - 1, g.gd); }

  /* Date-key helpers: canonical 'jYYYY-MM-DD' string for storage + indexing. */
  const pad = (n) => String(n).padStart(2, '0');
  const key = (j) => `${j.jy}-${pad(j.jm)}-${pad(j.jd)}`;
  const keyFromDate = (date = new Date()) => key(fromDate(date));
  const parseKey = (k) => { const [jy, jm, jd] = k.split('-').map(Number); return { jy, jm, jd, wd: weekIndex(toDate(jy, jm, jd)) }; };
  const dateFromKey = (k) => { const { jy, jm, jd } = parseKey(k); return toDate(jy, jm, jd); };
  function addDays(k, n) { const d = dateFromKey(k); d.setDate(d.getDate() + n); return keyFromDate(d); }
  function diffDays(a, b) { return Math.round((dateFromKey(a) - dateFromKey(b)) / 86400000); }
  const todayKey = () => keyFromDate(new Date());
  function label(k, lang = I18n.get()) {
    if (calSystem() === 'gregorian') { const d = dateFromKey(k); return `${I18n.num(d.getDate())} ${gregMonths[lang][d.getMonth()]} ${I18n.num(d.getFullYear())}`; }
    const j = parseKey(k); return `${I18n.num(j.jd)} ${months[lang][j.jm - 1]} ${I18n.num(j.jy)}`;
  }
  /** Human relative date; returns null if outside today/±1 so caller can show absolute. */
  function relative(k) {
    const d = diffDays(k, todayKey());
    if (d === 0) return I18n.t('today'); if (d === 1) return I18n.t('tomorrow'); if (d === -1) return I18n.t('yesterday');
    return null;
  }
  function remainingInYear(j) {
    let total = 0; for (let m = 1; m <= 12; m++) total += monthLen(j.jy, m);
    let passed = 0; for (let m = 1; m < j.jm; m++) passed += monthLen(j.jy, m); passed += j.jd;
    return total - passed;
  }
  /** Week number within the Jalali year (1-based, week starts Saturday). */
  function weekOfYear(k) {
    const j = parseKey(k);
    let doy = j.jd; for (let m = 1; m < j.jm; m++) doy += monthLen(j.jy, m);
    const firstWd = parseKey(key({ jy: j.jy, jm: 1, jd: 1 })).wd; // weekday of Farvardin 1
    return Math.ceil((doy + firstWd) / 7);
  }

  return { fromDate, toDate, monthLen, isLeap, months, gregMonths, calSystem, weekdays, weekdaysLong, weekIndex, g2d, d2j, j2d, d2g,
    key, keyFromDate, parseKey, dateFromKey, addDays, diffDays, todayKey, label, relative, remainingInYear, weekOfYear };
})();

/* ---------------------------------------------------------------------------
   4b. JalaliPicker — Persian (Jalali) calendar date picker, used app-wide
   in place of the native Gregorian <input type="date">.
   value in/out: canonical Jalali key 'jYYYY-MM-DD' (or null when cleared).
   ------------------------------------------------------------------------- */
const JalaliPicker = (() => {
  const WD = { fa: ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'], en: ['Sa', 'Su', 'Mo', 'Tu', 'We', 'Th', 'Fr'] };

  /** Input-like button; opts: { value, onChange(key|null), allowClear=true, placeholder } */
  function input(opts = {}) {
    let cur = opts.value || null;
    const btn = el('button.input.jdp-input', { type: 'button' });
    const render = () => {
      btn.innerHTML = '';
      btn.classList.toggle('jdp-empty', !cur);
      btn.append(el('span', { text: cur ? Jalali.label(cur) : (opts.placeholder || I18n.t('selectDate')) }),
        el('span.jdp-ic', { html: icon('today') }));
    };
    btn.addEventListener('click', () => open(btn, cur, (k) => { cur = k; render(); opts.onChange && opts.onChange(k); }, opts.allowClear !== false));
    render();
    Object.defineProperty(btn, 'value', { get: () => cur || '', set(v) { cur = v || null; render(); } });
    return btn;
  }

  /** Popup calendar anchored to an element. */
  function open(anchor, selected, onPick, allowClear = true) {
    const lang = I18n.get();
    const today = Jalali.parseKey(Jalali.todayKey());
    const base = selected ? Jalali.parseKey(selected) : today;
    let view = { jy: base.jy, jm: base.jm };
    const pop = el('.jdp-pop', { role: 'dialog' });

    function build() {
      pop.innerHTML = '';
      const mSel = el('select.select.jdp-sel', { onchange: (e) => { view.jm = +e.target.value; build(); } },
        Jalali.months[lang].map((m, i) => el('option', { value: i + 1, text: m, selected: view.jm === i + 1 })));
      const years = []; for (let y = today.jy - 80; y <= today.jy + 20; y++) years.push(y);
      const ySel = el('select.select.jdp-sel', { onchange: (e) => { view.jy = +e.target.value; build(); } },
        years.map(y => el('option', { value: y, text: I18n.num(y), selected: view.jy === y })));
      pop.appendChild(el('.jdp-head', {}, [
        el('button.jdp-nav', { type: 'button', html: icon('chevR'), 'aria-label': I18n.t('prevMonth'), onclick: () => { view.jm--; if (view.jm < 1) { view.jm = 12; view.jy--; } build(); } }),
        mSel, ySel,
        el('button.jdp-nav', { type: 'button', html: icon('chevL'), 'aria-label': I18n.t('nextMonth'), onclick: () => { view.jm++; if (view.jm > 12) { view.jm = 1; view.jy++; } build(); } }),
      ]));
      const grid = el('.jdp-grid');
      WD[lang].forEach(w => grid.appendChild(el('.jdp-wd', { text: w })));
      const firstWd = Jalali.parseKey(Jalali.key({ jy: view.jy, jm: view.jm, jd: 1 })).wd;
      for (let i = 0; i < firstWd; i++) grid.appendChild(el('div'));
      const len = Jalali.monthLen(view.jy, view.jm);
      for (let d = 1; d <= len; d++) {
        const k = Jalali.key({ jy: view.jy, jm: view.jm, jd: d });
        const cls = '.jdp-day' + ((firstWd + d - 1) % 7 === 6 ? '.fri' : '')
          + (view.jy === today.jy && view.jm === today.jm && d === today.jd ? '.today' : '')
          + (k === selected ? '.on' : '');
        grid.appendChild(el('button' + cls, { type: 'button', text: I18n.num(d), onclick: () => { close(); onPick(k); } }));
      }
      pop.appendChild(grid);
      pop.appendChild(el('.jdp-foot', {}, [
        el('button.btn.sm.ghost', { type: 'button', text: I18n.t('today'), onclick: () => { close(); onPick(Jalali.todayKey()); } }),
        allowClear && selected ? el('button.btn.sm.ghost', { type: 'button', style: { color: 'var(--red)' }, text: I18n.t('clearDate'), onclick: () => { close(); onPick(null); } }) : null,
      ]));
    }
    build();
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    let top = r.bottom + 6;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
    const left = I18n.dir() === 'rtl' ? r.right - pop.offsetWidth : r.left;
    pop.style.top = top + 'px';
    pop.style.left = clamp(left, 8, Math.max(8, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    const close = () => { pop.remove(); document.removeEventListener('click', outside, true); document.removeEventListener('keydown', onEsc, true); };
    function outside(e) { if (!pop.contains(e.target)) close(); }
    function onEsc(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    setTimeout(() => { document.addEventListener('click', outside, true); document.addEventListener('keydown', onEsc, true); }, 0);
    return { close };
  }

  return { input, open };
})();

/* ---------------------------------------------------------------------------
   4c. TimePicker — companion to JalaliPicker for time-of-day fields, used
   app-wide in place of the native <input type="time">.
   value in/out: 'HH:MM' 24h string (or '' when cleared); display follows
   the timeFormat pref (12h/24h) like the dashboard clock.
   ------------------------------------------------------------------------- */
const TimePicker = (() => {
  const pad = (n) => String(n).padStart(2, '0');

  function fmt(v) {
    let [h, m] = v.split(':').map(Number);
    let suffix = '';
    if (Prefs.get('timeFormat') === '12') { suffix = h < 12 ? ' AM' : ' PM'; h = h % 12 || 12; }
    return I18n.num(`${pad(h)}:${pad(m)}`) + suffix;
  }

  /** Input-like button; opts: { value, onChange('HH:MM'|null), allowClear=true, placeholder } */
  function input(opts = {}) {
    let cur = opts.value || null;
    const btn = el('button.input.jdp-input', { type: 'button' });
    const render = () => {
      btn.innerHTML = '';
      btn.classList.toggle('jdp-empty', !cur);
      btn.append(el('span', { text: cur ? fmt(cur) : (opts.placeholder || I18n.t('selectTime')) }),
        el('span.jdp-ic', { html: icon('clock') }));
    };
    btn.addEventListener('click', () => open(btn, cur, (v) => { cur = v; render(); opts.onChange && opts.onChange(v); }, opts.allowClear !== false));
    render();
    Object.defineProperty(btn, 'value', { get: () => cur || '', set(v) { cur = v || null; render(); } });
    return btn;
  }

  /** Popup with hour + minute columns; picking a minute commits and closes. */
  function open(anchor, selected, onPick, allowClear = true) {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();
    if (selected) { const p = selected.split(':').map(Number); h = p[0]; m = p[1]; }
    const pop = el('.jdp-pop.tp-pop', { role: 'dialog' });

    const col = (cap) => el('.tp-col-wrap', {}, [el('.tp-cap', { text: I18n.t(cap) }), el('.tp-col')]);
    const hWrap = col('tpHour'), mWrap = col('tpMinute');
    const hCol = hWrap.querySelector('.tp-col'), mCol = mWrap.querySelector('.tp-col');
    for (let i = 0; i < 24; i++) hCol.appendChild(el('button' + (i === h ? '.on' : ''), { type: 'button', text: I18n.num(pad(i)),
      onclick: (e) => { h = i; $$('button', hCol).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); } }));
    for (let i = 0; i < 60; i++) mCol.appendChild(el('button' + (i === m ? '.on' : ''), { type: 'button', text: I18n.num(pad(i)),
      onclick: () => { close(); onPick(`${pad(h)}:${pad(i)}`); } }));
    pop.appendChild(el('.tp-cols', {}, [hWrap, mWrap]));
    pop.appendChild(el('.jdp-foot', {}, [
      el('button.btn.sm.ghost', { type: 'button', text: I18n.t('timeNow'), onclick: () => { close(); const d = new Date(); onPick(`${pad(d.getHours())}:${pad(d.getMinutes())}`); } }),
      allowClear && selected ? el('button.btn.sm.ghost', { type: 'button', style: { color: 'var(--red)' }, text: I18n.t('clearDate'), onclick: () => { close(); onPick(null); } }) : null,
    ]));

    document.body.appendChild(pop);
    [hCol, mCol].forEach(c => { const on = c.querySelector('.on'); if (on) c.scrollTop = on.offsetTop - c.clientHeight / 2 + on.offsetHeight / 2; });
    const r = anchor.getBoundingClientRect();
    let top = r.bottom + 6;
    if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
    const left = I18n.dir() === 'rtl' ? r.right - pop.offsetWidth : r.left;
    pop.style.top = top + 'px';
    pop.style.left = clamp(left, 8, Math.max(8, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    const close = () => { pop.remove(); document.removeEventListener('click', outside, true); document.removeEventListener('keydown', onEsc, true); };
    function outside(e) { if (!pop.contains(e.target)) close(); }
    function onEsc(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    setTimeout(() => { document.addEventListener('click', outside, true); document.addEventListener('keydown', onEsc, true); }, 0);
    return { close };
  }

  return { input, open, fmt };
})();

/* ---------------------------------------------------------------------------
   5. Theme manager
   ------------------------------------------------------------------------- */
const Theme = (() => {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function resolved() { const th = Prefs.get('theme'); return th === 'system' ? (mq.matches ? 'dark' : 'light') : th; }
  function apply() {
    const r = resolved();
    document.documentElement.setAttribute('data-theme', r);
    const accent = Prefs.get('accent') || '#7C5CFC';
    document.documentElement.style.setProperty('--brand', accent);
    document.documentElement.style.setProperty('--brand-600', shade(accent, -8));
    document.documentElement.style.setProperty('--brand-700', shade(accent, -18));
    const meta = document.querySelector('meta[name="theme-color"]');
    // Matches --bg-elev (the topbar), not the accent: without viewport-fit=cover
    // the OS status bar is painted with this colour, so it has to blend into the
    // topbar instead of showing a purple stripe above it.
    if (meta) meta.setAttribute('content', r === 'dark' ? '#16181F' : '#FFFFFF');
    // Two multipliers, no px values: the bases live in :root so the responsive
    // @media overrides still win. (Writing --fs-* directly here used to make
    // every media-query font override dead code — inline style always wins.)
    document.documentElement.style.setProperty('--fs-scale', String((Prefs.get('fontSize') || 100) / 100));
    // 'cozy' is opt-in. Old installs have the retired 'comfortable' value saved,
    // and everything that isn't 'cozy' means compact — so they land on the new
    // default without a migration.
    document.documentElement.style.setProperty('--sp-scale', Prefs.get('density') === 'cozy' ? '1.15' : '1');
    Bus.emit('theme:change', r);
  }
  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = pct < 0 ? 0 : 255, p = Math.abs(pct) / 100;
    r = Math.round((f - r) * p) + r; g = Math.round((f - g) * p) + g; b = Math.round((f - b) * p) + b;
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function set(theme) { Prefs.set('theme', theme); apply(); }
  mq.addEventListener('change', () => { if (Prefs.get('theme') === 'system') apply(); });
  return { apply, set, resolved };
})();

/* ---------------------------------------------------------------------------
   6. Database — IndexedDB layer (versioning, migration, repair, backup, I/O)
   ------------------------------------------------------------------------- */
const DB = (() => {
  const NAME = 'lifeos', VERSION = 2;
  /** Store schema: forward-compatible with all planned modules. */
  const STORES = {
    tasks:        { key: 'id', indexes: [['date','date'],['goalId','goalId'],['status','status'],['updatedAt','updatedAt']] },
    goals:        { key: 'id', indexes: [['parentId','parentId'],['status','status'],['updatedAt','updatedAt']] },
    habits:       { key: 'id', indexes: [['status','status'],['updatedAt','updatedAt']] },
    habitRecords: { key: 'id', indexes: [['habitId','habitId'],['date','date']] },
    notes:        { key: 'id', indexes: [['folderId','folderId'],['pinned','pinned'],['updatedAt','updatedAt']] },
    folders:      { key: 'id', indexes: [['parentId','parentId']] },
    transactions: { key: 'id', indexes: [['date','date'],['accountId','accountId'],['category','category'],['type','type']] },
    accounts:     { key: 'id', indexes: [['type','type']] },
    budgets:      { key: 'id', indexes: [['period','period']] },
    health:       { key: 'id', indexes: [['date','date']] },
    focus:        { key: 'id', indexes: [['date','date']] },
    days:         { key: 'id', indexes: [['date','date']] },
    reviews:      { key: 'id', indexes: [['kind','kind'],['date','date']] },
    achievements: { key: 'id', indexes: [['unlockedAt','unlockedAt']] },
    xpLog:        { key: 'id', indexes: [['date','date']] },
    events:       { key: 'id', indexes: [['date','date']] },
    weeks:        { key: 'id', indexes: [['archived','archived']] },
    kv:           { key: 'k', indexes: [] },
  };
  let db = null;

  function open() {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(NAME, VERSION); }
      catch (e) { return reject(e); }
      req.onupgradeneeded = (e) => {
        const idb = e.target.result;
        for (const [name, cfg] of Object.entries(STORES)) {
          let store;
          if (!idb.objectStoreNames.contains(name)) store = idb.createObjectStore(name, { keyPath: cfg.key });
          else store = req.transaction.objectStore(name);
          for (const [idxName, path] of cfg.indexes) {
            if (!store.indexNames.contains(idxName)) store.createIndex(idxName, path, { unique: false });
          }
        }
        Bus.emit('db:migrate', { from: e.oldVersion, to: VERSION });
      };
      req.onsuccess = (e) => { db = e.target.result;
        db.onversionchange = () => { db.close(); UI.toast('info', 'Database updated in another tab. Reload.'); };
        resolve(db); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('DB blocked'));
    });
  }

  const tx = (names, mode = 'readonly') => db.transaction(names, mode);
  function reqP(request) { return new Promise((res, rej) => { request.onsuccess = () => res(request.result); request.onerror = () => rej(request.error); }); }

  /** Attach standard metadata for cloud-sync readiness. */
  function stamp(obj, isNew) {
    const now = Date.now();
    if (isNew) { obj.id = obj.id || uid(); obj.createdAt = obj.createdAt || now; obj.version = 1; obj.deletedAt = obj.deletedAt || null; obj.syncStatus = 'local'; }
    obj.updatedAt = now;
    if (!isNew) { obj.version = (obj.version || 1) + 1; obj.syncStatus = 'local'; }
    return obj;
  }

  async function put(store, obj) {
    const isNew = !obj.id || !(await get(store, obj.id));
    stamp(obj, isNew);
    await reqP(tx([store], 'readwrite').objectStore(store).put(obj));
    Bus.emit('data:change', { store, id: obj.id, op: isNew ? 'create' : 'update' });
    return obj;
  }
  async function bulkPut(store, arr) {
    const t = tx([store], 'readwrite'), s = t.objectStore(store);
    for (const o of arr) { const isNew = !o.id; stamp(o, isNew); s.put(o); }
    await new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
    Bus.emit('data:change', { store, op: 'bulk' });
  }
  const get = (store, id) => reqP(tx([store]).objectStore(store).get(id));
  async function all(store, { includeDeleted = false } = {}) {
    const r = await reqP(tx([store]).objectStore(store).getAll());
    return includeDeleted ? r : r.filter(o => !o.deletedAt);
  }
  /** Inclusive range query over an index — lets date-scoped views read only the
      rows they display instead of scanning the whole store. */
  async function range(store, index, lower, upper, { includeDeleted = false } = {}) {
    const r = await reqP(tx([store]).objectStore(store).index(index).getAll(IDBKeyRange.bound(lower, upper)));
    return includeDeleted ? r : r.filter(o => !o.deletedAt);
  }
  async function byIndex(store, index, value, { includeDeleted = false } = {}) {
    const r = await reqP(tx([store]).objectStore(store).index(index).getAll(value));
    return includeDeleted ? r : r.filter(o => !o.deletedAt);
  }
  async function softDelete(store, id) {
    const o = await get(store, id); if (!o) return;
    o.deletedAt = Date.now(); await put(store, o);
    Bus.emit('data:change', { store, id, op: 'delete' });
  }
  async function hardDelete(store, id) { await reqP(tx([store], 'readwrite').objectStore(store).delete(id));
    Bus.emit('data:change', { store, id, op: 'destroy' }); }
  async function count(store) { return reqP(tx([store]).objectStore(store).count()); }
  async function clearStore(store) { await reqP(tx([store], 'readwrite').objectStore(store).clear()); }

  /** KV helpers (for module state that isn't a full collection). */
  const kvGet = async (k) => (await get('kv', k))?.v;
  const kvSet = (k, v) => reqP(tx(['kv'], 'readwrite').objectStore('kv').put({ k, v }));

  async function counts() { const out = {}; for (const s of Object.keys(STORES)) out[s] = await count(s); return out; }

  /** Full export snapshot (for backup + manual export). */
  /** kv rows holding credentials must never travel inside an export/backup. */
  const SECRET_KV = { ai: ['apiKey'], lock: ['hash', 'salt'] };
  function redactKv(rows) {
    return rows.map(r => {
      const fields = SECRET_KV[r && r.k];
      if (!fields || !r.v || typeof r.v !== 'object') return r;
      const v = { ...r.v };
      fields.forEach(f => { if (v[f]) v[f] = null; });
      return { ...r, v, _redacted: fields };
    });
  }
  /** A backup must never contain other backups — kv holds snapshot rows, so
      including them would nest each backup inside the next and grow the export
      exponentially (this blew past V8's max string length at PRD scale). */
  const isBackupRow = (r) => r && typeof r.k === 'string' && (r.k === 'backups' || r.k.startsWith('backup:'));
  async function exportAll() {
    const data = {};
    for (const s of Object.keys(STORES)) data[s] = await all(s, { includeDeleted: true });
    data.kv = redactKv(data.kv.filter(r => !isBackupRow(r)));
    return { app: 'lifeos', schema: VERSION, exportedAt: Date.now(), prefs: Prefs.get(), data };
  }
  async function importAll(payload, { merge = false } = {}) {
    if (!payload || payload.app !== 'lifeos' || !payload.data) throw new Error('bad payload');
    // Credentials were stripped on export, so a restore must not clobber the
    // ones living on this device — otherwise restoring would silently remove
    // the user's PIN and API key.
    const localSecrets = {};
    for (const k of Object.keys(SECRET_KV)) { const row = await get('kv', k); if (row) localSecrets[k] = row.v; }

    for (const s of Object.keys(STORES)) {
      if (!payload.data[s]) continue;
      if (!merge) await clearStore(s);
      let rows = payload.data[s].map(o => ({ ...o }));
      if (s === 'kv') rows = rows.map(r => {
        if (!r._redacted || !localSecrets[r.k]) return r;
        const v = { ...(r.v || {}) };
        r._redacted.forEach(f => { v[f] = localSecrets[r.k][f]; });
        const { _redacted, ...rest } = r;
        return { ...rest, v };
      });
      await bulkPut(s, rows);
    }
    if (payload.prefs) Prefs.patch(payload.prefs);
    Bus.emit('data:change', { store: '*', op: 'import' });
  }

  /** Rolling local backups (last 5). Each snapshot lives in its OWN kv row and
      the `backups` row holds only lightweight metadata — keeping them together
      meant listing backups had to deserialize every full snapshot, and each new
      backup rewrote all of them. */
  const BK_ROW = (id) => 'backup:' + id;
  async function backup(reason = 'manual') {
    const snap = await exportAll();
    // Size is measured per store; one combined stringify can exceed the
    // engine's max string length on large databases.
    let size = 0;
    for (const rows of Object.values(snap.data)) { try { size += JSON.stringify(rows).length; } catch { /* store too large to measure */ } }
    const meta = { id: uid(), at: Date.now(), reason, size };
    await kvSet(BK_ROW(meta.id), snap);
    // Move any snapshots still stored inline by the old format into their own
    // rows first, so they stay restorable after the metadata is slimmed down.
    const raw = (await kvGet('backups')) || [];
    for (const r of raw) if (r && r.snap) await kvSet(BK_ROW(r.id), r.snap);
    const list = raw.map(({ snap: _s, ...m }) => m);
    list.unshift(meta);
    const dropped = list.splice(5);
    for (const d of dropped) await hardDelete('kv', BK_ROW(d.id)).catch(() => {});
    await kvSet('backups', list);
    Bus.emit('backup:done', { reason });
    return meta;
  }
  /** Metadata only — never touches snapshot payloads. */
  async function backups() {
    const raw = (await kvGet('backups')) || [];
    // Tolerate rows written by the older single-row format.
    return raw.map(({ snap, ...m }) => m);
  }
  async function restore(id) {
    const direct = await kvGet(BK_ROW(id));
    if (direct) { await importAll(direct); return true; }
    const list = (await kvGet('backups')) || []; const b = list.find(x => x.id === id);
    if (!b) throw new Error('not found'); await importAll(b.snap); return true; }

  /** Health check / repair — verifies stores exist, prunes corrupt rows. */
  async function repair() {
    let fixed = 0;
    for (const s of Object.keys(STORES)) {
      const rows = await all(s, { includeDeleted: true });
      for (const o of rows) {
        if (o == null || typeof o !== 'object' || o[STORES[s].key] == null) { fixed++; continue; }
        if (!o.createdAt || !o.updatedAt) { o.createdAt = o.createdAt || Date.now(); o.updatedAt = o.updatedAt || Date.now(); await put(s, o); fixed++; }
      }
    }
    return { fixed };
  }

  return { open, put, bulkPut, get, all, byIndex, softDelete, hardDelete, count, counts,
    clearStore, kvGet, kvSet, exportAll, importAll, backup, backups, restore, repair, range, STORES, VERSION };
})();

/* ---------------------------------------------------------------------------
   7. UI utilities — toast, modal, confirm
   ------------------------------------------------------------------------- */
const UI = (() => {
  function toast(type, msg, title) {
    const icons = { success: 'check', error: 'x', info: 'info' };
    const node = el('.toast.' + type, { role: 'status' }, [
      el('.t-ic', { html: icon(icons[type] || 'info') }),
      el('.t-body', {}, [ title ? el('.t-title', { text: title }) : null, el('.t-msg', { text: msg }) ]),
    ]);
    $('#toasts').appendChild(node);
    setTimeout(() => { node.classList.add('out'); setTimeout(() => node.remove(), 220); }, 3200);
  }
  /** `sheet: true` bottom-anchors the same dialog (mobile navigation, pickers).
      It's a flag rather than a second component so Esc, scrim-click, focus and
      the close promise stay in one place. */
  function modal({ title, body, actions = [], width, sheet }) {
    return new Promise((resolve) => {
      const ov = el('.overlay' + (sheet ? '.sheet' : ''), { onclick: (e) => { if (e.target === ov) close(null); } });
      const box = el('.modal', width && !sheet ? { style: { maxWidth: width } } : {});
      const head = el('.modal-head', {}, [
        el('.h4.grow', { text: title }),
        el('button.tb-btn', { html: icon('x'), 'aria-label': I18n.t('close'), onclick: () => close(null) }),
      ]);
      const bodyNode = el('.modal-body'); if (typeof body === 'string') bodyNode.innerHTML = body; else if (body) bodyNode.appendChild(body);
      const foot = el('.modal-foot');
      actions.forEach(a => foot.appendChild(el('button.btn' + (a.variant ? '.' + a.variant : ''),
        { text: a.label, onclick: () => close(a.value) })));
      box.append(head, bodyNode, actions.length ? foot : el('div'));
      ov.appendChild(box); document.body.appendChild(ov);
      function close(v) { ov.style.animation = 'fade var(--dur-2) reverse'; setTimeout(() => ov.remove(), 160); document.removeEventListener('keydown', esc); resolve(v); }
      function esc(e) { if (e.key === 'Escape') close(null); }
      document.addEventListener('keydown', esc);
      setTimeout(() => box.querySelector('input,button.primary,button')?.focus(), 60);
    });
  }
  async function confirm({ title, message, danger, confirmLabel, cancelLabel } = {}) {
    const v = await modal({
      title: title || I18n.t('confirm'),
      body: el('.muted', { text: message || '' }),
      actions: [
        { label: cancelLabel || I18n.t('cancel'), value: false, variant: 'ghost' },
        { label: confirmLabel || I18n.t('confirm'), value: true, variant: danger ? 'danger' : 'primary' },
      ],
    });
    return !!v;
  }
  return { toast, modal, confirm };
})();

/* ---------------------------------------------------------------------------
   8. Router — hash based, page registry, transitions
   ------------------------------------------------------------------------- */
const Router = (() => {
  const routes = new Map();
  let current = null, currentKey = null;
  function register(name, def) { routes.set(name, def); }
  function go(name, params) { const target = routes.has(name) ? name : 'dashboard';
    location.hash = '#/' + target + (params ? '?' + new URLSearchParams(params) : ''); }
  function parse() { const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?');
    return { name: path || Prefs.get('lastPage') || 'dashboard', params: Object.fromEntries(new URLSearchParams(qs || '')) }; }
  async function render() {
    const { name, params } = parse();
    const def = routes.get(name) || routes.get('dashboard');
    /* Same page + params → "soft" data refresh: build off-DOM first (no blank
       flash), keep scroll position, skip entrance animations. Real navigation
       keeps the animated top-of-page render. */
    const key = name + '?' + new URLSearchParams(params);
    const soft = key === currentKey;
    current = name; currentKey = key; Prefs.set('lastPage', name);
    const view = $('#view'); if (!view) return;
    const prevScroll = view.scrollTop;
    const inner = el('.view-inner' + (soft ? '.soft' : ''));
    try {
      const content = await def.render(params);
      if (content) inner.appendChild(typeof content === 'string' ? el('div', { html: content }) : content);
    } catch (e) { console.error(e); inner.appendChild(Views.errorState(e.message)); }
    view.innerHTML = '';
    view.appendChild(inner);
    Layout.setActive(name);
    Layout.setTitle(def.title ? def.title() : I18n.t('nav_' + name) || name);
    view.scrollTop = soft ? prevScroll : 0;
    Bus.emit('route:change', { name, params });
  }
  function init() { window.addEventListener('hashchange', render); if (!location.hash) go(Prefs.get('lastPage') || 'dashboard'); else render(); }
  return { register, go, render, init, current: () => current };
})();

/* ---------------------------------------------------------------------------
   9. Layout — sidebar, topbar, bottom nav
   ------------------------------------------------------------------------- */
const Layout = (() => {
  const NAV = [
    { section: 'sec_main', items: [
      { name: 'dashboard', icon: 'dashboard' }, { name: 'today', icon: 'today' },
      { name: 'week', icon: 'week' }, { name: 'month', icon: 'month' },
    ]},
    { section: 'sec_manage', items: [
      { name: 'goals', icon: 'goals' }, { name: 'roadmap', icon: 'roadmap' },
      { name: 'habits', icon: 'habits' }, { name: 'notes', icon: 'notes' }, { name: 'finance', icon: 'finance' },
    ]},
    { section: 'sec_insight', items: [
      { name: 'health', icon: 'health' }, { name: 'focus', icon: 'focus' },
      { name: 'assistant', icon: 'sparkles' }, { name: 'reviews', icon: 'review' },
      { name: 'history', icon: 'history' }, { name: 'stats', icon: 'stats' },
    ]},
  ];
  /* Bottom bar: three pages, a central add button, and "more". Everything not
     in TABS is one tap away in the More sheet, which is built from NAV so it
     can never drift out of sync with the sidebar. */
  const TABS = ['dashboard', 'today', 'habits'];

  function build() {
    const app = $('#app');
    app.innerHTML = '';
    const collapsed = Prefs.get('sidebarCollapsed');
    const shell = el('.shell' + (collapsed ? '.collapsed' : ''), { id: 'shell' });

    /* Sidebar */
    const sidebar = el('.sidebar');
    sidebar.append(
      el('.sb-head', {}, [
        el('.sb-logo', { html: LOGO_SVG }),
        el('.col.grow', {}, [ el('.sb-title', { text: Prefs.get('plannerName') || I18n.t('appName') }), el('.sb-sub', { text: I18n.t('tagline') }) ]),
      ]),
      el('.sb-search', {}, [
        el('button', { onclick: () => Command.open() }, [
          el('span', { html: icon('search') }),
          el('span.search-txt.grow', { text: I18n.t('search'), style: { textAlign: 'start' } }),
          el('kbd.kbd', { text: 'Ctrl K' }),
        ]),
      ]),
    );
    const nav = el('.nav');
    NAV.forEach(group => {
      nav.appendChild(el('.sb-section-label', { text: I18n.t(group.section) }));
      group.items.forEach(it => nav.appendChild(navItem(it)));
    });
    sidebar.appendChild(nav);
    sidebar.appendChild(el('.sb-foot', {}, [
      navItem({ name: 'settings', icon: 'settings' }),
      el('.nav-item.clickable.sb-collapse-btn', { onclick: toggleCollapse, title: I18n.t(collapsed ? 'expand' : 'collapse') }, [
        el('.nav-ic', { html: icon(collapsed ? 'chevL' : 'chevR') }),
        el('.nav-label.sb-foot-txt', { text: I18n.t(collapsed ? 'expand' : 'collapse') }),
      ]),
    ]));

    /* Main */
    const main = el('.main');
    main.append(
      el('.topbar', {}, [
        el('.col.grow', { style: { minWidth: '0' } }, [ el('.tb-title', { id: 'tbTitle', text: '' }) ]),
        el('.tb-pill', { id: 'netPill' }, [ el('.dot'), el('span', { text: navigator.onLine ? I18n.t('online') : I18n.t('offline') }) ]),
        el('button.tb-btn', { id: 'themeBtn', html: icon(Theme.resolved() === 'dark' ? 'sun' : 'moon'),
          'aria-label': I18n.t('theme'), onclick: cycleTheme }),
        notifBell(),
        el('button.tb-btn', { html: icon('search'), 'aria-label': I18n.t('search'), onclick: () => Command.open() }),
      ]),
      el('.view', { id: 'view', role: 'main' }),
    );

    shell.append(sidebar, main);
    app.appendChild(shell);

    /* Bottom nav (mobile). Lives INSIDE .main (a 100dvh flex column) as a
       normal flow item, NOT position:fixed — iOS Safari's fixed-bottom
       tracking is buggy (as the toolbar collapses, a fixed bottom:0 bar
       drifts and leaves a dead gap below it). As a flex item at the end of a
       dvh-sized column it always sits flush on the real bottom edge. Hidden
       on desktop via `.botnav{display:none}` so it costs nothing there. */
    const bn = el('.botnav');
    const tabItem = (n) => el('.bn-item', { dataset: { nav: n }, onclick: () => Router.go(n) }, [
      el('.bn-ic', { html: icon(navIconFor(n)) }), el('span', { text: I18n.t('nav_' + n) }),
    ]);
    bn.append(
      tabItem('dashboard'), tabItem('today'),
      // Centre add button — replaces the floating FAB, which needed its own
      // magic offset above the bar and drifted on iOS.
      el('.bn-item.bn-add', { 'aria-label': I18n.t('addTask'), onclick: addForRoute }, [
        el('.bn-plus', { html: icon('plus') }),
      ]),
      tabItem('habits'),
      el('.bn-item.bn-more', { dataset: { nav: '__more' }, onclick: moreSheet }, [
        el('.bn-ic', { html: icon('menu') }), el('span', { text: I18n.t('more') }),
      ]),
    );
    main.appendChild(bn);

    app.classList.add('ready');
    app.setAttribute('aria-hidden', 'false');
  }

  function navIconFor(name) { for (const g of NAV) for (const it of g.items) if (it.name === name) return it.icon; return 'settings'; }

  /** The centre "+" adds whatever the page you're on is about. */
  function addForRoute() {
    const back = () => Router.render();
    switch (Router.current()) {
      case 'habits': return HabitsView.openEditor(null, back);
      case 'goals': case 'roadmap': return GoalsView.openEditor(null, back);
      case 'notes': return NotesView.createNote();
      case 'finance': return FinanceView.txEditor(null, back);
      default: return TaskUI.openEditor(null, () => {
        const r = Router.current();
        if (r === 'today' || r === 'dashboard' || r === 'week' || r === 'month') Router.render();
      }, { kind: 'daily', date: Jalali.todayKey() });
    }
  }

  /** Everything not on the bottom bar, grouped exactly as the sidebar groups it. */
  async function moreSheet() {
    const body = el('.col.gap-4');
    NAV.forEach(group => {
      const items = group.items.filter(it => !TABS.includes(it.name));
      if (!items.length) return;
      const list = el('.col');
      items.forEach(it => list.appendChild(el('.nav-item.clickable', { dataset: { nav: it.name },
        onclick: () => { closeSheet(); Router.go(it.name); } }, [
        el('.nav-ic', { html: icon(it.icon) }), el('.nav-label.grow', { text: I18n.t('nav_' + it.name) }),
      ])));
      body.append(el('.sb-section-label', { text: I18n.t(group.section) }), list);
    });
    const sysList = el('.col');
    [
      ['settings', 'settings', () => Router.go('settings')],
      ['search', 'search', () => Command.open()],
      ['theme', Theme.resolved() === 'dark' ? 'sun' : 'moon', cycleTheme],
    ].forEach(([key, ic, fn]) => sysList.appendChild(el('.nav-item.clickable', { onclick: () => { closeSheet(); fn(); } }, [
      el('.nav-ic', { html: icon(ic) }), el('.nav-label.grow', { text: I18n.t(key === 'settings' ? 'nav_settings' : key) }),
    ])));
    body.append(el('.sb-section-label', { text: I18n.t('sec_system') }), sysList);
    const closeSheet = () => $('.overlay.sheet')?.querySelector('.modal-head .tb-btn')?.click();
    await UI.modal({ title: I18n.t('more'), body, sheet: true });
  }

  /** Bell + unread badge; clicking toggles the notification panel. */
  function notifBell() {
    const wrap = el('.notif-wrap');
    const btn = el('button.tb-btn', { html: icon('bell'), 'aria-label': I18n.t('notifications'),
      onclick: (e) => { e.stopPropagation(); togglePanel(wrap); } });
    wrap.append(btn, el('.notif-badge.hidden', { id: 'notifBadge' }));
    refreshBadge();
    return wrap;
  }
  async function refreshBadge() {
    const badge = $('#notifBadge'); if (!badge) return;
    const n = (await Notify.unread()).length;
    badge.textContent = I18n.num(n > 9 ? '9+' : n);
    badge.classList.toggle('hidden', n === 0);
  }
  async function togglePanel(wrap) {
    const existing = $('.notif-panel');
    if (existing) { existing.remove(); return; }
    const rows = (await Notify.all()).sort((a, b) => b.at - a.at).slice(0, 30);
    const panel = el('.notif-panel', { onclick: (e) => e.stopPropagation() });
    panel.appendChild(el('.notif-head', {}, [
      el('.h4.grow', { text: I18n.t('notificationCenter') }),
      rows.length ? el('button.btn.sm.ghost', { text: I18n.t('markAllRead'), onclick: async () => { await Notify.markAllRead(); panel.remove(); refreshBadge(); } }) : null,
      rows.length ? el('button.btn.sm.ghost', { html: icon('trash'), title: I18n.t('clearAllNotif'), onclick: async () => { await Notify.clearAll(); panel.remove(); refreshBadge(); } }) : null,
    ]));
    const body = el('.notif-body');
    if (!rows.length) body.appendChild(el('.state', { style: { padding: '28px' } }, [el('.dim', { text: I18n.t('noNotifications') })]));
    rows.forEach(r => {
      const st = Notify.STYLE[r.type] || Notify.STYLE.task;
      body.appendChild(el('.notif-item' + (r.read ? '' : '.unread'), { onclick: async () => {
        if (!r.read) { r.read = true; await DB.put('events', r); refreshBadge(); }
        panel.remove();
        if (r.type === 'task' || r.type === 'review') Today.goto(Jalali.todayKey());
        else if (r.type === 'habit' && r.refId) Router.go('habits', { id: r.refId });
        else if (r.type === 'goal' && r.refId) Router.go('goals', { id: r.refId });
        else if (r.type === 'budget') Router.go('finance');
      } }, [
        el('.notif-ic', { style: { background: `color-mix(in srgb, ${st.color} 16%, transparent)`, color: st.color }, html: icon(st.ic) }),
        el('.col.grow', { style: { minWidth: '0' } }, [el('.notif-t', { text: r.title }), r.body ? el('.notif-s', { text: r.body }) : null]),
        el('.notif-when', { text: Notify.rel(r.at) }),
      ]));
    });
    panel.appendChild(body);
    wrap.appendChild(panel);
    // Close on the next outside click.
    setTimeout(() => document.addEventListener('click', function off() { $('.notif-panel')?.remove(); document.removeEventListener('click', off); }, { once: true }), 0);
  }
  function navItem(it) {
    const go = () => Router.go(it.name);
    return el('.nav-item', { dataset: { nav: it.name }, role: 'link', tabindex: 0,
      onclick: go,
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } } }, [
      el('.nav-ic', { html: icon(it.icon) }),
      el('.nav-label.grow', { text: I18n.t('nav_' + it.name) }),
    ]);
  }
  function setActive(name) {
    $$('.nav-item[data-nav]').forEach(n => n.classList.toggle('active', n.dataset.nav === name));
    // "More" lights up for every page that isn't one of the three tabs, so the
    // bar always shows where you are.
    $$('.bn-item[data-nav]').forEach(n => n.classList.toggle('active',
      n.dataset.nav === '__more' ? !TABS.includes(name) : n.dataset.nav === name));
  }
  function setTitle(txt) { const t = $('#tbTitle'); if (t) t.textContent = txt; document.title = txt + ' · ' + I18n.t('appName'); }
  function toggleCollapse() { const c = !Prefs.get('sidebarCollapsed'); Prefs.set('sidebarCollapsed', c);
    $('#shell')?.classList.toggle('collapsed', c); }
  function cycleTheme() { const order = ['light', 'dark', 'system']; const cur = Prefs.get('theme');
    const next = order[(order.indexOf(cur) + 1) % order.length]; Theme.set(next);
    const b = $('#themeBtn'); if (b) b.innerHTML = icon(Theme.resolved() === 'dark' ? 'sun' : 'moon');
    UI.toast('info', I18n.t('theme') + ': ' + I18n.t('theme_' + next)); }

  function refreshNet() { const p = $('#netPill'); if (!p) return;
    p.querySelector('span').textContent = navigator.onLine ? I18n.t('online') : I18n.t('offline');
    p.querySelector('.dot').style.background = navigator.onLine ? 'var(--green)' : 'var(--text-3)'; }

  return { build, setActive, setTitle, refreshNet, refreshBadge, NAV };
})();

/* ---------------------------------------------------------------------------
   10. Command palette (Ctrl/Cmd + K)
   ------------------------------------------------------------------------- */
const Command = (() => {
  let items = [], filtered = [], sel = 0, open_ = false, lastQ = '';
  function collect() {
    const nav = [];
    Layout.NAV.forEach(g => g.items.forEach(it => nav.push({ group: 'cmd_nav', label: I18n.t('nav_' + it.name), icon: it.icon, run: () => Router.go(it.name) })));
    nav.push({ group: 'cmd_nav', label: I18n.t('nav_settings'), icon: 'settings', run: () => Router.go('settings') });
    const actions = [
      { group: 'cmd_actions', label: I18n.t('cmd_toggleTheme'), icon: 'moon', run: () => Theme.set(Theme.resolved() === 'dark' ? 'light' : 'dark') },
      { group: 'cmd_actions', label: I18n.t('cmd_toggleLang'), icon: 'globe', run: () => I18n.set(I18n.get() === 'fa' ? 'en' : 'fa') },
      { group: 'cmd_actions', label: I18n.t('cmd_backup'), icon: 'shield', run: async () => { await DB.backup('manual'); UI.toast('success', I18n.t('backupDone')); } },
      { group: 'cmd_actions', label: I18n.t('export'), icon: 'download', run: () => Settings.exportData() },
      { group: 'cmd_actions', label: I18n.t('lockNow'), icon: 'lock', run: () => Lock.config().enabled ? Lock.lock() : Router.go('settings') },
      { group: 'cmd_actions', label: I18n.t('enterFocus'), icon: 'expand', run: () => FocusView.openOverlay() },
      { group: 'cmd_actions', label: I18n.t('startTimer') + ' · ' + I18n.t('pomodoro'), icon: 'timer', run: () => { Focus.start(); Router.go('focus'); } },
    ];
    items = [...nav, ...actions];
  }
  function open() {
    collect(); open_ = true; sel = 0;
    const root = $('#cmd'); root.classList.add('open'); root.innerHTML = '';
    const box = el('.cmd-box');
    const input = el('input', { placeholder: I18n.t('searchEverything'), 'aria-label': I18n.t('search'),
      oninput: (e) => { filter(e.target.value); }, onkeydown: onKey });
    box.append(el('.cmd-input-row', {}, [ el('span', { html: icon('search'), style: { color: 'var(--text-3)' } }), input ]));
    const list = el('.cmd-list', { id: 'cmdList' });
    box.appendChild(list);
    root.appendChild(box);
    root.onclick = (e) => { if (e.target === root) close(); };
    filter(''); setTimeout(() => input.focus(), 40);
  }
  function close() { open_ = false; lastQ = ''; $('#cmd').classList.remove('open'); }
  /** Commands filter synchronously; user data is searched async and merged in. */
  function filter(q) {
    const raw = q.trim();
    lastQ = raw;
    const lc = raw.toLowerCase();
    const cmds = !lc ? items.slice() : items.filter(i => i.label.toLowerCase().includes(lc) || fuzzy(i.label.toLowerCase(), lc));
    filtered = cmds; sel = 0; renderList();
    if (lc.length >= 2) runSearch(raw, cmds);
  }
  const runSearch = debounce(async (raw, cmds) => {
    if (raw !== lastQ || !open_) return;               // a newer keystroke won.
    const hits = await Search.query(raw);
    if (raw !== lastQ || !open_) return;
    hits.forEach(h => { const go = h.run; h.run = () => { Search.addRecent(raw); go(); }; });
    filtered = [...cmds, ...hits]; sel = 0; renderList();
  }, 180);
  function fuzzy(text, q) { let i = 0; for (const c of q) { i = text.indexOf(c, i); if (i === -1) return false; i++; } return true; }
  async function renderList() {
    const list = $('#cmdList'); if (!list) return; list.innerHTML = '';
    let lastGroup = null;
    filtered.forEach((it, idx) => {
      if (it.group !== lastGroup) { list.appendChild(el('.cmd-group', { text: I18n.t(it.group) })); lastGroup = it.group; }
      const txt = el('.cmd-txt.grow');
      // Search hits arrive as pre-escaped HTML with <mark>; commands are plain text.
      txt.appendChild(it.group && it.group.startsWith('srch_') ? el('span', { html: it.label }) : el('span', { text: it.label }));
      if (it.sub) txt.appendChild(el('.cmd-sub', { text: it.sub }));
      list.appendChild(el('.cmd-item' + (idx === sel ? '.sel' : ''), { onclick: () => execute(idx),
        onmouseenter: () => { sel = idx; highlight(); } }, [
        el('span', { html: icon(it.icon || 'chevR') }), txt,
      ]));
    });
    if (!filtered.length) {
      list.appendChild(el('.state', { style: { padding: '32px' } }, [el('.dim', { text: lastQ ? I18n.t('noResults') : I18n.t('nothingHere') })]));
    }
    if (!lastQ) {
      const rec = await Search.recent();
      if (rec.length && open_ && !lastQ) {
        list.appendChild(el('.cmd-group', { text: I18n.t('recentSearches') }));
        const row = el('.cmd-recent');
        rec.forEach(r => row.appendChild(el('.rc', { text: r, onclick: () => { const inp = $('#cmd input'); if (inp) { inp.value = r; inp.focus(); } filter(r); } })));
        row.appendChild(el('.rc', { text: I18n.t('clearRecent'), style: { color: 'var(--red)' }, onclick: async () => { await Search.clearRecent(); renderList(); } }));
        list.appendChild(row);
      }
    }
  }
  function highlight() { $$('#cmdList .cmd-item').forEach((n, i) => n.classList.toggle('sel', i === sel)); }
  function onKey(e) {
    if (e.key === 'Escape') return close();
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = clamp(sel + 1, 0, filtered.length - 1); highlight(); scrollSel(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = clamp(sel - 1, 0, filtered.length - 1); highlight(); scrollSel(); }
    if (e.key === 'Enter') { e.preventDefault(); execute(sel); }
  }
  function scrollSel() { $$('#cmdList .cmd-item')[sel]?.scrollIntoView({ block: 'nearest' }); }
  function execute(idx) { const it = filtered[idx]; if (!it) return; close(); setTimeout(() => it.run(), 60); }
  return { open, close, isOpen: () => open_ };
})();

/* ---------------------------------------------------------------------------
   11. Shared view fragments (empty / loading / error / coming-soon)
   ------------------------------------------------------------------------- */
const Views = (() => {
  function emptyState(icName, title, msg, action) {
    return el('.state', {}, [
      el('.ic', { html: icon(icName) }),
      el('h3', { text: title }),
      msg ? el('p', { text: msg }) : null,
      action || null,
    ]);
  }
  function loadingState() {
    const wrap = el('.grid.g-4');
    for (let i = 0; i < 4; i++) wrap.appendChild(el('.card.pad', {}, [ el('.skeleton', { style: { height: '64px' } }) ]));
    return wrap;
  }
  function errorState(msg) { return emptyState('info', 'Error', msg || 'Something went wrong'); }
  function comingSoon(name) {
    return el('.col.gap-6', {}, [
      pageHeader(I18n.t('nav_' + name), I18n.t('comingSoon')),
      el('.card.pad', {}, [ emptyState('sparkles', I18n.t('comingSoon'), I18n.t('comingSoon_sub')) ]),
    ]);
  }
  function pageHeader(title, sub, actions) {
    return el('.row.between.wrap.gap-4', {}, [
      el('.col', {}, [ el('.h1', { text: title }), sub ? el('.muted', { text: sub }) : null ]),
      actions ? el('.row.gap-2', {}, actions) : null,
    ]);
  }

  /* --- Form primitives ----------------------------------------------------
     These were copy-pasted into six view modules with small drifts (only one
     copy supported `hint`). One definition here, everyone reuses it. */

  /** Labelled form row. An empty label renders no .label — otherwise a bare
      control (an emoji picker, say) gets a phantom gap above it. */
  function field(label, control, hint) {
    return el('.field', {}, [
      label ? el('.label', { text: label }) : null,
      control,
      hint ? el('.hint', { text: hint }) : null,
    ]);
  }

  /** Card section: title, optional action buttons, then the body. */
  function section(title, actions, children) {
    if (Array.isArray(actions) && children === undefined) { children = actions; actions = null; }
    return el('.card.pad.col.gap-4', {}, [
      actions
        ? el('.row.between.gap-3', {}, [ el('.h4.grow', { text: title }), el('.row.gap-2', {}, actions) ])
        : el('.h4', { text: title }),
      ...(Array.isArray(children) ? children : [children]),
    ]);
  }

  /** Label + control on one line, for settings-style lists. */
  function rowItem(label, control, hint) {
    return el('.row.between.gap-4', { style: { padding: '6px 0' } }, [
      el('.col', {}, [ el('.label', { text: label }), hint ? el('.hint', { text: hint }) : null ]),
      control,
    ]);
  }

  /** Progressive disclosure. Returns [button, wrap] to spread into a form:
      the essentials stay visible, the rest folds away. `openIf` starts it
      expanded when the record already has data hidden behind the fold —
      otherwise editing an existing item would look like data loss. */
  function advanced(children, { openIf = false, labelKey = 'moreOptions' } = {}) {
    const wrap = el('.col.gap-4' + (openIf ? '' : '.hidden'), {}, children.filter(Boolean));
    const btn = el('button.btn.sm.ghost' + (openIf ? '.open' : ''), { type: 'button', style: { alignSelf: 'start' },
      html: icon('chevD') + '<span>' + I18n.t(labelKey) + '</span>',
      onclick: () => { wrap.classList.toggle('hidden'); btn.classList.toggle('open'); } });
    return [btn, wrap];
  }

  /** Button group (the .pick pattern). `multi` toggles instead of replacing.
      options: [value, label] pairs. onChange receives the new value(s). */
  function picker(options, value, onChange, { multi = false, fontSize } = {}) {
    const row = el('.pick');
    const sel = multi ? new Set(value || []) : value;
    options.forEach(([val, label]) => {
      const on = multi ? sel.has(val) : val === value;
      row.appendChild(el('button' + (on ? '.on' : ''), { type: 'button', text: label,
        style: fontSize ? { fontSize } : null,
        onclick: (e) => {
          const b = e.currentTarget;
          if (multi) { sel.has(val) ? sel.delete(val) : sel.add(val); b.classList.toggle('on'); onChange([...sel]); }
          else { $$('button', row).forEach(x => x.classList.remove('on')); b.classList.add('on'); onChange(val); }
        } }));
    });
    return row;
  }

  /** Colour swatch row. */
  function swatches(colors, value, onChange) {
    const row = el('.swatches');
    colors.forEach(c => row.appendChild(el('.swatch' + (value === c ? '.on' : ''), { style: { background: c },
      onclick: (e) => { $$('.swatch', row).forEach(s => s.classList.remove('on')); e.currentTarget.classList.add('on'); onChange(c); } })));
    return row;
  }

  return { emptyState, loadingState, errorState, comingSoon, pageHeader, field, section, rowItem, advanced, picker, swatches };
})();

/* ---------------------------------------------------------------------------
   12. Dashboard (foundation shell — live clock, Jalali date, storage)
   ------------------------------------------------------------------------- */
const Dashboard = (() => {
  let clockTimer = null;
  function greeting() {
    const h = new Date().getHours();
    if (h < 5) return I18n.t('greeting_night'); if (h < 12) return I18n.t('greeting_morning');
    if (h < 14) return I18n.t('greeting_noon'); if (h < 18) return I18n.t('greeting_afternoon');
    if (h < 21) return I18n.t('greeting_evening'); return I18n.t('greeting_night');
  }
  function remainingDaysInYear(j) {
    let days = 0; for (let m = 1; m <= 12; m++) days += Jalali.monthLen(j.jy, m);
    let passed = 0; for (let m = 1; m < j.jm; m++) passed += Jalali.monthLen(j.jy, m); passed += j.jd;
    return days - passed;
  }
  async function render() {
    const j = Jalali.fromDate();
    const lang = I18n.get();
    const dateStr = `${I18n.num(j.jd)} ${Jalali.months[lang][j.jm - 1]} ${I18n.num(j.jy)}`;
    const wd = Jalali.weekdaysLong[lang][j.wd];
    const counts = await DB.counts();
    const totalRecords = Object.values(counts).reduce((a, b) => a + b, 0);

    // Real "today" signals
    const todayKey = Jalali.todayKey();
    const todayTasks = (await Tasks.forDate(todayKey)).filter(t => t.kind !== 'weekly');
    const doneToday = todayTasks.filter(t => t.completed).length;

      el('.card.pad.col.gap-4', {}, [

              activeToday ? el('.chip', {}, [ el('.dot', { style: { background: 'var(--brand)' } }), el('span', { text: `${I18n.t('inProgress')}: ${I18n.num(activeToday)}` }) ]) : null,

        ]),

    /* Stat tiles */

      { cap: I18n.t('inProgress'), num: I18n.num(activeToday), ic: 'focus', color: 'var(--brand)', go: 'today' },
      { cap: I18n.t('overdue'), num: I18n.num(overdueToday), ic: 'clock', color: overdueToday ? 'var(--red)' : 'var(--text-3)', go: 'today' },
      { cap: I18n.t('nav_goals'), num: I18n.num(counts.goals), ic: 'goals', color: 'var(--brand)', go: 'goals' },
    ];
    const grid = el('.grid.g-4');
    tiles.forEach(t => grid.appendChild(el('.card.pad.hover.stat.clickable', { style: { '--tile-c': t.color }, onclick: () => Router.go(t.go) }, [
