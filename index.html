      gCard.appendChild(gl);
      wrap.appendChild(gCard);
    }

    /* Today's habits widget */
    const habits = (await DB.all('habits')).filter(h => h.status !== 'archived');
    if (habits.length) {
      const hCard = el('.card.pad.col.gap-3', {}, [
        el('.row.between', {}, [wTitle('habits', 'var(--green)', I18n.t('todaysHabits')),
          el('button.btn.sm.ghost', { html: '<span>' + I18n.t('nav_habits') + '</span>' + icon('arrowR'), onclick: () => Router.go('habits') })]),
      ]);
      const hl = el('.col.gap-2');
      for (const h of habits.slice(0, 5)) { const map = await Habits.recordsMap(h.id); hl.appendChild(HabitsView.row(h, map)); }
      hCard.appendChild(hl);
      wrap.appendChild(hCard);
    }

    /* Recent & pinned notes widget */
    const allNotes = await DB.all('notes');
    if (allNotes.length) {
      const recent = allNotes.slice().sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.updatedAt || 0) - (a.updatedAt || 0))).slice(0, 4);
      const nCard = el('.card.pad.col.gap-3', {}, [
        el('.row.between', {}, [wTitle('notes', 'var(--orange)', I18n.t('recentNotes')),
          el('button.btn.sm.ghost', { html: '<span>' + I18n.t('nav_notes') + '</span>' + icon('arrowR'), onclick: () => Router.go('notes') })]),
      ]);
      const nl = el('.grid.g-2');
      recent.forEach(n => nl.appendChild(el('.note-card', { onclick: () => NotesView.open(n.id) }, [
        el('.nt', {}, [n.pinned ? el('span.note-pin', { html: icon('pin') }) : null, el('span', { text: n.title || I18n.t('emptyNote') })]),
        el('.nsnip', { text: Markdown.plainAny(n.content).slice(0, 90) }),
      ])));
      nCard.appendChild(nl);
      wrap.appendChild(nCard);
    }

    /* Finance snapshot widget */
    const finTx = await DB.all('transactions');
    if (finTx.length) {
      const jn = Jalali.fromDate();
      const mk = Finance.monthKeys(jn.jy, jn.jm);
      const mt = Finance.totals(finTx.filter(t => mk.includes(t.date)));
      const accts = (await DB.all('accounts')).filter(a => !a.archived);
      const worth = accts.reduce((s, a) => s + Finance.balance(a, finTx), 0);
      wrap.appendChild(el('.card.pad.col.gap-3', {}, [
        el('.row.between', {}, [wTitle('finance', 'var(--teal)', I18n.t('nav_finance')),
          el('button.btn.sm.ghost', { html: '<span>' + I18n.t('fin_overview') + '</span>' + icon('arrowR'), onclick: () => Router.go('finance') })]),
        el('.grid.g-3', {}, [
          el('.col', {}, [el('.cap.dim.xs', { text: I18n.t('income') }), el('.mono', { style: { fontWeight: '800', color: 'var(--green)' }, text: Finance.fmt(mt.income) })]),
          el('.col', {}, [el('.cap.dim.xs', { text: I18n.t('expense') }), el('.mono', { style: { fontWeight: '800', color: 'var(--red)' }, text: Finance.fmt(mt.expense) })]),
          el('.col', {}, [el('.cap.dim.xs', { text: I18n.t('netWorth') }), el('.mono', { style: { fontWeight: '800' }, text: Finance.fmt(worth) })]),
        ]),
      ]));
    }

    /* Focus + health snapshot */
    const fs = await Focus.stats();
    const todayKeyD = Jalali.todayKey();
    const dayRec = await DB.get('days', todayKeyD);
    const ck = (dayRec && dayRec.checkin) || {};
    const sleepH = Health.sleepHours(ck);
    const snap = [
      { cap: I18n.t('sessionsToday'), num: I18n.num(fs.today), ic: 'timer', color: 'var(--brand)', go: 'focus' },
      { cap: I18n.t('focusHours'), num: I18n.num((fs.todaySec / 3600).toFixed(1)), ic: 'clock', color: 'var(--blue)', go: 'focus' },
      { cap: I18n.t('sleepHours'), num: sleepH == null ? '—' : I18n.num(sleepH), ic: 'moon', color: 'var(--teal)', go: 'health' },
      { cap: I18n.t('mood'), num: ck.mood ? Health.MOOD_EMO[ck.mood] : '—', ic: 'health', color: 'var(--pink)', go: 'health' },
    ];
    const snapGrid = el('.grid.g-4');
    snap.forEach(t => snapGrid.appendChild(el('.card.pad.hover.clickable.stat', { style: { '--tile-c': t.color }, onclick: () => Router.go(t.go) }, [
      el('.row.between', {}, [
        el('.col', {}, [el('.cap', { text: t.cap }), el('.num', { text: t.num })]),
        el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) }),
      ]),
    ])));
    wrap.appendChild(snapGrid);

    /* Best next action — computed locally */
    const rankedTop = (await Insights.rankTasks())[0];
    if (rankedTop) {
      wrap.appendChild(el('.card.pad.col.gap-3', {}, [
        el('.row.between', {}, [
          wTitle('bolt', 'var(--brand)', I18n.t('nextAction')),
          el('button.btn.sm.ghost', { html: '<span>' + I18n.t('assistant') + '</span>' + icon('arrowR'), onclick: () => Router.go('assistant') }),
        ]),
        el('.next-card', {}, [
          el('.next-rank', { html: icon('bolt') }),
          el('.col.grow', { style: { minWidth: '0' } }, [
            el('.h4', { text: rankedTop.task.title }),
            el('.why-chips', {}, rankedTop.why.slice(0, 3).map(w => el('.why-chip', { text: I18n.t(w) }))),
          ]),
          el('button.btn.sm.primary', { text: I18n.t('doItNow'), onclick: () => { Focus.start(rankedTop.task); Router.go('focus'); } }),
        ]),
      ]));
    }

    /* Recently unlocked achievements */
    // Unlocked-only path: the dashboard shows badges, not progress bars, so it
    // must not trigger the expensive stats snapshot.
    const achEarned = await Achievements.unlockedList();
    if (achEarned.length) {
      wrap.appendChild(el('.card.pad.col.gap-3', {}, [
        el('.row.between', {}, [
          wTitle('trophy', 'var(--pink)', I18n.t('achievements')),
          el('button.btn.sm.ghost', { html: `<span>${I18n.num(achEarned.length)}/${I18n.num(Achievements.total())}</span>` + icon('arrowR'), onclick: () => Router.go('stats') }),
        ]),
        Achievements.grid(achEarned, { limit: 4 }),
      ]));
    }

    /* Quick actions */
    const qa = [
      { ic: 'today', label: I18n.t('nav_today'), c: 'var(--brand)', run: () => Router.go('today') },
      { ic: 'goals', label: I18n.t('nav_goals'), c: 'var(--blue)', run: () => Router.go('goals') },
      { ic: 'habits', label: I18n.t('nav_habits'), c: 'var(--green)', run: () => Router.go('habits') },
      { ic: 'finance', label: I18n.t('nav_finance'), c: 'var(--teal)', run: () => Router.go('finance') },
      { ic: 'search', label: I18n.t('search'), c: 'var(--orange)', run: () => Command.open() },
      { ic: 'settings', label: I18n.t('nav_settings'), c: 'var(--pink)', run: () => Router.go('settings') },
    ];
    wrap.appendChild(el('.card.pad', {}, [
      el('.row.between.mb-4', {}, [wTitle('bolt', 'var(--orange)', I18n.t('quickActions'))]),
      el('.qa-grid', {}, qa.map(a => el('button.qa-tile', { style: { '--qa-c': a.c }, onclick: a.run }, [
        el('.qa-ic', { html: icon(a.ic) }), el('span', { text: a.label }),
      ]))),
    ]));

    startClock();
    return wrap;
  }
  function startClock() {
    stopClock();
    const tick = () => {
      const n = $('#dashClock'); if (!n) return stopClock();
      const d = new Date(); const fmt = Prefs.get('timeFormat') === '12';
      let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const s = String(d.getSeconds()).padStart(2, '0');
      let suffix = ''; if (fmt) { suffix = h < 12 ? ' AM' : ' PM'; h = h % 12 || 12; }
      n.textContent = I18n.num(`${String(h).padStart(2, '0')}:${m}:${s}`) + suffix;
    };
    tick(); clockTimer = setInterval(tick, 1000);
    Bus.on('route:change', ({ name }) => { if (name !== 'dashboard') stopClock(); });
  }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }
  return { render };
})();

    } else {

        [0, 1, 5, 15, 30, 60].map(m => el('option', { value: m, text: m ? `${I18n.num(m)} ${I18n.t('afterMin')}` : I18n.t('autoLockOff'), selected: (lockCfg.autoLockMin || 0) === m })));
      secRows.push(
        rowItem(I18n.t('appLock'), el('.chip', {}, [el('span', { html: icon('lock') }), el('span', { text: I18n.t('pinSet') })])),
        el('.divider'),
        rowItem(I18n.t('autoLock'), autoSel, I18n.t('autoLockDesc')),
        el('.divider'),
        rowItem(I18n.t('lockOnStart'), toggle(lockCfg.lockOnStart !== false, (v) => Lock.save({ lockOnStart: v })), I18n.t('lockOnStartDesc')),
        el('.divider'),
        el('.row.wrap.gap-2', {}, [
          el('button.btn.outline', { html: icon('lock') + '<span>' + I18n.t('lockNow') + '</span>', onclick: () => Lock.lock() }),
          el('button.btn.outline', { text: I18n.t('changePin'), onclick: () => pinDialog('change') }),

    /* AI provider — optional */
    const ai = AI.config();

    wrap.appendChild(section(I18n.t('aiAssistant'), [

      el('.row.gap-2', {}, [
        el('button.btn.outline', { text: I18n.t('aiTest'), onclick: async (e) => {
          const btn = e.currentTarget; const old = btn.textContent; btn.textContent = I18n.t('aiThinking'); btn.disabled = true;
          try { await AI.test(); UI.toast('success', I18n.t('aiConnected')); }
          catch (err) { UI.toast('error', `${I18n.t('aiFailed')} — ${err.message}`); }
          finally { btn.textContent = old; btn.disabled = false; }

    /* Data health — scans for corruption / validates an external backup file
       BEFORE you import it. Creating backups lives in the "Data" section above
       (a separate "create restore point" button used to duplicate that exact

    const healthBox = el('.col.gap-3');
    healthBox.appendChild(el('.dim.small', { text: I18n.t('dataHealth') }));
    wrap.appendChild(section(I18n.t('recovery'), [

    wrap.appendChild(el('.card.pad.col.gap-4', { style: { borderColor: 'color-mix(in srgb, var(--red) 30%, var(--border))' } }, [

      el('.row.between.gap-4.wrap', {}, [

  const SEC_QUESTIONS = ['sq_pet', 'sq_city', 'sq_teacher', 'sq_food'];

  /** Set / change / remove / recover the PIN. `recover` is called from the lock
      screen AFTER the security answer already verified — no current PIN needed. */
  async function pinDialog(mode) {
    // Bug fix: 'remove' needs the current PIN too — it was being skipped, so
    // the field never rendered, cur.value stayed '', removePin() silently
    // failed verify(''), yet a "success" toast still showed. Only 'set' and
    // 'recover' (already answered the security question) skip this.
    const needsCur = mode === 'change' || mode === 'remove';
    const needsQuestion = mode === 'set' || mode === 'change';
    // PIN digits are LTR (same convention as money/health numeric inputs).
    const cur = el('input.input', { type: 'password', inputmode: 'numeric', dir: 'ltr', placeholder: I18n.t('currentPin') });
    const a = el('input.input', { type: 'password', inputmode: 'numeric', dir: 'ltr', placeholder: I18n.t('pinLabel') });
    const b = el('input.input', { type: 'password', inputmode: 'numeric', dir: 'ltr', placeholder: I18n.t('confirmPin') });
    const err = el('.err');
    const rows = [];
    if (needsCur) rows.push(el('.field', {}, [el('.label', { text: I18n.t('currentPin') }), cur]));
    if (mode !== 'remove') rows.push(
      el('.field', {}, [el('.label', { text: I18n.t('pinLabel') }), a]),
      el('.field', {}, [el('.label', { text: I18n.t('confirmPin') }), b]));

    let qSel, ansInput;
    if (needsQuestion) {
      const existing = Lock.securityQuestion();
      qSel = el('select.select', {}, SEC_QUESTIONS.map(k => el('option', { value: k, text: I18n.t(k), selected: existing === k })));
      ansInput = el('input.input', { placeholder: mode === 'change' && existing ? I18n.t('sqKeepPh') : I18n.t('sqAnswerPh') });
      rows.push(el('.divider'), el('.field', {}, [el('.label', { text: I18n.t('securityQuestion') }), qSel]),
        el('.field', {}, [el('.label', { text: I18n.t('securityAnswer') }), ansInput,
          el('.hint', { text: mode === 'change' && existing ? I18n.t('sqUpdateHint') : I18n.t('sqSetupHint') })]));
    }
    rows.push(err, mode !== 'remove' ? el('.hint', { text: I18n.t('securityNote') }) : null);

    const v = await UI.modal({
      title: I18n.t(mode === 'set' ? 'setupPin' : mode === 'change' ? 'changePin' : mode === 'recover' ? 'setupPin' : 'removePin'),
      body: el('.col.gap-4', {}, rows.filter(Boolean)), width: '440px',
      actions: [{ label: I18n.t('cancel'), value: null, variant: 'ghost' },
        { label: I18n.t('save'), value: 'ok', variant: mode === 'remove' ? 'danger' : 'primary' }],
    });
    if (v !== 'ok') return false;
    try {
      if (needsCur && !(await Lock.verify(cur.value))) { UI.toast('error', I18n.t('wrongPin')); return false; }
      if (mode === 'remove') {
        const ok = await Lock.removePin(cur.value);
        if (!ok) { UI.toast('error', I18n.t('wrongPin')); return false; }
        UI.toast('success', I18n.t('pinRemoved')); Router.render(); return true;
      }
      if (!/^\d{4,}$/.test(a.value)) { UI.toast('error', I18n.t('pinTooShort')); return false; }
      if (a.value !== b.value) { UI.toast('error', I18n.t('pinMismatch')); return false; }
      if (needsQuestion && mode === 'set' && !ansInput.value.trim()) { UI.toast('error', I18n.t('sqRequired')); return false; }
      await Lock.setPin(a.value);
      if (needsQuestion && ansInput.value.trim()) await Lock.setSecurityQuestion(qSel.value, ansInput.value);
      UI.toast('success', I18n.t('pinSet'));
      Router.render();
      return true;
    } catch (e) { UI.toast('error', e.message === 'short' ? I18n.t('pinTooShort') : String(e.message)); return false; }
  }

  /** Run the corruption scan and render its report inline. */
  async function runDiagnostic(box) {
    box.innerHTML = '';
    box.appendChild(el('.dim.small', { text: I18n.t('diagnosing') }));
    const res = await Recovery.diagnose();
    box.innerHTML = '';
    box.appendChild(el('.health-hero.' + (res.healthy ? 'ok' : 'warn'), {}, [
      el('.hh-ic', { style: { background: `color-mix(in srgb, ${res.healthy ? 'var(--green)' : 'var(--orange)'} 18%, transparent)`, color: res.healthy ? 'var(--green)' : 'var(--orange)' },
        html: icon(res.healthy ? 'check' : 'alert') }),
      el('.col.grow', {}, [
        el('.h4', { text: res.healthy ? I18n.t('healthy') : `${I18n.num(res.issues.reduce((s, i) => s + i.count, 0))} ${I18n.t('issuesFound')}` }),
        el('.hint', { text: `${I18n.num(res.scanned)} ${I18n.t('recordsScanned')} · ${I18n.num(res.stores)} ${I18n.t('storesScanned')}` }),
      ]),
    ]));
    if (res.healthy) return;

    const issueList = (arr, manual) => {
      const list = el('.col.gap-2');
      arr.forEach(i => list.appendChild(el('.issue-row', {}, [
        el('.issue-ic', { style: manual ? { background: 'color-mix(in srgb, var(--red) 16%, transparent)', color: 'var(--red)' } : {}, html: icon('alert') }),
        el('.grow', { text: I18n.t(i.code) }),
        el('.issue-count', { text: I18n.num(i.count) }),
      ])));
      return list;
    };
    if (res.fixable.length) {
      box.appendChild(el('.label', { text: I18n.t('autoFixable') }));
      box.appendChild(issueList(res.fixable, false));
      box.appendChild(el('button.btn.primary', { html: icon('wrench') + '<span>' + I18n.t('repairNow') + '</span>', onclick: async () => {
        await DB.backup('pre-repair');
        const r = await Recovery.repair();
        UI.toast('success', `${I18n.t('repaired')} · ${I18n.num(r.fixed)}`);
        runDiagnostic(box);
      } }));
    }
    if (res.manual.length) {
      box.appendChild(el('.label.mt-4', { text: I18n.t('needsReview') }));
      box.appendChild(issueList(res.manual, true));
      box.appendChild(el('.hint', { text: I18n.t('needsReviewNote') }));
      box.appendChild(el('button.btn.danger', { html: icon('trash') + '<span>' + I18n.t('discardBroken') + '</span>', onclick: async () => {
        if (!(await UI.confirm({ title: I18n.t('discardBroken'), message: I18n.t('discardBrokenQ'), danger: true, confirmLabel: I18n.t('delete') }))) return;
        await DB.backup('pre-discard');
        const r = await Recovery.discardBroken();
        UI.toast('success', `${I18n.t('discarded')} · ${I18n.num(r.removed)}`);
        runDiagnostic(box);
      } }));
    }
  }

  /** Validate a backup file without importing it. */
  function validateBackupFile() {
    const input = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' }, onchange: async (e) => {
      const file = e.target.files[0]; if (!file) return;
      let payload = null;
      try { payload = JSON.parse(await file.text()); }
      catch { UI.toast('error', I18n.t('backupInvalid')); return; }
      const res = Recovery.validateBackup(payload);
      const body = el('.col.gap-3', {}, [
        el('.health-hero.' + (res.ok ? 'ok' : 'warn'), {}, [
          el('.hh-ic', { style: { background: `color-mix(in srgb, ${res.ok ? 'var(--green)' : 'var(--orange)'} 18%, transparent)`, color: res.ok ? 'var(--green)' : 'var(--orange)' }, html: icon(res.ok ? 'check' : 'alert') }),
          el('.col.grow', {}, [el('.h4', { text: I18n.t(res.ok ? 'backupValid' : 'backupInvalid') }),
            el('.hint', { text: `${I18n.num(res.total || 0)} ${I18n.t('records')}` })]),
        ]),
        ...(res.problems.length ? [el('.col.gap-2', {}, res.problems.map(p => el('.issue-row', {}, [el('.issue-ic', { html: icon('alert') }), el('.grow', { text: p })])))] : []),
        ...(Object.keys(res.counts).length ? [el('.hint', { text: Object.entries(res.counts).filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`).join(' · ') })] : []),
      ]);
      const go = await UI.modal({ title: I18n.t('validateBackup'), body, width: '520px', actions: res.ok
        ? [{ label: I18n.t('cancel'), value: null, variant: 'ghost' }, { label: I18n.t('restore'), value: 'restore', variant: 'primary' }]
        : [{ label: I18n.t('close'), value: null, variant: 'ghost' }] });
      if (go === 'restore') {
        if (!(await UI.confirm({ title: I18n.t('import'), message: I18n.t('confirmReset'), danger: true }))) return;
        await DB.backup('pre-import');
        await DB.importAll(payload);
        UI.toast('success', I18n.t('imported'));
        Layout.build(); Router.render();
      }
    } });
    document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
  }

  async function exportData() {
    const snap = await DB.exportAll();
    // Serialise store-by-store into separate Blob parts. A single
    // JSON.stringify of the whole snapshot can exceed the engine's maximum
    // string length once the database holds six figures of records.
    const parts = ['{'];
    parts.push(`"app":${JSON.stringify(snap.app)},"schema":${JSON.stringify(snap.schema)},`);
    parts.push(`"exportedAt":${JSON.stringify(snap.exportedAt)},"prefs":${JSON.stringify(snap.prefs)},"data":{`);
    const names = Object.keys(snap.data);
    names.forEach((name, i) => {
      parts.push(`${JSON.stringify(name)}:[`);
      const rows = snap.data[name];
      rows.forEach((row, j) => { parts.push(JSON.stringify(row)); if (j < rows.length - 1) parts.push(','); });
      parts.push(']'); if (i < names.length - 1) parts.push(',');
    });
    parts.push('}}');
    const blob = new Blob(parts, { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `lifeos-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    UI.toast('success', I18n.t('exported'));
  }
  function importData() {
    const input = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' },
      onchange: async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try {
          const text = await file.text(); const payload = JSON.parse(text);
          if (payload.app !== 'lifeos') throw new Error('bad');
          if (!(await UI.confirm({ title: I18n.t('import'), message: I18n.t('confirmReset'), danger: true }))) return;
          await DB.backup('pre-import');
          await DB.importAll(payload); UI.toast('success', I18n.t('imported')); Layout.build(); Router.render();
        } catch (err) { UI.toast('error', I18n.t('importErr')); }
      } });
    document.body.appendChild(input); input.click(); setTimeout(() => input.remove(), 1000);
  }
  async function resetApp() {
    if (!(await UI.confirm({ title: I18n.t('reset'), message: I18n.t('confirmReset'), danger: true, confirmLabel: I18n.t('reset') }))) return;
    await DB.backup('pre-reset');
    for (const s of Object.keys(DB.STORES)) if (s !== 'kv') await DB.clearStore(s);
    UI.toast('success', I18n.t('resetDone')); Router.render();
  }
  return { render, exportData, importData, toggle, pinDialog };
})();

/* ---------------------------------------------------------------------------
   14. PWA — manifest (inline via Blob) + best-effort service worker
   ------------------------------------------------------------------------- */
const PWA = (() => {
  let deferredPrompt = null;
  function iconDataURL(size, maskable) {
    // Same L+O monogram as the sidebar/splash badge (see LOGO_SVG), just laid
    // out full-bleed on a 0–100 box so it scales cleanly to any icon size.
    // Maskable icons need extra safe-area padding (~20% each side) so Android
    // doesn't crop the glyph when it applies its own mask shape.
    const glyph = maskable
      ? '<path d="M34 33 L34 67 L52 67" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="63" cy="50" r="13" fill="none" stroke="#fff" stroke-width="7"/>'
      : '<path d="M26 22 L26 78 L54 78" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="50" r="19" fill="none" stroke="#fff" stroke-width="10"/>';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFC"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs>
      <rect width="100" height="100" rx="${maskable ? 0 : 22}" fill="url(#g)"/>
      ${glyph}
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }
  function injectManifest() {
    const manifest = {
      name: Prefs.get('plannerName') || 'Life OS', short_name: 'Life OS',
      description: 'Personal Life Operating System', start_url: '.', scope: '.',
      display: 'standalone', orientation: 'portrait-primary',
      // theme_color paints the installed shell's system bars (they are opaque
      // now that the viewport is not fit=cover) — match the topbar, not the
      // accent, so there is no coloured stripe above the app.
      background_color: '#0E0F14', theme_color: '#16181F',
      lang: I18n.get(), dir: I18n.dir(),
      icons: [
        { src: iconDataURL(192), sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
        { src: iconDataURL(512), sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        { src: iconDataURL(512, true), sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if (!link) { link = el('link', { rel: 'manifest' }); document.head.appendChild(link); }
    link.href = url;
    let apple = el('link', { rel: 'apple-touch-icon', href: iconDataURL(180) }); document.head.appendChild(apple);
  }
  /* Service worker: caches the shell for offline use, served from a real
     sw.js file sitting next to index.html. A Blob-URL registration was tried
     first to keep everything in one file, but browsers reject non-http(s)
     script URLs for service workers outright (verified: `Failed to register
     a ServiceWorker: The URL protocol of the script ('blob:...') is not
     supported`) — so it silently never ran. sw.js only matters for the
     hosted/HTTPS deployment; opening index.html directly via file:// never
     reaches this (protocol guard below), so the app is still a single file
     to author and to open locally. */
  async function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    try { await navigator.serviceWorker.register('./sw.js'); } catch {}
  }
  function init() {
    injectManifest();
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; Bus.emit('pwa:installable', true); });
    registerSW();
    Bus.on('prefs:change', () => injectManifest());
    Bus.on('lang:change', () => injectManifest());
  }
  async function promptInstall() { if (!deferredPrompt) return false; deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice; deferredPrompt = null; return outcome === 'accepted'; }
  return { init, promptInstall };
})();

/* ---------------------------------------------------------------------------
   15. Global keyboard shortcuts
   ------------------------------------------------------------------------- */
const Shortcuts = (() => {
  function init() {
    document.addEventListener('keydown', (e) => {
      // While locked the lock screen owns the keyboard entirely.
      if (typeof Lock !== 'undefined' && Lock.isLocked()) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); if (Lock.config().enabled) Lock.lock(); return; }
      if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); Command.isOpen() ? Command.close() : Command.open(); return; }
      if (Command.isOpen()) return;
      const typing = /^(input|textarea|select)$/i.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
      if (typing) return;
      if (e.key === '?') { e.preventDefault(); showHelp(); }
      if (mod && e.key === ',') { e.preventDefault(); Router.go('settings'); }
      // g + <key> chords
      if (e.key.toLowerCase() === 'g') { pendingG = true; setTimeout(() => pendingG = false, 900); return; }
      if (pendingG) { pendingG = false; const map = { d: 'dashboard', t: 'today', w: 'week', m: 'month', h: 'habits', n: 'notes', f: 'finance', s: 'stats' };
        const dest = map[e.key.toLowerCase()]; if (dest) Router.go(dest); }
    });
  }
  let pendingG = false;
  function showHelp() {
    const rows = [
      ['Ctrl / ⌘ + K', I18n.t('cmd_title')], ['Ctrl / ⌘ + ,', I18n.t('settings')],
      ['G → D', I18n.t('nav_dashboard')], ['G → T', I18n.t('nav_today')], ['G → H', I18n.t('nav_habits')],
      ['G → F', I18n.t('nav_finance')], ['?', 'Help'],
    ];
    UI.modal({ title: '⌨ ' + (I18n.get() === 'fa' ? 'میان‌برها' : 'Shortcuts'),
      body: el('.col.gap-2', {}, rows.map(([k, v]) => el('.row.between', { style: { padding: '6px 0' } }, [
        el('.muted', { text: v }), el('kbd.chip.mono', { text: k }) ]))) });
  }
  return { init };
})();

/* ---------------------------------------------------------------------------
   15b. XP engine (lightweight — full level/achievements UI arrives Phase 8)
   ------------------------------------------------------------------------- */
const XP = (() => {
  const BY_PRIORITY = { none: 5, low: 8, medium: 12, high: 18, urgent: 25 };
  const forPriority = (p) => BY_PRIORITY[p] ?? 10;
  /** Auto XP: priority base + estimate (+2 per 10min, cap +30) + checklist (+2/item, cap +20).
      Weekly tasks ×1.5 (bigger scope). The single source of truth — XP is never user-set. */
  function forTask(t) {
    const base = BY_PRIORITY[t.priority] ?? 10;
    const dur = Math.min(30, Math.floor((t.estimateMin || 0) / 10) * 2);
    const cl = Math.min(20, ((t.checklist && t.checklist.length) || 0) * 2);
    const mult = t.kind === 'weekly' ? 1.5 : 1;
    return Math.round((base + dur + cl) * mult);
  }
  async function award(amount, source, refId, atEl) {
    if (!amount) return;
    await DB.put('xpLog', { date: Jalali.todayKey(), amount, source, refId });
    Bus.emit('xp:award', { amount, source, refId });
    if (atEl) float(amount, atEl);
  }
  async function total() { const rows = await DB.all('xpLog'); return rows.reduce((s, r) => s + (r.amount || 0), 0); }
  /** Levels get gradually harder (×1.35 per level). */
  function levelFor(xp) {
    let level = 1, need = 100, acc = 0;
    while (xp >= acc + need) { acc += need; level++; need = Math.round(need * 1.35); }
    return { level, into: xp - acc, need, pct: Math.round(((xp - acc) / need) * 100) };
  }
  function float(amount, elem) {
    const r = elem.getBoundingClientRect();
    const node = document.createElement('div');
    node.className = 'xpfloat'; node.textContent = '+' + I18n.num(amount) + ' XP';
    node.style.left = (r.left + r.width / 2 - 18) + 'px';
    node.style.top = (r.top - 8) + 'px';
    document.body.appendChild(node); setTimeout(() => node.remove(), 1150);
  }
  return { forPriority, forTask, award, total, levelFor };
})();

/* ---------------------------------------------------------------------------
   15c. Tasks — data model, timer, completion, XP hooks
   ------------------------------------------------------------------------- */
const Tasks = (() => {
  const PRIORITIES = ['none', 'low', 'medium', 'high', 'urgent'];
  const CATEGORIES = ['work', 'personal', 'study', 'health', 'finance', 'other'];
  const PR_ORDER = { urgent: 0, high: 1, medium: 2, low: 3, none: 4 };

  function make(over = {}) {
    return {
      title: '', description: '', notes: '',
      kind: 'daily', date: Jalali.todayKey(),
      completed: false, completedAt: null,
      priority: 'none', category: '', goalId: null, tags: [],
      dueTime: null, estimateMin: 0, actualSec: 0, timerStartedAt: null,
      xp: 0, color: null, reminderAt: null,
      repeat: { type: 'none', days: [] },
      checklist: [], links: [], pomodoros: 0,
      ...over,
    };
  }
  /** Invariant: weekly tasks are always anchored to their week-start key. */
  const normalize = (t) => { if (t.kind === 'weekly' && t.date) t.date = Habits.weekStartKey(t.date); return t; };
  async function create(data) {
    const t = normalize(make(data));
    t.xp = XP.forTask(t);
    return DB.put('tasks', t);
  }
  const update = (t) => { normalize(t); t.xp = XP.forTask(t); return DB.put('tasks', t); };
  const remove = (t) => DB.softDelete('tasks', t.id);

  async function forDate(dateKey, { kind } = {}) {
    let list = await DB.byIndex('tasks', 'date', dateKey);
    if (kind) list = list.filter(t => t.kind === kind);
    return list.sort(sortFn);
  }
  function sortFn(a, b) {
    if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
    if (PR_ORDER[a.priority] !== PR_ORDER[b.priority]) return PR_ORDER[a.priority] - PR_ORDER[b.priority];
    if (a.dueTime && b.dueTime && a.dueTime !== b.dueTime) return a.dueTime < b.dueTime ? -1 : 1;
    if (a.dueTime && !b.dueTime) return -1; if (b.dueTime && !a.dueTime) return 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }
  function isOverdue(t) {
    if (t.completed) return false;
    const today = Jalali.todayKey();
    if (t.date && t.date < today) return true;
    if (t.date === today && t.dueTime) {
      const [h, m] = t.dueTime.split(':').map(Number);
      const now = new Date();
      return (now.getHours() * 60 + now.getMinutes()) > (h * 60 + m);
    }
    return false;
  }
  function statusOf(t) { if (t.completed) return 'done'; if (t.timerStartedAt) return 'active'; if (isOverdue(t)) return 'overdue'; return 'pending'; }

  const elapsed = (t) => (t.actualSec || 0) + (t.timerStartedAt ? Math.floor((Date.now() - t.timerStartedAt) / 1000) : 0);
  async function startTimer(t) { if (t.timerStartedAt) return t; t.timerStartedAt = Date.now(); await update(t); Bus.emit('timer:change', t.id); return t; }
  async function stopTimer(t) { if (t.timerStartedAt) { t.actualSec = elapsed(t); t.timerStartedAt = null; await update(t); Bus.emit('timer:change', t.id); } return t; }

  async function toggleComplete(t, atEl) {
    t.completed = !t.completed;
    if (t.completed) {
      t.completedAt = Date.now();
      if (t.timerStartedAt) { t.actualSec = elapsed(t); t.timerStartedAt = null; }
      await update(t);
      await XP.award(XP.forTask(t), 'task', t.id, atEl);
      Bus.emit('task:complete', t);
    } else { t.completedAt = null; await update(t); Bus.emit('task:uncomplete', t); }
    return t;
  }
  async function moveToTomorrow(t) { t.date = Jalali.addDays(t.date || Jalali.todayKey(), 1); t.completed = false; t.completedAt = null; await update(t); }
  async function duplicate(t) {
    const c = deepClone(t);
    ['id', 'createdAt', 'updatedAt', 'version', 'deletedAt'].forEach(k => delete c[k]);
    c.completed = false; c.completedAt = null; c.timerStartedAt = null; c.actualSec = 0;
    return create(c);
  }
  return { make, create, update, remove, forDate, sortFn, isOverdue, statusOf, elapsed,
    startTimer, stopTimer, toggleComplete, moveToTomorrow, duplicate, PRIORITIES, CATEGORIES };
})();

/* ---------------------------------------------------------------------------
   15d. TaskUI — task item rendering, editor modal, context menu
   ------------------------------------------------------------------------- */
const TaskUI = (() => {
  function fmtDur(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return `${I18n.num(h)}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${I18n.num(m)}:${String(s).padStart(2, '0')}`;
  }
  const field = Views.field;

  /** Render one task as a DOM node. onChange() is called after mutations. */
  function node(t, { onChange, readonly } = {}) {
    const status = Tasks.statusOf(t);
    const wrap = el('.task', { dataset: { p: t.priority, id: t.id },
      class: (t.completed ? 'done' : '') + (status === 'active' ? ' active' : '') });
    if (t.color) wrap.style.borderInlineStartColor = t.color;
    wrap.appendChild(el('.pstripe', t.color ? { style: { background: t.color } } : {}));

    const check = el('.task-check', { role: 'checkbox', 'aria-checked': String(!!t.completed), tabindex: 0,
      html: t.completed ? icon('check') : '',
      onclick: async (e) => { e.stopPropagation(); if (readonly) return;
        // Optimistic UI: flip the check instantly; the soft re-render follows.
        const done = !t.completed; wrap.classList.toggle('done', done); check.innerHTML = done ? icon('check') : ''; check.setAttribute('aria-checked', String(done));
        await Tasks.toggleComplete(t, check); onChange && onChange(); },
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); check.click(); } } });
    wrap.appendChild(check);

    const main = el('.task-main', { onclick: () => { if (!readonly) openEditor(t, onChange); } });
    main.appendChild(el('.task-title', { text: t.title }));
    if (t.description) main.appendChild(el('.task-desc', { text: t.description }));
    if (t.notes) main.appendChild(el('.task-note', {}, [el('span', { html: icon('notes') }), el('span', { text: t.notes })]));
    const meta = el('.task-meta');
    if (t.kind === 'weekly') meta.appendChild(el('.mchip.kind-w', {}, [el('span', { html: icon('week') }), el('span', { text: I18n.t('kind_weekly') })]));
    if (t.dueTime) meta.appendChild(el('.mchip' + (Tasks.isOverdue(t) ? '.overdue' : ''), {}, [el('span', { html: icon('clock') }), el('span', { text: I18n.num(t.dueTime) })]));
    if (t.priority !== 'none') meta.appendChild(el('.mchip', {}, [el('span', { html: icon('flag') }), el('span', { text: I18n.t('p_' + t.priority) })]));
    if (t.category) meta.appendChild(el('.mchip', {}, [el('span', { html: icon('tag') }), el('span', { text: I18n.t('cat_' + t.category) })]));
    if (t.goalId) {
      // Filled async — shows which goal this task advances; click jumps to it.
      const gchip = el('.mchip.goalc', { title: I18n.t('goal') });
      meta.appendChild(gchip);
      DB.get('goals', t.goalId).then(g => {
        if (!g || g.deletedAt) return gchip.remove();
        gchip.appendChild(el('span', { html: icon('goals') }));
        gchip.appendChild(el('span.gname', { text: g.title }));
        gchip.onclick = (e) => { e.stopPropagation(); Router.go('goals', { id: g.id }); };
      });
    }
    if (t.estimateMin) meta.appendChild(el('.mchip', { text: `~${I18n.num(t.estimateMin)} ${I18n.t('minShort')}` }));
    (t.tags || []).forEach(tg => meta.appendChild(el('.mchip', { text: '#' + tg })));
    if (t.checklist && t.checklist.length) {
      const done = t.checklist.filter(c => c.done).length;
      meta.appendChild(el('.mchip', {}, [el('span', { html: icon('check') }), el('span', { text: `${I18n.num(done)}/${I18n.num(t.checklist.length)}` })]));
    }
    meta.appendChild(el('.mchip.xpc', {}, [el('span', { html: icon('bolt') }), el('span', { text: `${I18n.num(XP.forTask(t))}` })]));
    main.appendChild(meta);
    wrap.appendChild(main);

    if (!readonly) {
      const actions = el('.task-actions');
      const badge = el('span.timer-badge');
      const refreshBadge = () => { badge.textContent = fmtDur(Tasks.elapsed(t)); };
      if (t.timerStartedAt || t.actualSec) { refreshBadge(); actions.appendChild(badge); }
      const playBtn = el('button.tb-btn', { title: t.timerStartedAt ? I18n.t('pause') : I18n.t('start'),
        html: icon(t.timerStartedAt ? 'pause' : 'play'),
        onclick: async (e) => { e.stopPropagation(); if (t.timerStartedAt) await Tasks.stopTimer(t); else await Tasks.startTimer(t); onChange && onChange(); } });
      actions.appendChild(playBtn);
      actions.appendChild(el('button.tb-btn', { title: I18n.t('editTask'), html: icon('pen'),
        onclick: (e) => { e.stopPropagation(); openEditor(t, onChange); } }));
      actions.appendChild(el('button.tb-btn', { title: '⋯', html: icon('more'),
        onclick: (e) => { e.stopPropagation(); contextMenu(t, onChange, e.currentTarget); } }));
      wrap.appendChild(actions);
      if (t.timerStartedAt) { const iv = setInterval(() => { if (!document.body.contains(wrap)) return clearInterval(iv); refreshBadge(); }, 1000); }
    }

    if (t.checklist && t.checklist.length) {
      const cl = el('.cl-wrap');
      t.checklist.forEach(item => {
        const row = el('.cl-row' + (item.done ? '.on' : ''));
        row.appendChild(el('.cl-box', { html: item.done ? icon('check') : '',
          onclick: async () => { if (readonly) return; item.done = !item.done; await Tasks.update(t); onChange && onChange(); } }));
        row.appendChild(el('.cl-text', { text: item.text }));
        cl.appendChild(row);
      });
      wrap.appendChild(cl);
    }
    return wrap;
  }

  function contextMenu(t, onChange, anchor) {
    const items = [
      { icon: 'pen', label: I18n.t('editTask'), run: () => openEditor(t, onChange) },
      { icon: 'copy', label: I18n.t('duplicate'), run: async () => { await Tasks.duplicate(t); onChange && onChange(); } },
      { icon: 'arrowR', label: I18n.t('moveToTomorrow'), run: async () => { await Tasks.moveToTomorrow(t); UI.toast('info', I18n.t('moveToTomorrow')); onChange && onChange(); } },
      { icon: 'trash', label: I18n.t('delete'), danger: true, run: async () => { if (await UI.confirm({ title: I18n.t('deleteTaskQ'), danger: true, confirmLabel: I18n.t('delete') })) { await Tasks.remove(t); onChange && onChange(); } } },
    ];
    popover(anchor, items);
  }
  function popover(anchor, items) {
    const menu = el('.card', { role: 'menu', style: { position: 'fixed', zIndex: 'var(--z-modal)', minWidth: '190px', padding: '6px', boxShadow: 'var(--shadow-lg)' } });
    items.forEach(it => menu.appendChild(el('.cmd-item', { role: 'menuitem', style: it.danger ? { color: 'var(--red)' } : {},
      onclick: () => { close(); it.run(); } }, [el('span', { html: icon(it.icon) }), el('span.grow', { text: it.label })])));
    document.body.appendChild(menu);
    const r = anchor.getBoundingClientRect();
    const top = Math.min(r.bottom + 6, window.innerHeight - menu.offsetHeight - 10);
    const left = I18n.dir() === 'rtl' ? r.right - menu.offsetWidth : r.left;
    menu.style.top = Math.max(8, top) + 'px';
    menu.style.left = clamp(left, 8, window.innerWidth - menu.offsetWidth - 8) + 'px';
    const close = () => { menu.remove(); document.removeEventListener('click', outside, true); document.removeEventListener('keydown', onEsc); };
    function outside(e) { if (!menu.contains(e.target)) close(); }
    function onEsc(e) { if (e.key === 'Escape') close(); }
    setTimeout(() => { document.addEventListener('click', outside, true); document.addEventListener('keydown', onEsc); }, 0);
  }

  async function openEditor(existing, onSaved, defaults = {}) {
    const isNew = !existing;
    const t = existing ? deepClone(existing) : Tasks.make(defaults);
    if (!t.repeat) t.repeat = { type: 'none', days: [] };
    const goals = await DB.all('goals');

    const titleInput = el('input.input', { value: t.title, placeholder: I18n.t('titlePh'), oninput: (e) => t.title = e.target.value });
    const descInput = el('textarea.textarea', { placeholder: I18n.t('description'), style: { minHeight: '60px' }, oninput: (e) => t.description = e.target.value }, t.description || '');

    // XP is computed, never typed — live readout that follows priority/estimate/checklist/kind.
    const xpVal = el('b', { text: I18n.num(XP.forTask(t)) });
    const xpBadge = el('.xp-live', {}, [el('span', { html: icon('bolt') }), xpVal, el('span', { text: 'XP' })]);
    const recalcXp = () => { xpVal.textContent = I18n.num(XP.forTask(t)); };

    const priPick = Views.picker(Tasks.PRIORITIES.map(p => [p, I18n.t('p_' + p)]), t.priority,
      (v) => { t.priority = v; recalcXp(); });

    // Two choices don't deserve a dropdown — one tap instead of three.
    // ('routine' is gone: recurring things are habits now.)
    const kindPick = Views.picker(['daily', 'weekly'].map(k => [k, I18n.t('kind_' + k)]), t.kind,
      (v) => { t.kind = v; recalcXp(); });

    const dateInput = JalaliPicker.input({ value: t.date, onChange: (k) => t.date = k });

    const catSel = el('select.select', { onchange: (e) => t.category = e.target.value }, [
      el('option', { value: '', text: I18n.t('optional') }),
      ...Tasks.CATEGORIES.map(c => el('option', { value: c, text: I18n.t('cat_' + c), selected: t.category === c })),
    ]);
    const timeInput = TimePicker.input({ value: t.dueTime, onChange: (v) => t.dueTime = v || null });
    const estInput = el('input.input', { type: 'number', min: 0, value: t.estimateMin || '', placeholder: '0', oninput: (e) => { t.estimateMin = +e.target.value || 0; recalcXp(); } });
    const goalSel = el('select.select', { onchange: (e) => t.goalId = e.target.value || null }, [
      el('option', { value: '', text: I18n.t('selectGoal') }),
      ...goals.map(g => el('option', { value: g.id, text: g.title, selected: t.goalId === g.id })),
    ]);
    const tagsInput = el('input.input', { value: (t.tags || []).join('، '), placeholder: I18n.t('tagsPh'),
      oninput: (e) => t.tags = e.target.value.split(/[،,]/).map(s => s.trim()).filter(Boolean) });

    const daysRow = Views.picker(Jalali.weekdays[I18n.get()].map((w, i) => [i, w]), t.repeat.days || [],
      (v) => t.repeat.days = v, { multi: true });
    daysRow.classList.toggle('hidden', t.repeat.type !== 'weekly');
    const monthDayIn = el('input.input', { type: 'number', min: 1, max: 31, value: t.repeat.monthDay || '', placeholder: '1-31',
      oninput: (e) => t.repeat.monthDay = clamp(+e.target.value || 1, 1, 31) });
    const monthDayField = field(I18n.t('monthDay'), monthDayIn);
    monthDayField.classList.toggle('hidden', t.repeat.type !== 'monthly');
    const repSel = el('select.select', { onchange: (e) => { t.repeat.type = e.target.value;
      daysRow.classList.toggle('hidden', e.target.value !== 'weekly');
      monthDayField.classList.toggle('hidden', e.target.value !== 'monthly'); } },
      ['none', 'daily', 'weekly', 'monthly'].map(r => el('option', { value: r, text: I18n.t('rp_' + r), selected: t.repeat.type === r })));

    const clList = el('.col.gap-2');
    function renderCl() {
      clList.innerHTML = '';
      (t.checklist || []).forEach((item, idx) => clList.appendChild(el('.row.gap-2', {}, [
        el('.cl-box' + (item.done ? '.on' : ''), { html: item.done ? icon('check') : '', onclick: () => { item.done = !item.done; renderCl(); } }),
        el('input.input.grow', { value: item.text, oninput: (e) => item.text = e.target.value }),
        el('button.tb-btn', { html: icon('x'), onclick: () => { t.checklist.splice(idx, 1); renderCl(); recalcXp(); } }),
      ])));
    }
    renderCl();
    const clAdd = el('.quickadd', {}, [el('span', { html: icon('plus'), style: { color: 'var(--text-3)' } }),
      el('input', { placeholder: I18n.t('checklistPh'), onkeydown: (e) => { if (e.key === 'Enter' && e.target.value.trim()) { t.checklist = t.checklist || []; t.checklist.push({ id: uid(), text: e.target.value.trim(), done: false }); e.target.value = ''; renderCl(); recalcXp(); } } })]);

    const notesInput = el('textarea.textarea', { placeholder: I18n.t('taskNotesPh'), oninput: (e) => t.notes = e.target.value }, t.notes || '');

    /* Four things make a task: what, when it belongs, how much it matters, and
       what time. Everything else (13 inputs before this) is refinement and
       lives behind the fold, pre-opened when the task already uses it. */
    const dateField = field(I18n.t('taskDate'), dateInput);
    const [moreBtn, moreWrap] = Views.advanced([
      field(I18n.t('description'), descInput),
      el('.grid.g-2', {}, [field(I18n.t('category'), catSel), field(I18n.t('estDuration'), estInput)]),
      field(I18n.t('goal'), goalSel, I18n.t('goalHint')),
      field(I18n.t('tags'), tagsInput),
      el('.grid.g-2', {}, [field(I18n.t('repeat'), repSel), monthDayField]),
      field(I18n.t('repeatDays'), daysRow),
      field(I18n.t('checklist'), el('.col.gap-2', {}, [clList, clAdd])),
      field(I18n.t('taskNotes'), notesInput, I18n.t('taskNotesHint')),
    ], { openIf: !!(t.description || t.category || t.estimateMin || t.goalId || (t.tags || []).length
      || (t.repeat && t.repeat.type !== 'none') || (t.checklist || []).length || t.notes) });

    const form = el('.col.gap-4', {}, [
      field(I18n.t('title'), titleInput),
      el('.grid.g-2', {}, [field(I18n.t('taskKind'), kindPick), dateField]),
      field(I18n.t('priority'), el('.row.between.gap-3.wrap', {}, [priPick, xpBadge])),
      field(I18n.t('dueTime'), timeInput),
      moreBtn, moreWrap,
    ]);

    const v = await UI.modal({ title: isNew ? I18n.t('newTask') : I18n.t('editTask'), body: form, width: '440px', actions: [
      !isNew ? { label: I18n.t('delete'), value: 'delete', variant: 'danger' } : null,
      { label: I18n.t('cancel'), value: 'cancel', variant: 'ghost' },
      { label: I18n.t('save'), value: 'save', variant: 'primary' },
    ].filter(Boolean) });

    if (v === 'save') {
      if (!t.title.trim()) { UI.toast('error', I18n.t('title') + '؟'); return; }
      // Category is no longer in the primary form — a task linked to a goal
      // inherits that goal's category instead of being asked for it.
      if (!t.category && t.goalId) t.category = (goals.find(g => g.id === t.goalId) || {}).category || '';
      if (!t.date) t.date = Jalali.todayKey();
      // Weekly tasks belong to a week, not a single day — anchor to week start.
      if (t.kind === 'weekly') t.date = Habits.weekStartKey(t.date);
      if (isNew) await Tasks.create(t); else await Tasks.update(t);
      UI.toast('success', I18n.t('saved')); onSaved && onSaved();
    } else if (v === 'delete') {
      if (await UI.confirm({ title: I18n.t('deleteTaskQ'), danger: true, confirmLabel: I18n.t('delete') })) { await Tasks.remove(existing); onSaved && onSaved(); }
    }
  }
  return { node, openEditor, fmtDur };
})();

/* ---------------------------------------------------------------------------
   15e. Today — the planner's heart (day nav, check-in, tasks, journal)
   ------------------------------------------------------------------------- */
const Today = (() => {
  let cursor = Jalali.todayKey();
  const refresh = () => Router.render();
  const nav = (delta) => { cursor = Jalali.addDays(cursor, delta); Router.render(); };
  const goto = (key) => { cursor = key; Router.go('today'); };

  async function getDay(key) {
    return (await DB.get('days', key)) || { id: key, date: key, checkin: {}, journal: {}, routineState: {}, closed: false, free: false };
  }
  const saveDay = (day) => { day.id = day.date; return DB.put('days', day); };

  async function render() {
    const key = cursor;
    const day = await getDay(key);
    const readonly = !!day.closed;
    const wrap = el('.col.gap-6');
    wrap.appendChild(dayHeader(key, day));
    if (readonly) wrap.appendChild(closedBanner(day));

    const content = el('.col.gap-6');
    if (readonly) content.classList.add('locked');
    content.appendChild(checkinCard(day));

    const tasks = await Tasks.forDate(key);
    // Weekly tasks are week-scoped: show the whole week's list on every day of that week.
    const wStart = Habits.weekStartKey(key);
    const weekTasks = (await DB.range('tasks', 'date', wStart, Jalali.addDays(wStart, 6)))
      .filter(t => t.kind === 'weekly').sort(Tasks.sortFn);
    content.appendChild(taskSection('daily', I18n.t('dailyTasks'), 'today', tasks.filter(t => t.kind === 'daily'), key, readonly));
    content.appendChild(taskSection('weekly', I18n.t('weeklyTasks'), 'week', weekTasks, key, readonly));
    content.appendChild(await habitsSection(key, readonly));
    content.appendChild(journalCard(day));
    wrap.appendChild(content);
    wrap.appendChild(dayActions(key, day));
    return wrap;
  }

  function dayHeader(key, day) {
    const j = Jalali.parseKey(key);
    const rel = Jalali.relative(key);
    const wd = Jalali.weekdaysLong[I18n.get()][j.wd];
    const tasksBadge = el('.dim.small', { text: `${I18n.num(Jalali.remainingInYear(j))} ${I18n.t('remainingDays')}` });
    return el('.card.pad', {}, [
      el('.daybar.between', {}, [
        el('.row.gap-2', {}, [
          el('button.day-nav-btn', { html: icon('chevR'), 'aria-label': I18n.t('prevDay'), onclick: () => nav(-1) }),
          el('button.day-nav-btn', { html: icon('chevL'), 'aria-label': I18n.t('nextDay'), onclick: () => nav(1) }),
          key !== Jalali.todayKey() ? el('button.btn.sm.outline', { text: I18n.t('jumpToday'), onclick: () => { cursor = Jalali.todayKey(); Router.render(); } }) : null,
        ]),
        el('.col', { style: { textAlign: 'center' } }, [
          el('.day-date', { text: Jalali.label(key) }),
          el('.day-wd', { text: wd + (rel ? ` · ${rel}` : '') + (day.free ? ` · ${I18n.t('freeDay')}` : '') }),
        ]),
        tasksBadge,
      ]),
    ]);
  }
  function closedBanner(day) {
    return el('.closed-banner', {}, [
      el('span.cb-ic', { html: icon('shield') }),
      el('.col.grow', {}, [el('.h4', { text: I18n.t('dayClosed') }), el('.hint', { text: I18n.t('dayClosedSub') })]),
      el('button.btn.sm.outline', { text: I18n.t('unlockDay'), onclick: async () => { day.closed = false; day.closedAt = null; await saveDay(day); refresh(); } }),
    ]);
  }

  function checkinCard(day) {
    const c = day.checkin || (day.checkin = {});
    const save = () => saveDay(day);
    // Sleep / wake
    const sleepIn = TimePicker.input({ value: c.sleepTime, onChange: (v) => { c.sleepTime = v || ''; save(); } });
    const wakeIn = TimePicker.input({ value: c.wakeTime, onChange: (v) => { c.wakeTime = v || ''; save(); } });
    // Sleep quality stars
    const stars = el('.stars');
    for (let i = 1; i <= 5; i++) stars.appendChild(el('button' + ((c.sleepQuality || 0) >= i ? '.on' : ''), { type: 'button', text: '★',
      onclick: () => { c.sleepQuality = i; save(); $$('button', stars).forEach((b, bi) => b.classList.toggle('on', bi < i)); } }));
    // Mood
    const moods = [['awful', '😩'], ['bad', '😕'], ['ok', '😐'], ['good', '🙂'], ['great', '😄']];
    const moodPick = el('.mood-pick');
    moods.forEach(([val, emo]) => moodPick.appendChild(el('button' + (c.mood === val ? '.on' : ''), { type: 'button', text: emo, title: I18n.t('mood_' + val),
      onclick: (e) => { c.mood = val; save(); $$('button', moodPick).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); } })));
    // Energy 1-5
    const energyPick = el('.energy-pick');
    for (let i = 1; i <= 5; i++) energyPick.appendChild(el('button' + (c.energy === i ? '.on' : ''), { type: 'button', text: I18n.num(i),
      onclick: (e) => { c.energy = i; save(); $$('button', energyPick).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); } }));
    // Weight is logged on the Health page only (kept out of the daily check-in).
    // Water counter
    const target = c.waterTarget || 8;
    const waterVal = el('.val', { text: `${I18n.num(c.water || 0)}/${I18n.num(target)}` });
    const water = el('.counter', {}, [
      el('button.counter-btn', { text: '−', onclick: () => { c.water = Math.max(0, (c.water || 0) - 1); waterVal.textContent = `${I18n.num(c.water)}/${I18n.num(target)}`; save(); } }),
      el('span', { html: icon('drop'), style: { color: 'var(--blue)' } }), waterVal,
      el('button.counter-btn', { text: '+', onclick: () => { c.water = (c.water || 0) + 1; waterVal.textContent = `${I18n.num(c.water)}/${I18n.num(target)}`; save(); } }),
    ]);
    // Intention
    const intent = el('input.input', { value: c.intention || '', placeholder: I18n.t('intentionPh'), oninput: debounce((e) => { c.intention = e.target.value; save(); }, 400) });

    const grid = el('.checkin-grid', {}, [
      field(I18n.t('sleepTime'), sleepIn), field(I18n.t('wakeTime'), wakeIn),
      field(I18n.t('sleepQuality'), stars), field(I18n.t('mood'), moodPick),
      field(I18n.t('energy'), energyPick),
      field(I18n.t('waterTarget'), water),
    ]);
    return el('.card.pad.col.gap-4', {}, [
      el('.row.gap-3', {}, [el('span.stat-ic', { style: { background: 'color-mix(in srgb,var(--orange) 15%,transparent)', color: 'var(--orange)' }, html: icon('sun') }),
        el('.h4', { text: I18n.t('morningCheckin') })]),
      grid,
      field(I18n.t('intention'), intent),
    ]);
  }
  const field = Views.field;

  function taskSection(kind, title, icName, list, key, readonly) {
    const sec = el('.card.pad.tsec');
    sec.appendChild(el('.tsec-head', {}, [
      el('.tsec-ic', { html: icon(icName) }), el('.h4.grow', { text: title }),
      el('.cnt', { text: `${I18n.num(list.filter(t => t.completed).length)}/${I18n.num(list.length)}` }),
    ]));
    const listWrap = el('.tasklist');
    if (!list.length) listWrap.appendChild(el('.dim.small', { style: { padding: '6px 2px' }, text: I18n.t('noTasksToday') }));
    else list.forEach(t => listWrap.appendChild(TaskUI.node(t, { onChange: refresh, readonly })));
    sec.appendChild(listWrap);
    if (!readonly) sec.appendChild(quickAdd(kind, key));
    return sec;
  }
  function quickAdd(kind, key) {
    const dateFor = () => kind === 'weekly' ? Habits.weekStartKey(key) : key;
    const input = el('input', { placeholder: I18n.t('quickAddPh'), 'aria-label': I18n.t('addTask'),
      onkeydown: async (e) => { if (e.key === 'Enter' && e.target.value.trim()) { const val = e.target.value.trim(); e.target.value = '';
        await Tasks.create({ title: val, kind, date: dateFor(), repeat: { type: 'none', days: [] } }); refresh(); } } });
    return el('.quickadd', {}, [
      el('span', { html: icon('plus'), style: { color: 'var(--text-3)' } }), input,
      el('button.btn.add.sm', { html: icon('plus') + '<span>' + I18n.t('addTask') + '</span>', title: I18n.t('newTask'),
        onclick: () => TaskUI.openEditor(null, refresh, { kind, date: dateFor() }) }),
    ]);
  }

  /* Habits, not "routines". A recurring thing used to exist twice — as a habit
     (own page, streaks, heatmap, records store) and as a task with
     kind:'routine' (per-day booleans on day.routineState, date:null, invisible
     to stats/reviews/history). Now there is one concept, and it shows up on the
     day it belongs to. Ticking a past day backfills; future days are readonly. */
  async function habitsSection(key, readonly) {
    const today = Jalali.todayKey();
    const ro = readonly || key > today;
    const habits = (await DB.all('habits'))
      .filter(h => h.status !== 'archived' && (h.createdKey || '') <= key && Habits.isScheduled(h, key));
    const maps = await Habits.allRecordsMaps();
    const sec = el('.card.pad.tsec');
    const done = habits.filter(h => Habits.isComplete(h, (maps[h.id] || {})[key])).length;
    sec.appendChild(el('.tsec-head', {}, [
      el('.tsec-ic', { html: icon('repeat') }), el('.h4.grow', { text: I18n.t('todaysHabits') }),
      el('.cnt', { text: `${I18n.num(done)}/${I18n.num(habits.length)}` }),
    ]));
    const listWrap = el('.tasklist');
    if (!habits.length) listWrap.appendChild(el('.dim.small', { style: { padding: '6px 2px' }, text: I18n.t('noHabitsToday') }));
    habits.forEach(h => listWrap.appendChild(HabitsView.row(h, maps[h.id] || {}, key, ro)));
    sec.appendChild(listWrap);
    if (!ro) sec.appendChild(el('.row.gap-2', {}, [
      el('button.btn.add.sm', { html: icon('plus') + '<span>' + I18n.t('newHabit') + '</span>', onclick: () => HabitsView.openEditor(null, refresh) }),
      el('button.btn.sm.ghost', { html: icon('chevR') + '<span>' + I18n.t('nav_habits') + '</span>', onclick: () => Router.go('habits') }),
    ]));
    return sec;
  }

  function journalCard(day) {
    const jr = day.journal || (day.journal = {});
    const ta = (k, label, ic) => el('.field', {}, [el('.label', {}, [label]),
      el('textarea.textarea', { placeholder: label, style: { minHeight: '84px' }, oninput: debounce((e) => { jr[k] = e.target.value; saveDay(day); }, 400) }, jr[k] || '')]);
    return el('.card.pad.col.gap-4', {}, [
      el('.row.gap-3', {}, [el('span.stat-ic', { style: { background: 'color-mix(in srgb,var(--brand) 15%,transparent)', color: 'var(--brand)' }, html: icon('book') }),
        el('.h4', { text: I18n.t('dailyJournal') })]),
      el('.grid.g-2', {}, [ta('reflection', I18n.t('reflection')), ta('gratitude', I18n.t('gratitude'))]),
      el('.grid.g-2', {}, [ta('lessons', I18n.t('lessons')), ta('tomorrow', I18n.t('tomorrowPlan'))]),
    ]);
  }

  function dayActions(key, day) {
    const btns = el('.row.gap-2.wrap');
    if (day.closed) {
      btns.appendChild(el('button.btn.outline', { html: icon('shield') + '<span>' + I18n.t('unlockDay') + '</span>',
        onclick: async () => { day.closed = false; day.closedAt = null; await saveDay(day); refresh(); } }));
    } else {
      btns.appendChild(el('button.btn.ghost', { text: I18n.t('freeDay'), onclick: async () => { day.free = !day.free; await saveDay(day); UI.toast('info', I18n.t('freeDayToast')); refresh(); } }));
      btns.appendChild(el('button.btn.danger', { html: icon('trash') + '<span>' + I18n.t('resetDay') + '</span>', onclick: () => resetDay(key, day) }));
      btns.appendChild(el('button.btn.primary', { html: icon('check') + '<span>' + I18n.t('closeDay') + '</span>', onclick: () => closeDay(key, day) }));
    }
    return el('.card.pad.row.between.wrap.gap-4', {}, [
      el('.col', {}, [el('.h4', { text: day.closed ? I18n.t('dayClosed') : I18n.t('closeDay') })]),
      btns,
    ]);
  }
  async function closeDay(key, day) {
    if (!(await UI.confirm({ title: I18n.t('closeDay'), message: I18n.t('confirmCloseDay') }))) return;
    const tasks = await Tasks.forDate(key);
    day.closed = true; day.closedAt = Date.now();
    day.stats = { total: tasks.length, completed: tasks.filter(t => t.completed).length, xp: await XP.total() };
    await saveDay(day); Bus.emit('day:close', day); UI.toast('success', I18n.t('dayClosedToast')); refresh();
  }
  async function resetDay(key, day) {
    if (!(await UI.confirm({ title: I18n.t('resetDay'), message: I18n.t('confirmResetDay'), danger: true, confirmLabel: I18n.t('resetDay') }))) return;
    const tasks = await Tasks.forDate(key);
    for (const t of tasks) await DB.hardDelete('tasks', t.id);
    try { await DB.hardDelete('days', key); } catch {}
    UI.toast('success', I18n.t('resetDayToast')); refresh();
  }
  return { render, goto, getDay, get cursor() { return cursor; } };
})();

/* ---------------------------------------------------------------------------
   15f. Week — weekly planning workspace (7-day board, drag & drop, stats)
   ------------------------------------------------------------------------- */
const Week = (() => {
  let cursor = Jalali.todayKey();
  const refresh = () => Router.render();
  const weekStartOf = (key) => { const pref = Prefs.get('weekStart') || 0; const wd = Jalali.parseKey(key).wd; return Jalali.addDays(key, -((wd - pref + 7) % 7)); };
  const weekDays = (key) => { const s = weekStartOf(key); return Array.from({ length: 7 }, (_, i) => Jalali.addDays(s, i)); };
  const nav = (delta) => { cursor = Jalali.addDays(cursor, delta * 7); Router.render(); };
  const getWeek = async (id) => (await DB.get('weeks', id)) || { id, weekKey: id, objectives: [], review: '', archived: false };
  const saveWeek = (w) => DB.put('weeks', w);

  async function render() {
    const days = weekDays(cursor);
    const week = await getWeek(days[0]);
    const tasksByDay = {}; let all = [];
    for (const dk of days) { const list = await Tasks.forDate(dk); tasksByDay[dk] = list.filter(t => t.kind !== 'weekly'); all = all.concat(list); }
    const weekly = all.filter(t => t.kind === 'weekly').sort(Tasks.sortFn);
    const dayRecs = {}; for (const dk of days) dayRecs[dk] = await DB.get('days', dk);

    const wrap = el('.col.gap-6');
    wrap.appendChild(header(days, week));
    wrap.appendChild(board(days, tasksByDay, dayRecs));
    wrap.appendChild(weeklyCard(weekly, days[0]));
    wrap.appendChild(objectivesCard(week));
    wrap.appendChild(await statsCard(days, all));
    wrap.appendChild(reviewCard(week));
    return wrap;
  }

  function header(days, week) {
    const sj = Jalali.parseKey(days[0]), ej = Jalali.parseKey(days[6]);
    const range = `${I18n.num(sj.jd)} ${Jalali.months[I18n.get()][sj.jm - 1]} — ${I18n.num(ej.jd)} ${Jalali.months[I18n.get()][ej.jm - 1]}`;
    const isThis = days.includes(Jalali.todayKey());
    return el('.card.pad', {}, [
      el('.row.between.wrap.gap-4', {}, [
        el('.row.gap-2', {}, [
          el('button.day-nav-btn', { html: icon('chevR'), 'aria-label': I18n.t('prevWeek'), onclick: () => nav(-1) }),
          el('button.day-nav-btn', { html: icon('chevL'), 'aria-label': I18n.t('nextWeek'), onclick: () => nav(1) }),
          !isThis ? el('button.btn.sm.outline', { text: I18n.t('thisWeek'), onclick: () => { cursor = Jalali.todayKey(); Router.render(); } }) : null,
        ]),
        el('.col', { style: { textAlign: 'center' } }, [
          el('.day-date', { text: `${I18n.t('weekNo')} ${I18n.num(Jalali.weekOfYear(days[0]))}` + (week.archived ? ` · ${I18n.t('weekArchived')}` : '') }),
          el('.day-wd', { text: range }),
        ]),
        el('div', { style: { width: '40px' } }),
      ]),
    ]);
  }

  function board(days, tasksByDay, dayRecs) {
    const grid = el('.week-grid');
    const todayK = Jalali.todayKey();
    days.forEach(dk => {
      const j = Jalali.parseKey(dk), isToday = dk === todayK, rec = dayRecs[dk], list = tasksByDay[dk];
      const col = el('.week-col' + (isToday ? '.is-today' : '') + (rec && rec.closed ? '.is-closed' : ''), { dataset: { day: dk } });
      col.appendChild(el('.wk-head' + (isToday ? '.today-h' : ''), {}, [
        el('.col', {}, [ el('.wd', { text: Jalali.weekdays[I18n.get()][j.wd] }), el('.dnum', { text: I18n.num(j.jd) + ' ' + Jalali.months[I18n.get()][j.jm - 1] }) ]),
        el('.wk-cnt', { text: `${I18n.num(list.filter(t => t.completed).length)}/${I18n.num(list.length)}` }),
      ]));
      const body = el('.wk-body');
      list.forEach(t => body.appendChild(chip(t)));
      col.appendChild(body);
      col.appendChild(el('.wk-add', {}, [ el('input', { placeholder: '+ ' + I18n.t('addTask'), 'aria-label': I18n.t('addTask'),
        onkeydown: async (e) => { if (e.key === 'Enter' && e.target.value.trim()) { await Tasks.create({ title: e.target.value.trim(), kind: 'daily', date: dk }); e.target.value = ''; refresh(); } } }) ]));
      // Drag & drop target
      col.addEventListener('dragover', (e) => { e.preventDefault(); if (!(rec && rec.closed)) col.classList.add('drop-hover'); });
      col.addEventListener('dragleave', () => col.classList.remove('drop-hover'));
      col.addEventListener('drop', async (e) => { e.preventDefault(); col.classList.remove('drop-hover');
        if (rec && rec.closed) return; const id = e.dataTransfer.getData('text/plain'); if (!id) return;
        const t = await DB.get('tasks', id); if (t && t.date !== dk) { t.date = dk; await Tasks.update(t); refresh(); } });
      grid.appendChild(col);
    });
    return grid;
  }
  function chip(t) {
    const c = el('.wk-chip' + (t.completed ? '.done' : ''), { dataset: { p: t.priority, id: t.id }, draggable: 'true', title: t.title });
    c.appendChild(el('.wk-stripe'));
    const check = el('.wk-check', { html: t.completed ? icon('check') : '',
      onclick: async (e) => { e.stopPropagation(); const done = !t.completed;
        c.classList.toggle('done', done); check.innerHTML = done ? icon('check') : '';
        await Tasks.toggleComplete(t, check); refresh(); } });
    c.appendChild(check);
    c.appendChild(el('.wk-title', { text: t.title }));
    c.addEventListener('click', () => TaskUI.openEditor(t, refresh));
    c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
    return c;
  }

  /** Week-scoped tasks (kind weekly) — they live on the week, not one day column. */
  function weeklyCard(list, wStart) {
    const card = el('.card.pad.col.gap-4');
    card.appendChild(el('.row.gap-3', {}, [
      el('span.stat-ic', { style: { background: 'color-mix(in srgb,var(--teal) 15%,transparent)', color: 'var(--teal)' }, html: icon('week') }),
      el('.h4.grow', { text: I18n.t('weeklyTasks') }),
      el('.cnt', { text: `${I18n.num(list.filter(t => t.completed).length)}/${I18n.num(list.length)}` }),
    ]));
    const wrap = el('.tasklist');
    if (!list.length) wrap.appendChild(el('.dim.small', { style: { padding: '6px 2px' }, text: I18n.t('noTasksToday') }));
    else list.forEach(t => wrap.appendChild(TaskUI.node(t, { onChange: refresh })));
    card.appendChild(wrap);
    card.appendChild(el('.quickadd', {}, [
      el('span', { html: icon('plus'), style: { color: 'var(--text-3)' } }),
      el('input', { placeholder: I18n.t('quickAddPh'), 'aria-label': I18n.t('addTask'),
        onkeydown: async (e) => { if (e.key === 'Enter' && e.target.value.trim()) { await Tasks.create({ title: e.target.value.trim(), kind: 'weekly', date: wStart }); e.target.value = ''; refresh(); } } }),
      el('button.btn.add.sm', { html: icon('plus') + '<span>' + I18n.t('addTask') + '</span>', title: I18n.t('newTask'),
        onclick: () => TaskUI.openEditor(null, refresh, { kind: 'weekly', date: wStart }) }),
    ]));
    return card;
  }

  function objectivesCard(week) {
    const list = el('.col.gap-2');
    function renderList() {
      list.innerHTML = '';
      (week.objectives || []).forEach((o, idx) => list.appendChild(el('.cl-row' + (o.done ? '.on' : ''), {}, [
        el('.cl-box', { html: o.done ? icon('check') : '', onclick: async () => { o.done = !o.done; await saveWeek(week); renderList(); } }),
        el('.cl-text', { text: o.text }),
        el('button.tb-btn', { html: icon('x'), onclick: async () => { week.objectives.splice(idx, 1); await saveWeek(week); renderList(); } }),
      ])));
      if (!week.objectives || !week.objectives.length) list.appendChild(el('.dim.small', { style: { padding: '4px 2px' }, text: I18n.t('noData') }));
    }
    renderList();
    return el('.card.pad.col.gap-4', {}, [
      el('.row.gap-3', {}, [ el('span.stat-ic', { style: { background: 'var(--brand-soft)', color: 'var(--brand)' }, html: icon('goals') }), el('.h4', { text: I18n.t('weeklyObjectives') }) ]),
      list,
      el('.quickadd', {}, [ el('span', { html: icon('plus'), style: { color: 'var(--text-3)' } }),
        el('input', { placeholder: I18n.t('objectivePh'), onkeydown: async (e) => { if (e.key === 'Enter' && e.target.value.trim()) { week.objectives = week.objectives || []; week.objectives.push({ id: uid(), text: e.target.value.trim(), done: false }); e.target.value = ''; await saveWeek(week); renderList(); } } }) ]),
    ]);
  }

  async function statsCard(days, all) {
    const done = all.filter(t => t.completed).length, total = all.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const focusH = all.reduce((s, t) => s + (t.actualSec || 0), 0) / 3600;
    const activeDays = days.filter(dk => all.some(t => t.date === dk && t.completed)).length;
    const xpSum = (await DB.all('xpLog')).filter(r => days.includes(r.date)).reduce((s, r) => s + (r.amount || 0), 0);
    const catStats = {};
    all.forEach(t => { if (!t.category) return; const c = catStats[t.category] || (catStats[t.category] = { done: 0, total: 0 }); c.total++; if (t.completed) c.done++; });
    let best = null, worst = null;
    Object.entries(catStats).forEach(([c, s]) => { const rate = s.done / s.total; if (!best || rate > best.rate) best = { c, rate }; if (!worst || rate < worst.rate) worst = { c, rate }; });
    const tiles = [
      { cap: I18n.t('completion'), num: I18n.num(pct) + '%', ic: 'check', color: 'var(--green)' },
      { cap: I18n.t('focusHours'), num: I18n.num(focusH.toFixed(1)), ic: 'clock', color: 'var(--brand)' },
      { cap: I18n.t('activeDays'), num: I18n.num(activeDays), ic: 'today', color: 'var(--blue)' },
      { cap: I18n.t('xpEarnedStat'), num: I18n.num(xpSum), ic: 'bolt', color: 'var(--orange)' },
    ];
    const grid = el('.grid.g-4');
    tiles.forEach(t => grid.appendChild(el('.card.pad.stat', {}, [ el('.row.between', {}, [
      el('.col', {}, [ el('.cap', { text: t.cap }), el('.num', { text: t.num }) ]),
      el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) }),
    ]) ])));
    const card = el('.card.pad.col.gap-4', {}, [ el('.h4', { text: I18n.t('weeklyStats') }), grid ]);
    if (best) card.appendChild(el('.row.wrap.gap-2', {}, [
      el('.chip', {}, [ el('span', { html: icon('fire') }), el('span', { text: `${I18n.t('bestCategory')}: ${I18n.t('cat_' + best.c)}` }) ]),
      (worst && worst.c !== best.c) ? el('.chip', {}, [ el('span', { text: `${I18n.t('weakestCategory')}: ${I18n.t('cat_' + worst.c)}` }) ]) : null,
    ]));
    return card;
  }

  function reviewCard(week) {
    const ta = el('textarea.textarea', { placeholder: I18n.t('weeklyReviewPh'), style: { minHeight: '90px' }, oninput: debounce((e) => { week.review = e.target.value; saveWeek(week); }, 400) }, week.review || '');
    return el('.card.pad.col.gap-4', {}, [
      el('.row.gap-3', {}, [ el('span.stat-ic', { style: { background: 'color-mix(in srgb,var(--brand) 15%,transparent)', color: 'var(--brand)' }, html: icon('book') }), el('.h4', { text: I18n.t('weeklyReview') }) ]),
      ta,
      el('.row.wrap.gap-2', {}, [
        el('button.btn.outline', { html: icon('arrowR') + '<span>' + I18n.t('carryTasks') + '</span>', onclick: carryOver }),
        el('button.btn.outline', { html: icon('copy') + '<span>' + I18n.t('duplicateWeek') + '</span>', onclick: duplicateWeek }),
        el('button.btn.ghost', { html: icon(week.archived ? 'upload' : 'download') + '<span>' + I18n.t(week.archived ? 'unarchiveWeek' : 'archiveWeek') + '</span>',
          onclick: async () => { week.archived = !week.archived; await saveWeek(week); UI.toast('info', I18n.t('weekArchived')); refresh(); } }),
      ]),
    ]);
  }
  async function carryOver() {
    const todayK = Jalali.todayKey();
    const overdue = (await DB.all('tasks')).filter(t => !t.completed && t.date && t.date < todayK);
    for (const t of overdue) { t.date = todayK; await Tasks.update(t); }
    UI.toast('success', `${I18n.t('carriedToast')} (${I18n.num(overdue.length)})`); refresh();
  }
  async function duplicateWeek() {
    const days = weekDays(cursor); let count = 0;
    for (const dk of days) { const list = await Tasks.forDate(dk); for (const t of list) { await Tasks.duplicate({ ...t, date: Jalali.addDays(dk, 7) }); count++; } }
    UI.toast('success', `${I18n.t('duplicatedToast')} (${I18n.num(count)})`);
  }
  return { render, goto: (k) => { cursor = k; Router.go('week'); } };
})();

/* ---------------------------------------------------------------------------
   15g. Month — Jalali calendar overview (per-day signals, click → Today)
   ------------------------------------------------------------------------- */
const Month = (() => {
  let cur = (() => { const j = Jalali.fromDate(); return { jy: j.jy, jm: j.jm }; })();
  const MOODS = { great: '😄', good: '🙂', ok: '😐', bad: '😕', awful: '😩' };
  const MOOD_VAL = { great: 5, good: 4, ok: 3, bad: 2, awful: 1 };
  function navM(delta) { let { jy, jm } = cur; jm += delta; if (jm > 12) { jm = 1; jy++; } if (jm < 1) { jm = 12; jy--; } cur = { jy, jm }; Router.render(); }

  async function render() {
    const { jy, jm } = cur;
    const len = Jalali.monthLen(jy, jm);
    const firstWd = Jalali.parseKey(Jalali.key({ jy, jm, jd: 1 })).wd;
    const pref = Prefs.get('weekStart') || 0;
    const lead = (firstWd - pref + 7) % 7;
    const dayKeys = Array.from({ length: len }, (_, i) => Jalali.key({ jy, jm, jd: i + 1 }));
    const lo = dayKeys[0], hi = dayKeys[len - 1];
    // One range query per store (was 2 sequential queries per day).
    const dayRecs = {}; (await DB.range('days', 'date', lo, hi)).forEach(d => { dayRecs[d.date] = d; });
    const monthTasks = await DB.range('tasks', 'date', lo, hi);
    const tasksByDay = {}; dayKeys.forEach(dk => { tasksByDay[dk] = []; });
    monthTasks.forEach(t => { if (t.kind !== 'weekly' && tasksByDay[t.date]) tasksByDay[t.date].push(t); });
    dayKeys.forEach(dk => tasksByDay[dk].sort(Tasks.sortFn));
    const weekly = monthTasks.filter(t => t.kind === 'weekly');
    // Habits count toward a day's progress the same way they do on Today
    // (they used to be counted here as kind:'routine' tasks + day.routineState).
    const habits = (await DB.all('habits')).filter(h => h.status !== 'archived');
    const hMaps = await Habits.allRecordsMaps();
    const xpByDay = {}; (await DB.range('xpLog', 'date', lo, hi)).forEach(r => { xpByDay[r.date] = (xpByDay[r.date] || 0) + (r.amount || 0); });

    const wrap = el('.col.gap-6');
    wrap.appendChild(header());
    wrap.appendChild(grid(dayKeys, lead, dayRecs, tasksByDay, xpByDay, habits, hMaps));
    wrap.appendChild(stats(dayKeys, dayRecs, tasksByDay, xpByDay, weekly, habits, hMaps));
    return wrap;
  }
  function header() {
    const { jy, jm } = cur;
    const now = Jalali.fromDate();
    const isThis = now.jy === jy && now.jm === jm;
    return el('.card.pad', {}, [
      el('.row.between.wrap.gap-4', {}, [
        el('.row.gap-2', {}, [
          el('button.day-nav-btn', { html: icon('chevR'), 'aria-label': I18n.t('prevMonth'), onclick: () => navM(-1) }),
          el('button.day-nav-btn', { html: icon('chevL'), 'aria-label': I18n.t('nextMonth'), onclick: () => navM(1) }),
          !isThis ? el('button.btn.sm.outline', { text: I18n.t('thisMonth'), onclick: () => { const j = Jalali.fromDate(); cur = { jy: j.jy, jm: j.jm }; Router.render(); } }) : null,
        ]),
        el('.col', { style: { textAlign: 'center' } }, [
          el('.day-date', { text: `${Jalali.months[I18n.get()][jm - 1]} ${I18n.num(jy)}` }),
          el('.day-wd', { text: I18n.t('clickDayHint') }),
        ]),
        el('div', { style: { width: '40px' } }),
      ]),
    ]);
  }
  /** Habits scheduled for a day, and how many of them were done. */
  function habitDay(habits, hMaps, dk) {
    const due = habits.filter(h => (h.createdKey || '') <= dk && Habits.isScheduled(h, dk));
    return { due: due.length, done: due.filter(h => Habits.isComplete(h, (hMaps[h.id] || {})[dk])).length };
  }
  function grid(dayKeys, lead, dayRecs, tasksByDay, xpByDay, habits, hMaps) {
    const pref = Prefs.get('weekStart') || 0;
    const wdRow = el('.month-wdrow');
    for (let i = 0; i < 7; i++) wdRow.appendChild(el('.month-wd', { text: Jalali.weekdays[I18n.get()][(pref + i) % 7] }));
    const g = el('.month-grid');
    for (let i = 0; i < lead; i++) g.appendChild(el('.mday.blank'));
    const todayK = Jalali.todayKey();
    dayKeys.forEach(dk => {
      const j = Jalali.parseKey(dk), rec = dayRecs[dk], list = tasksByDay[dk];
      const hd = habitDay(habits, hMaps, dk);
      const done = list.filter(t => t.completed).length + hd.done;
      const total = list.length + hd.due;
      const pct = total ? Math.round(done / total * 100) : 0;
      const cell = el('.mday' + (dk === todayK ? '.is-today' : '') + (rec && rec.closed ? '.is-closed' : ''), { role: 'button', tabindex: 0,
        onclick: () => Today.goto(dk), onkeydown: (e) => { if (e.key === 'Enter') Today.goto(dk); } });
      cell.appendChild(el('.mtop', {}, [ el('.num', { text: I18n.num(j.jd) }),
        (rec && rec.checkin && rec.checkin.mood) ? el('.mmood', { text: MOODS[rec.checkin.mood] }) : null ]));
      if (rec && rec.free) cell.appendChild(el('.mbadge', { style: { background: 'color-mix(in srgb,var(--blue) 18%,transparent)', color: 'var(--blue)' }, text: I18n.t('freeDayShort') }));
      else if (rec && rec.closed) cell.appendChild(el('.mbadge', { style: { background: 'color-mix(in srgb,var(--orange) 18%,transparent)', color: 'var(--orange)' }, text: I18n.t('closedDay') }));
      const shown = list.slice(0, 2);
      if (shown.length) {
        const tl = el('.mtasks');
        shown.forEach(t => tl.appendChild(el('.mtask' + (t.completed ? '.done' : ''), { dataset: { p: t.priority } }, [
          el('span.mdot2'), el('span.mtt', { text: t.title }) ])));
        if (list.length > 2) tl.appendChild(el('.mmore', { text: '+' + I18n.num(list.length - 2) }));
        cell.appendChild(tl);
      }
      const bottom = el('.mrow');
      if (total) bottom.appendChild(el('.tcount', { text: `${I18n.num(done)}/${I18n.num(total)}` }));
      if (xpByDay[dk]) bottom.appendChild(el('.mxp', { text: `${I18n.num(xpByDay[dk])}xp` }));
      cell.appendChild(bottom);
      if (total) cell.appendChild(el('.mbar', {}, [ el('span', { style: { width: pct + '%' } }) ]));
      cell.appendChild(el('button.madd', { html: icon('plus'), title: I18n.t('addTask'), 'aria-label': I18n.t('addTask'),
        onclick: (e) => { e.stopPropagation(); TaskUI.openEditor(null, () => Router.render(), { kind: 'daily', date: dk }); } }));
      g.appendChild(cell);
    });
    return el('.card.pad', {}, [ wdRow, g ]);
  }
  function stats(dayKeys, dayRecs, tasksByDay, xpByDay, weekly, habits, hMaps) {
    const todayK = Jalali.todayKey();
    let done = 0, total = 0, focusSec = 0;
    dayKeys.forEach(dk => { const l = tasksByDay[dk]; total += l.length; done += l.filter(t => t.completed).length; focusSec += l.reduce((a, t) => a + (t.actualSec || 0), 0);
      // Habits: only past/today days count, or future scheduling would drown the completion %.
      if (dk <= todayK) { const hd = habitDay(habits, hMaps, dk); total += hd.due; done += hd.done; } });
    total += weekly.length; done += weekly.filter(t => t.completed).length;
