/* ---------------------------------------------------------------------------
   15p. Focus — Pomodoro engine + distraction-free Focus Mode
   ------------------------------------------------------------------------- */
const Focus = (() => {
  const S = { mode: 'work', remaining: 0, running: false, taskId: null, phaseStart: null, done: 0, interruptions: 0 };
  let tick = null;
  const durMin = (m) => Math.max(1, +(m === 'work' ? Prefs.get('pomoWork') : m === 'break' ? Prefs.get('pomoBreak') : Prefs.get('pomoLong')) || 25);
  const total = () => durMin(S.mode) * 60;
  const state = () => ({ ...S, total: total() });

  function setMode(m, autoStart = false) {
    S.mode = m; S.remaining = durMin(m) * 60; S.phaseStart = null; S.running = false;
    stopTick(); if (autoStart) start(); else emit();
  }
  function emit() { Bus.emit('focus:tick', state()); }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function start() {
    if (S.running) return;
    if (!S.remaining) S.remaining = total();
    S.running = true; S.phaseStart = S.phaseStart || Date.now();
    stopTick();
    tick = setInterval(() => {
      S.remaining--;
      if (S.remaining <= 0) { S.remaining = 0; complete(); return; }
      emit();
    }, 1000);
    emit();
  }
  function pause() { if (!S.running) return; S.running = false; stopTick(); emit(); }
  async function stop() {
    if (S.phaseStart && S.mode === 'work' && S.remaining < total()) { S.interruptions++; await record(total() - S.remaining, true); }
    S.phaseStart = null; setMode(S.mode);
  }
  function skip() { S.phaseStart = null; advance(); }
  async function complete() {
    stopTick(); S.running = false;
    if (S.mode === 'work') {
      S.done++;
      await record(total(), false);
      UI.toast('success', I18n.t('sessionDone'));
      await XP.award(15, 'focus', S.taskId || null);
    }
    S.phaseStart = null;
    advance();
  }
  function advance() {
    const every = Math.max(1, +Prefs.get('pomoLongEvery') || 4);
    const next = S.mode === 'work' ? (S.done % every === 0 ? 'long' : 'break') : 'work';
    setMode(next, !!Prefs.get('pomoAuto'));
  }
  /** Persist a finished (or interrupted) work session and credit the task. */
  async function record(seconds, interrupted) {
    if (seconds < 30) return;
    await DB.put('focus', { date: Jalali.todayKey(), kind: 'work', seconds, taskId: S.taskId || null, interrupted: !!interrupted, endedAt: Date.now() });
    if (S.taskId) { const t = await DB.get('tasks', S.taskId); if (t) { t.actualSec = (t.actualSec || 0) + seconds; await Tasks.update(t); } }
    Bus.emit('focus:session', { seconds, interrupted });
  }
  const fmt = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  async function stats() {
    const all = await DB.all('focus');
    const today = Jalali.todayKey();
    const wStart = Habits.weekStartKey(today), mPrefix = today.slice(0, 7);
    const sum = (rows) => rows.reduce((s, r) => s + (r.seconds || 0), 0);
    const todays = all.filter(r => r.date === today);
    return {
      today: todays.length, todaySec: sum(todays),
      week: all.filter(r => r.date >= wStart && r.date <= today).length,
      month: all.filter(r => r.date.startsWith(mPrefix)).length,
      all: all.length, allSec: sum(all),
      interruptions: all.filter(r => r.interrupted).length,
      todayRows: todays.sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0)),
    };
  }
  setMode('work');
  return { state, setMode, start, pause, stop, skip, fmt, stats, durMin,
    setTask: (id) => { S.taskId = id; emit(); }, taskId: () => S.taskId };
})();

/* ---------------------------------------------------------------------------
   15q. FocusView — pomodoro page + fullscreen focus overlay
   ------------------------------------------------------------------------- */
const FocusView = (() => {
  let unsub = null;
  const modeCls = (m) => m === 'break' ? '.brk' : m === 'long' ? '.lng' : '';

  /** Circular progress ring; returns {node, update}. */
  function ring(size = 260) {
    const r = (size - 22) / 2, c = 2 * Math.PI * r;
    const node = el('.timer-ring', { html: `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle class="tr-track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="14"/>
      <circle class="tr-bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="14" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="0"/></svg>` });
    const inner = el('.tr-inner', {}, [el('.tr-time', { text: '25:00' }), el('.tr-mode', { text: I18n.t('pm_work') })]);
    node.appendChild(inner);
    const bar = node.querySelector('.tr-bar');
    function update(st) {
      const frac = st.total ? st.remaining / st.total : 1;
      bar.style.strokeDashoffset = String(c * (1 - frac));
      node.querySelector('.tr-time').textContent = I18n.num(Focus.fmt(st.remaining));
      node.querySelector('.tr-mode').textContent = I18n.t('pm_' + st.mode);
      node.className = 'timer-ring' + modeCls(st.mode).replace('.', ' ');
    }
    return { node, update };
  }

  async function render() {
    const st = Focus.state();
    const s = await Focus.stats();
    const tasks = (await Tasks.forDate(Jalali.todayKey())).filter(t => !t.completed);
    const wrap = el('.col.gap-6');
    wrap.appendChild(Views.pageHeader(I18n.t('nav_focus'), I18n.t('pomodoro'), [
      el('button.btn.outline', { html: icon('expand') + '<span>' + I18n.t('enterFocus') + '</span>', onclick: () => openOverlay() }),
    ]));

    /* Timer card */
    const R = ring(260);
    const modeSeg = el('.seg');
    ['work', 'break', 'long'].forEach(m => modeSeg.appendChild(el('button' + (st.mode === m ? '.on' : ''), { text: I18n.t('pm_' + m), onclick: () => { Focus.setMode(m); Router.render(); } })));
    const dots = el('.pomo-dots');
    const every = Math.max(1, +Prefs.get('pomoLongEvery') || 4);
    for (let i = 0; i < every; i++) dots.appendChild(el('i' + ((st.done % every || (st.done ? every : 0)) > i ? '.on' : '')));
    const playBtn = el('button.btn.primary.lg', { html: icon(st.running ? 'pause' : 'play') + '<span>' + I18n.t(st.running ? 'pauseTimer' : (st.remaining < st.total ? 'resumeTimer' : 'startTimer')) + '</span>',
      onclick: () => { st.running ? Focus.pause() : Focus.start(); Router.render(); } });
    const taskSel = el('select.select', { style: { maxWidth: '260px' }, onchange: (e) => Focus.setTask(e.target.value || null) },
      [el('option', { value: '', text: I18n.t('noTaskSelected'), selected: !st.taskId }), ...tasks.map(t => el('option', { value: t.id, text: t.title, selected: st.taskId === t.id }))]);

    wrap.appendChild(el('.card.pad.col.gap-6', { style: { alignItems: 'center' } }, [
      modeSeg, R.node, dots,
      el('.row.gap-2.wrap', { style: { justifyContent: 'center' } }, [
        playBtn,
        el('button.btn.outline', { html: icon('stop') + '<span>' + I18n.t('stopTimer') + '</span>', onclick: async () => { await Focus.stop(); Router.render(); } }),
        el('button.btn.ghost', { html: icon('skipF') + '<span>' + I18n.t('skipPhase') + '</span>', onclick: () => { Focus.skip(); Router.render(); } }),
      ]),
      el('.row.gap-2.wrap', { style: { justifyContent: 'center', alignItems: 'center' } }, [el('.label', { text: I18n.t('currentTask') }), taskSel]),
    ]));
    R.update(st);
    bind(R);

    /* Stats */
    const tiles = [
      { cap: I18n.t('sessionsToday'), num: I18n.num(s.today), ic: 'timer', color: 'var(--brand)' },
      { cap: I18n.t('sessionsWeek'), num: I18n.num(s.week), ic: 'week', color: 'var(--blue)' },
      { cap: I18n.t('focusHours'), num: I18n.num((s.allSec / 3600).toFixed(1)), ic: 'clock', color: 'var(--green)' },
      { cap: I18n.t('interruptions'), num: I18n.num(s.interruptions), ic: 'info', color: 'var(--orange)' },
    ];
    const grid = el('.grid.g-4');
    tiles.forEach(t => grid.appendChild(el('.card.pad.stat', {}, [el('.row.between', {}, [
      el('.col', {}, [el('.cap', { text: t.cap }), el('.num', { text: t.num })]),
      el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) })])])));

      el('.grid.g-4', {}, [numIn('pomoWork', I18n.t('workMin')), numIn('pomoBreak', I18n.t('breakMin')), numIn('pomoLong', I18n.t('longMin')), numIn('pomoLongEvery', I18n.t('longEvery'))]),
      el('.row.between', {}, [el('.label', { text: I18n.t('autoStart') }), Settings.toggle(Prefs.get('pomoAuto'), (v) => Prefs.set('pomoAuto', v))]),
    ]));
    return wrap;
  }

  /** Keep the visible ring in sync with the engine; auto-detaches on navigation. */
  function bind(R) {
    if (unsub) unsub();
    unsub = Bus.on('focus:tick', (st) => { if (document.body.contains(R.node)) R.update(st); else { unsub && unsub(); unsub = null; } });
  }

  function openOverlay() {
    const ov = $('#focusOverlay');
    ov.innerHTML = '';
    const R = ring(340);
    const st0 = Focus.state();
    const taskTitle = el('.fo-task', { text: I18n.t('noTaskSelected') });
    (async () => { const id = Focus.taskId(); if (id) { const t = await DB.get('tasks', id); if (t) taskTitle.textContent = t.title; } })();
    const notes = el('textarea.textarea.fo-notes', { placeholder: I18n.t('quickNotesPh'), oninput: debounce(async (e) => {
      const day = await Today.getDay(Jalali.todayKey()); day.journal = day.journal || {}; day.journal.focusNotes = e.target.value; await DB.put('days', day);
    }, 500) });
    const play = el('button.btn.primary.lg', { html: icon(st0.running ? 'pause' : 'play'), onclick: () => { const s = Focus.state(); s.running ? Focus.pause() : Focus.start(); play.innerHTML = icon(Focus.state().running ? 'pause' : 'play'); } });
    ov.append(
      el('button.btn.ghost.fo-exit', { html: icon('x') + '<span>' + I18n.t('exitFocus') + '</span>', onclick: closeOverlay }),
      taskTitle, R.node,
      el('.row.gap-2', {}, [play,
        el('button.btn.outline', { html: icon('stop'), onclick: async () => { await Focus.stop(); } }),
        el('button.btn.ghost', { html: icon('skipF'), onclick: () => Focus.skip() })]),
      el('.col.gap-2', {}, [el('.fo-hint', { text: I18n.t('quickNotes') }), notes]),
    );
    ov.classList.add('open');
    R.update(Focus.state());
    const off = Bus.on('focus:tick', (st) => R.update(st));
    ov._off = off;
    document.addEventListener('keydown', escClose);
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }
  function escClose(e) { if (e.key === 'Escape') closeOverlay(); }
  function closeOverlay() {
    const ov = $('#focusOverlay');
    ov.classList.remove('open'); if (ov._off) { ov._off(); ov._off = null; }
    document.removeEventListener('keydown', escClose);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
  return { render, openOverlay, closeOverlay, ring };
})();

/* ---------------------------------------------------------------------------
   15r. Health — daily metrics, trends and correlations
   ------------------------------------------------------------------------- */
const Health = (() => {
  const MOOD_VAL = { great: 5, good: 4, ok: 3, bad: 2, awful: 1 };
  const MOOD_EMO = { great: '😄', good: '🙂', ok: '😐', bad: '😕', awful: '😩' };
  /** Extra metrics live in the `health` store keyed by date; core check-in stays on the day record. */
  const extra = async (key) => (await DB.get('health', key)) || { id: key, date: key, workout: false, workoutMin: 0, calories: null, steps: null };
  const saveExtra = (rec) => DB.put('health', rec);

  /** Sleep duration in hours from check-in times (handles crossing midnight). */
  function sleepHours(c) {
    if (!c || !c.sleepTime || !c.wakeTime) return null;
    const [sh, sm] = c.sleepTime.split(':').map(Number), [wh, wm] = c.wakeTime.split(':').map(Number);
    if ([sh, sm, wh, wm].some(n => Number.isNaN(n))) return null;
    let mins = (wh * 60 + wm) - (sh * 60 + sm);
    if (mins <= 0) mins += 24 * 60;
    return +(mins / 60).toFixed(1);
  }
  /** Pearson correlation over paired samples; null when too little data. */
  function pearson(pairs) {
    const p = pairs.filter(([a, b]) => a != null && b != null && !Number.isNaN(a) && !Number.isNaN(b));
    if (p.length < 3) return null;
    const n = p.length, mx = p.reduce((s, [a]) => s + a, 0) / n, my = p.reduce((s, [, b]) => s + b, 0) / n;
    let num = 0, dx = 0, dy = 0;
    p.forEach(([a, b]) => { const u = a - mx, v = b - my; num += u * v; dx += u * u; dy += v * v; });
    if (!dx || !dy) return null;
    return +(num / Math.sqrt(dx * dy)).toFixed(2);
  }
  /** Collect one row per day across health, task and focus sources.
      Four range/bulk queries total — the old per-day loop issued 3 queries per
      day (270 for the 90-day view). */
  async function series(days) {
    const sorted = days.slice().sort();
    const lo = sorted[0], hi = sorted[sorted.length - 1];
    const [dayRows, exRows, taskRows, focusAll] = await Promise.all([
      DB.range('days', 'date', lo, hi), DB.range('health', 'date', lo, hi),
      DB.range('tasks', 'date', lo, hi), DB.all('focus'),
    ]);
    const dayMap = {}; dayRows.forEach(d => { dayMap[d.date] = d; });
    const exMap = {}; exRows.forEach(x => { exMap[x.date] = x; });
    const tasksBy = {}; taskRows.forEach(t => { (tasksBy[t.date] = tasksBy[t.date] || []).push(t); });
    const focusBy = {}; focusAll.forEach(f => { focusBy[f.date] = (focusBy[f.date] || 0) + (f.seconds || 0); });
    return days.map(key => {
      const c = (dayMap[key] && dayMap[key].checkin) || {};
      const ex = exMap[key] || { workout: false, workoutMin: 0, calories: null, steps: null };
      const tasks = tasksBy[key] || [];
      const done = tasks.filter(t => t.completed).length;
      return {
        key, sleep: sleepHours(c), quality: c.sleepQuality || null, mood: c.mood ? MOOD_VAL[c.mood] : null,
        energy: c.energy || null, weight: c.weight || null, water: c.water || null,
        workout: !!ex.workout, workoutMin: ex.workoutMin || 0, calories: ex.calories, steps: ex.steps,
        tasksTotal: tasks.length, tasksDone: done,
        completion: tasks.length ? Math.round(done / tasks.length * 100) : null,
        focusHours: +((focusBy[key] || 0) / 3600).toFixed(2),
      };
    });
  }
  const range = (n) => { const t = Jalali.todayKey(); return Array.from({ length: n }, (_, i) => Jalali.addDays(t, -(n - 1 - i))); };
  return { extra, saveExtra, sleepHours, pearson, series, range, MOOD_VAL, MOOD_EMO };
})();

      el('.col.gap-1', {}, [el('.h4', { text: I18n.t('patternsTitle') }), el('.hint', { text: I18n.t('patternsSub') })]),
      wrap, el('.hint', { text: I18n.t('corrHint') })]);

/* ---------------------------------------------------------------------------
   15t. History — unified timeline aggregated across every module
   ------------------------------------------------------------------------- */
const History = (() => {
  const TYPES = ['task', 'habit', 'finance', 'note', 'goal', 'focus', 'health', 'day'];
  const STYLE = {
    task:    { ic: 'check',   color: 'var(--green)' },
    habit:   { ic: 'habits',  color: 'var(--teal)' },
    finance: { ic: 'finance', color: 'var(--orange)' },
    note:    { ic: 'notes',   color: 'var(--blue)' },
    goal:    { ic: 'goals',   color: 'var(--brand)' },
    focus:   { ic: 'timer',   color: 'var(--pink)' },
    health:  { ic: 'health',  color: 'var(--red)' },
    day:     { ic: 'today',   color: 'var(--text-3)' },
  };
  const hhmm = (ts) => { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

  /** Build every timeline event inside `days` (array of Jalali keys). */
  async function events(days) {
    const set = new Set(days), out = [];
    // Date-scoped stores are read through their index: rendering one week must
    // not scan six figures of rows.
    const sorted = days.slice().sort();
    const lo = sorted[0], hi = sorted[sorted.length - 1];
    const push = (key, type, title, sub, time, go) => { if (set.has(key)) out.push({ key, type, title, sub, time, go }); };

    const tasks = await DB.all('tasks');
    tasks.forEach(t => { if (t.completed && t.completedAt) {
      const key = Jalali.keyFromDate(new Date(t.completedAt));
      push(key, 'task', t.title, I18n.t('evTaskDone'), hhmm(t.completedAt), () => Today.goto(t.date || key));
    }});

    const habits = await DB.all('habits');
    const hMap = {}; habits.forEach(h => hMap[h.id] = h);
    const hrecs = await DB.range('habitRecords', 'date', lo, hi);
    hrecs.forEach(r => { const h = hMap[r.habitId]; if (!h) return;
      if (r.done) push(r.date, 'habit', `${h.icon || ''} ${h.title}`.trim(), I18n.t('evHabitDone'), null, () => Router.go('habits', { id: h.id }));
      else if (r.skipped) push(r.date, 'habit', `${h.icon || ''} ${h.title}`.trim(), I18n.t('evHabitSkip'), null, () => Router.go('habits', { id: h.id }));
    });

    const txs = await DB.range('transactions', 'date', lo, hi);
    txs.forEach(t => {
      const ci = Finance.catInfo(t.category);
      const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '⇄';
      push(t.date, 'finance', `${sign} ${Finance.fmt(t.amount)}`, t.description || (ci ? I18n.t('cat_' + t.category) : ''), t.time || null, () => Router.go('finance'));
    });

    const notes = await DB.all('notes');
    notes.forEach(n => { if (!n.updatedAt) return;
      push(Jalali.keyFromDate(new Date(n.updatedAt)), 'note', n.title || I18n.t('emptyNote'), I18n.t('evNoteEdit'), hhmm(n.updatedAt), () => NotesView.open(n.id));
    });

    const goals = await DB.all('goals');
    goals.forEach(g => (g.activity || []).forEach(a => {
      if (!a.at) return;
      push(Jalali.keyFromDate(new Date(a.at)), 'goal', g.title, I18n.t(a.type) === a.type ? (a.text || '') : I18n.t(a.type), hhmm(a.at), () => Router.go('goals', { id: g.id }));
    }));

    const focus = await DB.all('focus');
    focus.forEach(f => push(f.date, 'focus', `${I18n.num(Math.round((f.seconds || 0) / 60))} ${I18n.t('minutesUnit')}`,
      I18n.t('evFocusDone') + (f.interrupted ? ' · ' + I18n.t('interruptions') : ''), f.endedAt ? hhmm(f.endedAt) : null, () => Router.go('focus')));

    for (const key of days) {
      const day = await DB.get('days', key);
      if (!day) continue;
      const c = day.checkin || {};
      const bits = [];
      if (c.mood) bits.push(Health.MOOD_EMO[c.mood]);
      const sh = Health.sleepHours(c); if (sh) bits.push(`${I18n.num(sh)}${I18n.t('hoursUnit')}`);
      if (c.weight) bits.push(`${I18n.num(c.weight)}kg`);
      if (c.water) bits.push(`${I18n.num(c.water)}💧`);
      if (bits.length) push(key, 'health', bits.join(' · '), I18n.t('evCheckin'), null, () => Router.go('health'));
      if (day.closed) push(key, 'day', I18n.t('evDayClosed'), '', day.closedAt ? hhmm(day.closedAt) : null, () => Today.goto(key));
    }
    return out;
  }
  const range = (n) => { const t = Jalali.todayKey(); return Array.from({ length: n }, (_, i) => Jalali.addDays(t, -i)); };
  return { events, range, TYPES, STYLE };
})();

/* ---------------------------------------------------------------------------
   15v. Stats — global analytics engine (trends, moving average, records)
   ------------------------------------------------------------------------- */
const Stats = (() => {
  /** One row per day joining tasks, XP, focus, habits, finance and health. */
  async function collect(days) {
    const set = new Set(days);
    const tasks = await DB.all('tasks'), xp = await DB.all('xpLog'), focus = await DB.all('focus');
    const hrecs = await DB.all('habitRecords'), txs = await DB.all('transactions');
    const base = {};
    days.forEach(k => base[k] = { key: k, done: 0, created: 0, xp: 0, focusSec: 0, habits: 0, income: 0, expense: 0 });
    tasks.forEach(t => {
      if (t.completed && t.completedAt) { const k = Jalali.keyFromDate(new Date(t.completedAt)); if (base[k]) base[k].done++; }
      if (t.date && base[t.date]) base[t.date].created++;
    });
    xp.forEach(r => { if (base[r.date]) base[r.date].xp += (r.amount || 0); });
    focus.forEach(f => { if (base[f.date]) base[f.date].focusSec += (f.seconds || 0); });
    hrecs.forEach(r => { if (r.done && base[r.date]) base[r.date].habits++; });
    txs.forEach(t => { if (!base[t.date]) return;
      if (t.type === 'income') base[t.date].income += t.amount; else if (t.type === 'expense') base[t.date].expense += t.amount; });
    return days.map(k => base[k]);
  }
  /** Trailing moving average over a numeric field. */
  function movingAvg(rows, field, w = 7) {
    return rows.map((_, i) => {
      const from = Math.max(0, i - w + 1), slice = rows.slice(from, i + 1);
      return { label: rows[i].key, value: +(slice.reduce((s, r) => s + r[field], 0) / slice.length).toFixed(2) };
    });
  }
  /** Standout numbers across the whole dataset (not just the visible range). */
  async function records() {
    const tasks = await DB.all('tasks'), txs = await DB.all('transactions'), goals = await DB.all('goals'), habits = await DB.all('habits');
    const done = tasks.filter(t => t.completed && t.completedAt);
    const byWd = {}, byHr = {};
    done.forEach(t => {
      const d = new Date(t.completedAt);
      const wd = Jalali.parseKey(Jalali.keyFromDate(d)).wd;
      byWd[wd] = (byWd[wd] || 0) + 1; byHr[d.getHours()] = (byHr[d.getHours()] || 0) + 1;
    });
    const topKey = (o) => { const e = Object.entries(o); if (!e.length) return null; return e.sort((a, b) => b[1] - a[1])[0]; };
    const wd = topKey(byWd), hr = topKey(byHr);
    let longest = 0, longestName = null;
    const hMaps = await Habits.allRecordsMaps();
    for (const h of habits) { const st = Habits.stats(h, hMaps[h.id] || {}); if (st.best > longest) { longest = st.best; longestName = h.title; } }
    const expenses = txs.filter(t => t.type === 'expense').sort((a, b) => b.amount - a.amount);
    const finishedGoals = goals.filter(g => g.status === 'completed' && g.completedAt && g.createdAt)
      .map(g => ({ g, days: Math.max(1, Math.round((g.completedAt - g.createdAt) / 86400000)) })).sort((a, b) => a.days - b.days);
    return {
      weekday: wd ? { name: Jalali.weekdaysLong[I18n.get()][+wd[0]], count: wd[1] } : null,
      hour: hr ? { h: +hr[0], count: hr[1] } : null,
      streak: longestName ? { name: longestName, n: longest } : null,
      expense: expenses[0] || null,
      fastest: finishedGoals[0] || null,
      totalDone: done.length,
    };
  }
  return { collect, movingAvg, records };
})();

/* ---------------------------------------------------------------------------
   15x. Search — global index across every module (powers Ctrl+K)
   ------------------------------------------------------------------------- */
const Search = (() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  /** Subsequence match — lets "grcy" find "grocery". */
  function fuzzy(text, q) { let i = 0; for (const c of q) { i = text.indexOf(c, i); if (i === -1) return false; i++; } return true; }
  /** Higher is better: exact prefix > word start > substring > fuzzy. */
  function score(text, q) {
    if (!text) return 0;
    const t = text.toLowerCase();
    if (t === q) return 100;
    if (t.startsWith(q)) return 80;
    const idx = t.indexOf(q);
    if (idx === 0) return 70;
    if (idx > 0) return t[idx - 1] === ' ' ? 60 : 45;
    return fuzzy(t, q) ? 20 : 0;
  }
  /** Escaped HTML with the matched run wrapped in <mark>. */
  function hl(text, q) {
    const s = String(text || '');
    const idx = s.toLowerCase().indexOf(q);
    if (idx < 0) return esc(s);
    return esc(s.slice(0, idx)) + '<mark>' + esc(s.slice(idx, idx + q.length)) + '</mark>' + esc(s.slice(idx + q.length));
  }
  /** A short window of `text` centred on the match. */
  function snippet(text, q, len = 90) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    if (!s) return '';
    const idx = s.toLowerCase().indexOf(q);
    if (idx < 0) return s.slice(0, len) + (s.length > len ? '…' : '');
    const from = Math.max(0, idx - 30);
    return (from ? '…' : '') + s.slice(from, from + len) + (from + len < s.length ? '…' : '');
  }

  /** Search every store. Returns palette-ready items sorted by relevance. */
  async function query(q, { perType = 5, types = null } = {}) {
    q = String(q || '').trim().toLowerCase();
    if (q.length < 2) return [];
    const want = (t) => !types || types.includes(t);
    const out = [];
    const add = (type, sc, label, sub, icon, run) => { if (sc > 0) out.push({ group: 'srch_' + type, type, score: sc, label, sub, icon, run }); };

    if (want('task')) (await DB.all('tasks')).forEach(t => {
      const sc = Math.max(score(t.title, q), score(t.description, q) * 0.7, score((t.tags || []).join(' '), q) * 0.6, score(t.notes, q) * 0.5);
      add('task', sc, hl(t.title, q), snippet(t.description || t.notes || '', q), 'check', () => Today.goto(t.date || Jalali.todayKey()));
    });
    if (want('goal')) (await DB.all('goals')).forEach(g => {
      const sc = Math.max(score(g.title, q), score(g.description, q) * 0.7, score(g.vision, q) * 0.6, score(g.why, q) * 0.6);
      add('goal', sc, hl(g.title, q), snippet(g.description || g.vision || '', q), 'goals', () => Router.go('goals', { id: g.id }));
    });
    if (want('habit')) (await DB.all('habits')).forEach(h => {
      const sc = Math.max(score(h.title, q), score(h.description, q) * 0.7, score(h.notes, q) * 0.5);
      add('habit', sc, hl(`${h.icon || ''} ${h.title}`.trim(), q), snippet(h.description || '', q), 'habits', () => Router.go('habits', { id: h.id }));
    });
    if (want('note')) (await DB.all('notes')).forEach(n => {
      const plain = Markdown.plainAny(n.content);
      const sc = Math.max(score(n.title, q), score(plain, q) * 0.75, score((n.tags || []).join(' '), q) * 0.6);
      add('note', sc, hl(n.title || I18n.t('emptyNote'), q), snippet(plain, q), 'notes', () => NotesView.open(n.id));
    });
    if (want('finance')) (await DB.all('transactions')).forEach(t => {
      const sc = Math.max(score(t.description, q), score(t.category, q) * 0.7, score(String(t.amount), q) * 0.5);
      add('finance', sc, hl(t.description || I18n.t('cat_' + t.category), q),
        `${t.type === 'income' ? '+' : '−'} ${Finance.fmt(t.amount)} · ${Jalali.label(t.date)}`, 'finance', () => Router.go('finance'));
    });
    if (want('day')) (await DB.all('days')).forEach(d => {
      const j = d.journal || {}, c = d.checkin || {};
      const text = [c.intention, j.reflection, j.gratitude, j.lessons, j.tomorrow, j.focusNotes].filter(Boolean).join(' · ');
      add('day', score(text, q) * 0.8, Jalali.label(d.date), snippet(text, q), 'today', () => Today.goto(d.date));
    });

    // Keep the best few per type so one noisy store can't crowd out the rest.
    const byType = {};
    out.sort((a, b) => b.score - a.score).forEach(r => { (byType[r.type] = byType[r.type] || []).push(r); });
    return Object.values(byType).flatMap(list => list.slice(0, perType)).sort((a, b) => b.score - a.score);
  }

  const RECENT = 'recentSearches';
  const recent = async () => (await DB.kvGet(RECENT)) || [];
  async function addRecent(q) {
    q = String(q || '').trim(); if (q.length < 2) return;
    const list = (await recent()).filter(x => x !== q); list.unshift(q);
    await DB.kvSet(RECENT, list.slice(0, 8));
  }
  const clearRecent = () => DB.kvSet(RECENT, []);
  return { query, recent, addRecent, clearRecent, hl, snippet, score, fuzzy };
})();

/* ---------------------------------------------------------------------------
   15y. Achievements — unlock engine driven by a live stats snapshot
   ------------------------------------------------------------------------- */
const Achievements = (() => {
  const DEFS = [
    { id: 'first_task',        icon: '🌱', xp: 20,   goal: 1,    val: s => s.tasksDone },
    { id: 'tasks_100',         icon: '💯', xp: 100,  goal: 100,  val: s => s.tasksDone },
    { id: 'tasks_1000',        icon: '🏅', xp: 500,  goal: 1000, val: s => s.tasksDone },
    { id: 'first_goal',        icon: '🎯', xp: 20,   goal: 1,    val: s => s.goalsCreated },
    { id: 'goal_done',         icon: '🏆', xp: 80,   goal: 1,    val: s => s.goalsDone },
    { id: 'first_habit',       icon: '🔁', xp: 20,   goal: 1,    val: s => s.habitsCreated },
    { id: 'streak_7',          icon: '🔥', xp: 50,   goal: 7,    val: s => s.bestStreak },
    { id: 'streak_30',         icon: '⚡', xp: 150,  goal: 30,   val: s => s.bestStreak },
    { id: 'streak_100',        icon: '💎', xp: 400,  goal: 100,  val: s => s.bestStreak },
    { id: 'year_consistency',  icon: '📅', xp: 1000, goal: 365,  val: s => s.bestStreak },
    { id: 'xp_1000',           icon: '⭐', xp: 50,   goal: 1000, val: s => s.totalXp },
    { id: 'xp_10000',          icon: '🌟', xp: 300,  goal: 10000, val: s => s.totalXp },
    { id: 'first_note',        icon: '📝', xp: 20,   goal: 1,    val: s => s.notesCount },
    { id: 'first_budget',      icon: '💰', xp: 30,   goal: 1,    val: s => s.budgetsCount },
    { id: 'first_review',      icon: '🗒️', xp: 40,   goal: 1,    val: s => s.daysClosed },
    { id: 'focus_10',          icon: '🍅', xp: 60,   goal: 10,   val: s => s.focusSessions },
    { id: 'focus_100',         icon: '🧠', xp: 250,  goal: 100,  val: s => s.focusSessions },
  ];
  let busy = false;

  async function snapshot() {
    const [tasks, goals, habits, notes, budgets, days, focus, byHabit] = await Promise.all([
      DB.all('tasks'), DB.all('goals'), DB.all('habits'), DB.all('notes'), DB.all('budgets'), DB.all('days'), DB.all('focus'),
      Habits.allRecordsMaps()]);   // shared + cached, so stats pages load it once
    let bestStreak = 0;
    for (const h of habits) { const st = Habits.stats(h, byHabit[h.id] || {}); if (st.best > bestStreak) bestStreak = st.best; }
    return {
      tasksDone: tasks.filter(t => t.completed).length,
      goalsCreated: goals.length,
      goalsDone: goals.filter(g => g.status === 'completed').length,
      habitsCreated: habits.length,
      bestStreak,
      totalXp: await XP.total(),
      notesCount: notes.length,
      budgetsCount: budgets.filter(b => b.kind !== 'goal').length,
      daysClosed: days.filter(d => d.closed).length,
      focusSessions: focus.length,
    };
  }
  /** Unlock anything newly earned. Re-entrancy guarded — awarding XP fires data:change. */
  async function check({ silent = false } = {}) {
    if (busy) return [];
    busy = true;
    try {
      const s = await snapshot();
      const have = new Set((await DB.all('achievements')).map(a => a.id));
      const newly = [];
      for (const d of DEFS) {
        if (have.has(d.id) || d.val(s) < d.goal) continue;
        await DB.put('achievements', { id: d.id, unlockedAt: Date.now(), xp: d.xp });
        await XP.award(d.xp, 'achievement', d.id);
        newly.push(d);
      }
      if (newly.length) {
        if (!silent) newly.forEach(d => UI.toast('success', `${d.icon} ${I18n.t('ach_' + d.id)}`, I18n.t('achUnlocked')));
        Bus.emit('achievement:unlock', newly);
      }
      return newly;
    } finally { busy = false; }
  }
  /** Unlocked badges only — reads the achievements store and nothing else.
      Used where progress bars aren't shown (e.g. the dashboard), so the page
      never pays for a full stats snapshot. */
  async function unlockedList() {
    const rows = await DB.all('achievements');
    const byId = {}; DEFS.forEach(d => byId[d.id] = d);
    return rows.filter(r => byId[r.id])
      .map(r => ({ ...byId[r.id], unlocked: true, unlockedAt: r.unlockedAt }))
      .sort((a, b) => b.unlockedAt - a.unlockedAt);
  }
  const total = () => DEFS.length;

  /** All definitions merged with unlock state + progress toward the next tier. */
  async function all() {
    const [s, rows] = await Promise.all([snapshot(), DB.all('achievements')]);
    const map = {}; rows.forEach(r => map[r.id] = r);
    return DEFS.map(d => {
      const cur = d.val(s);
      return { ...d, unlocked: !!map[d.id], unlockedAt: map[d.id] ? map[d.id].unlockedAt : null,
        current: cur, pct: Math.min(100, Math.round(cur / d.goal * 100)) };
    });
  }
  /** Reusable grid — used by the stats page and the dashboard. */
  function grid(list, { limit } = {}) {
    const g = el('.ach-grid');
    (limit ? list.slice(0, limit) : list).forEach(a => g.appendChild(el('.ach-item' + (a.unlocked ? '.on' : '.off'), { title: I18n.t('achd_' + a.id) }, [
      el('.ach-badge', { text: a.icon }),
      el('.ach-name', { text: I18n.t('ach_' + a.id) }),
      el('.ach-desc', { text: I18n.t('achd_' + a.id) }),
      a.unlocked
        ? el('.ach-date', { text: Jalali.label(Jalali.keyFromDate(new Date(a.unlockedAt))) })
        : el('.ach-desc', { text: `${I18n.num(a.current)} / ${I18n.num(a.goal)}` }),
      el('.ach-xp', { text: `+${I18n.num(a.xp)} XP` }),
    ])));
    return g;
  }
  async function card() {
    const list = await all();
    const earned = list.filter(a => a.unlocked).length;
    return el('.card.pad.col.gap-4', {}, [
      el('.row.between.wrap.gap-2', {}, [
        el('.h4', { text: I18n.t('achievements') }),
        el('.chip', {}, [el('span', { html: icon('trophy') }), el('span', { text: `${I18n.num(earned)}/${I18n.num(list.length)}` })]),
      ]),
      grid(list.slice().sort((a, b) => (b.unlocked ? 1 : 0) - (a.unlocked ? 1 : 0) || b.pct - a.pct)),
    ]);
  }
  return { DEFS, snapshot, check, all, unlockedList, total, grid, card };
})();

/* ---------------------------------------------------------------------------
   15z. Reviews — auto-generated daily / weekly / monthly retrospectives
   ------------------------------------------------------------------------- */
const Reviews = (() => {
  const KINDS = ['daily', 'weekly', 'monthly'];
  /** Day keys covered by a period. */
  function daysOf(kind, key) {
    if (kind === 'daily') return [key];
    if (kind === 'weekly') return Array.from({ length: 7 }, (_, i) => Jalali.addDays(key, i));
    const [jy, jm] = key.split('-').map(Number);
    return Array.from({ length: Jalali.monthLen(jy, jm) }, (_, i) => Jalali.key({ jy, jm, jd: i + 1 }));
  }
  /** Canonical period key for a given day. */
  function periodKey(kind, dayKey) {
    if (kind === 'daily') return dayKey;
    if (kind === 'weekly') return Habits.weekStartKey(dayKey);
    return dayKey.slice(0, 7);
  }
  function shift(kind, key, dir) {
    if (kind === 'daily') return Jalali.addDays(key, dir);
    if (kind === 'weekly') return Jalali.addDays(key, dir * 7);
    let [jy, jm] = key.split('-').map(Number);
    jm += dir; if (jm > 12) { jm = 1; jy++; } if (jm < 1) { jm = 12; jy--; }
    return `${jy}-${String(jm).padStart(2, '0')}`;
  }
  function label(kind, key) {
    if (kind === 'daily') return Jalali.label(key);
    if (kind === 'weekly') return `${I18n.t('weekOf')} ${Jalali.label(key)}`;
    const [jy, jm] = key.split('-').map(Number);
    return `${Jalali.months[I18n.get()][jm - 1]} ${I18n.num(jy)}`;
  }

  /** Everything measurable about a period, computed fresh from the stores. */
  async function compute(kind, key) {
    const days = daysOf(kind, key), set = new Set(days);
    const [tasks, xp, focus, hrecs, habits, txs, goals] = await Promise.all([
      DB.all('tasks'), DB.all('xpLog'), DB.all('focus'), DB.all('habitRecords'), DB.all('habits'), DB.all('transactions'), DB.all('goals')]);

    const inPeriod = tasks.filter(t => t.date && set.has(t.date));
    const done = inPeriod.filter(t => t.completed);
    const missed = inPeriod.filter(t => !t.completed);
    const xpSum = xp.filter(r => set.has(r.date)).reduce((s, r) => s + (r.amount || 0), 0);
    const focusSec = focus.filter(f => set.has(f.date)).reduce((s, f) => s + (f.seconds || 0), 0);
    const focusCount = focus.filter(f => set.has(f.date)).length;

    // Per-day completion → most productive day
    const perDay = days.map(d => {
      const dt = inPeriod.filter(t => t.date === d);
      return { key: d, total: dt.length, done: dt.filter(t => t.completed).length };
    });
    const best = perDay.slice().sort((a, b) => b.done - a.done)[0];

    // Habit consistency within the period
    const habitRows = [];
    for (const h of habits.filter(h => h.status !== 'archived')) {
      const recs = hrecs.filter(r => r.habitId === h.id && set.has(r.date));
      const doneN = recs.filter(r => r.done).length;
      habitRows.push({ habit: h, done: doneN, total: days.length, pct: Math.round(doneN / days.length * 100) });
    }

    // Health averages
    const health = { sleep: [], mood: [], energy: [] };
    for (const d of days) {
      const rec = await DB.get('days', d); const c = (rec && rec.checkin) || {};
      const sh = Health.sleepHours(c); if (sh) health.sleep.push(sh);
      if (c.mood) health.mood.push(Health.MOOD_VAL[c.mood]);
      if (c.energy) health.energy.push(c.energy);
    }
    const avg = (a) => a.length ? +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1) : null;

    const periodTx = txs.filter(t => set.has(t.date));
    const income = periodTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = periodTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

    const goalsDone = goals.filter(g => g.status === 'completed' && g.completedAt && set.has(Jalali.keyFromDate(new Date(g.completedAt))));
    const activeGoals = goals.filter(g => g.status === 'active');
    // Goals.progress is synchronous and needs the full goal + task lists to
    // roll up sub-goals; we already loaded both above.
    const goalProgress = activeGoals.slice(0, 6).map(g => ({ goal: g, pct: Goals.progress(g, goals, tasks) }));

    return {
      days, doneList: done, missedList: missed,
      total: inPeriod.length, doneCount: done.length,
      completion: inPeriod.length ? Math.round(done.length / inPeriod.length * 100) : 0,
      xp: xpSum, focusHours: +(focusSec / 3600).toFixed(1), focusCount,
      bestDay: best && best.done ? best : null,
      habitRows, goalProgress, goalsDone,
      health: { sleep: avg(health.sleep), mood: avg(health.mood), energy: avg(health.energy) },
      finance: { income, expense, net: income - expense },
      hasData: inPeriod.length > 0 || xpSum > 0 || periodTx.length > 0 || focusCount > 0,
    };
  }

  const id = (kind, key) => `${kind}:${key}`;
  /** Stored user reflections for a period (auto stats are always recomputed). */
  async function saved(kind, key) {
    return (await DB.get('reviews', id(kind, key)))
      || { id: id(kind, key), kind, date: key, wins: '', improvements: '', distraction: '', notes: '' };
  }
  const save = (rec) => DB.put('reviews', rec);
  return { KINDS, daysOf, periodKey, shift, label, compute, saved, save, id };
})();

/* ---------------------------------------------------------------------------
   15ab. Notify — reminder engine + in-app notification centre
   ------------------------------------------------------------------------- */
const Notify = (() => {
  const STYLE = {
    task:     { ic: 'check',   color: 'var(--blue)' },
    habit:    { ic: 'habits',  color: 'var(--teal)' },
    goal:     { ic: 'goals',   color: 'var(--brand)' },
    budget:   { ic: 'finance', color: 'var(--red)' },
    review:   { ic: 'review',  color: 'var(--orange)' },
    pomodoro: { ic: 'timer',   color: 'var(--pink)' },
  };
  let timer = null;

  const all = () => DB.all('events');
  const unread = async () => (await all()).filter(e => !e.read);
  /** Stable key prevents the same reminder being queued twice. */
  const push = async (type, title, body, dedupe, refId = null) => {
    const rows = await all();
    if (dedupe && rows.some(e => e.dedupe === dedupe)) return null;
    const rec = { type, title, body, dedupe, refId, at: Date.now(), date: Jalali.todayKey(), read: false };
    await DB.put('events', rec);
    Bus.emit('notify:new', rec);
    surface(rec);
    return rec;
  };
  /** Show it now: in-app toast plus a browser notification when permitted. */
  function surface(rec) {
    UI.toast('info', rec.body || '', rec.title);
    if (Prefs.get('browserNotif') && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      try { new Notification(rec.title, { body: rec.body || '', tag: rec.dedupe || rec.id }); } catch {}
    }
  }
  async function requestPermission() {
    if (typeof Notification === 'undefined') return 'unsupported';
    if (Notification.permission === 'granted') return 'granted';
    if (Notification.permission === 'denied') return 'denied';
    try { return await Notification.requestPermission(); } catch { return 'denied'; }
  }
  const markAllRead = async () => { for (const e of await unread()) { e.read = true; await DB.put('events', e); } Bus.emit('notify:new', null); };
  const clearAll = async () => { for (const e of await all()) await DB.hardDelete('events', e.id); Bus.emit('notify:new', null); };

  /** Scan the data for anything that should fire now. Runs on a slow interval. */
  async function scan() {
    const todayK = Jalali.todayKey();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();

    // Tasks due within the next 30 minutes (or already past due today)
    for (const t of await Tasks.forDate(todayK)) {
      if (t.completed || !t.dueTime) continue;
      const [h, m] = String(t.dueTime).split(':').map(Number);
      if (Number.isNaN(h)) continue;
      const diff = (h * 60 + m) - nowMin;
      if (diff <= 30 && diff >= -120) await push('task', t.title, `${I18n.t('dueSoon')} · ${I18n.num(t.dueTime)}`, `task:${t.id}:${todayK}`, t.id);
    }
    // Habits with a reminder time that has arrived and aren't done yet
    for (const hb of (await DB.all('habits')).filter(x => x.status !== 'archived' && x.reminderAt)) {
      const [h, m] = String(hb.reminderAt).split(':').map(Number);
      if (Number.isNaN(h)) continue;
      if (nowMin < h * 60 + m) continue;
      const map = await Habits.recordsMap(hb.id);
      if (Habits.isComplete(hb, map[todayK]) || (map[todayK] && map[todayK].skipped)) continue;
      await push('habit', `${hb.icon || ''} ${hb.title}`.trim(), I18n.t('nt_habit'), `habit:${hb.id}:${todayK}`, hb.id);
    }
    // Goal deadlines inside 3 days
    for (const g of (await DB.all('goals')).filter(x => x.status === 'active' && x.deadline)) {
      // diffDays(a, b) === a − b, so the deadline must come first to get
      // "days remaining" as a positive number.
      const left = Jalali.diffDays(g.deadline, todayK);
      if (left >= 0 && left <= 3) await push('goal', g.title, `${I18n.t('deadlineWarn')} · ${I18n.num(left)} ${I18n.t('daysUnit')}`, `goal:${g.id}:${todayK}`, g.id);
    }
    // Budgets exceeded this month
    const monthPrefix = todayK.slice(0, 7);
    const txs = (await DB.all('transactions')).filter(t => t.type === 'expense' && t.date.startsWith(monthPrefix));
    for (const b of (await DB.all('budgets')).filter(x => x.kind !== 'goal' && x.amount > 0)) {
      const spent = txs.filter(t => t.category === b.category).reduce((s, t) => s + t.amount, 0);
      if (spent > b.amount) await push('budget', I18n.t('cat_' + b.category), `${I18n.t('budgetWarn')} · ${Finance.fmt(spent)} / ${Finance.fmt(b.amount)}`, `budget:${b.id}:${monthPrefix}`, b.id);
    }
    // End-of-day nudge to review, once the day isn't closed yet
    if (nowMin >= 21 * 60) {
      const day = await DB.get('days', todayK);
      if (!day || !day.closed) await push('review', I18n.t('nt_review'), I18n.t('reviewReminder'), `review:${todayK}`);
    }
  }
  function start() {
    if (timer) clearInterval(timer);
    scan().catch(() => {});
    timer = setInterval(() => scan().catch(() => {}), 60 * 1000);
    Bus.on('focus:session', () => push('pomodoro', I18n.t('nt_pomodoro'), I18n.t('sessionDone'), null));
  }
  const rel = (ts) => {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return I18n.t('justNow');
    if (s < 3600) return `${I18n.num(Math.floor(s / 60))} ${I18n.t('minsAgo')}`;
    if (s < 86400) return `${I18n.num(Math.floor(s / 3600))} ${I18n.t('hoursAgo')}`;
    return `${I18n.num(Math.floor(s / 86400))} ${I18n.t('daysAgo')}`;
  };
  return { all, unread, push, scan, start, markAllRead, clearAll, requestPermission, STYLE, rel };
})();

/* ---------------------------------------------------------------------------
   15ac. Lock — PIN gate with PBKDF2-hashed credential + auto-lock
   ------------------------------------------------------------------------- */
const Lock = (() => {
  const KEY = 'lock', ITER = 150000, MAX_TRIES = 5, PENALTY_MS = 30000;
  let cfg = null, locked = false, idleTimer = null, tries = 0, penaltyUntil = 0, entered = '';

  const buf2b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
  const b642buf = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const available = () => !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);

  /** Derive a PBKDF2 hash. Never stores or returns the raw PIN. */
  async function derive(pin, saltB64) {
    const salt = saltB64 ? b642buf(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, km, 256);
    return { salt: buf2b64(salt), hash: buf2b64(bits) };
  }
  async function load() { cfg = (await DB.kvGet(KEY)) || { enabled: false, autoLockMin: 0, lockOnStart: true }; return cfg; }
  const config = () => cfg || { enabled: false, autoLockMin: 0, lockOnStart: true };
  const save = async (next) => { cfg = { ...config(), ...next }; await DB.kvSet(KEY, cfg); return cfg; };

  async function setPin(pin) {
    if (!available()) throw new Error('crypto unavailable');
    if (!/^\d{4,}$/.test(pin)) throw new Error('short');
    const { salt, hash } = await derive(pin);
    // len enables iPhone-style auto-unlock (only the LENGTH is stored, never the PIN)
    await save({ enabled: true, salt, hash, iterations: ITER, len: pin.length });
    return true;
  }
  async function verify(pin) {
    const c = config();
    if (!c.enabled || !c.salt) return true;
    const { hash } = await derive(pin, c.salt);
    return hash === c.hash;
  }
  async function removePin(currentPin) {
    if (!(await verify(currentPin))) return false;
    await save({ enabled: false, salt: null, hash: null });
    return true;
  }

  /** Security question — a forgot-PIN recovery path that does NOT wipe data.
      The answer is normalized (trim + lowercase) before hashing so casing/
      whitespace differences at recall-time don't fail a correct answer. */
  const normAnswer = (s) => (s || '').trim().toLowerCase();
  async function setSecurityQuestion(question, answer) {
    if (!question || !normAnswer(answer)) throw new Error('incomplete');
    const { salt, hash } = await derive(normAnswer(answer));
    await save({ sq: question, sqSalt: salt, sqHash: hash });
    return true;
  }
  const hasSecurityQuestion = () => !!(config().sq && config().sqHash);
  const securityQuestion = () => config().sq || '';
  async function verifyAnswer(answer) {
    const c = config();
    if (!c.sqHash || !c.sqSalt) return false;
    const { hash } = await derive(normAnswer(answer), c.sqSalt);
    return hash === c.sqHash;
  }
  /** Recovery unlock: correct security answer sets a NEW pin directly —
      no wipe, no need to know the old (forgotten) PIN. */
  async function recoverWithAnswer(answer, newPin) {
    if (!(await verifyAnswer(answer))) return false;
    await setPin(newPin);
    return true;
  }

  const isLocked = () => locked;
  function lock() {
    if (!config().enabled) return;
    locked = true; entered = '';
    document.getElementById('app')?.setAttribute('aria-hidden', 'true');
    renderScreen();
    $('#lockScreen').classList.add('on');
  }
  function unlock() {
    locked = false; tries = 0; entered = '';
    $('#lockScreen').classList.remove('on');
    $('#lockScreen').innerHTML = '';
    document.getElementById('app')?.setAttribute('aria-hidden', 'false');
    resetIdle();
  }

  /** Forgot-PIN panel inside the lock screen. Security-answer path sets a new
      PIN in place (no data loss); wipe is offered only when no question was
      ever configured — it's the last resort, not the default. */
  function renderForgot(container) {
    container.innerHTML = '';
    const c = config();
    if (c.sqHash) {
      const ansIn = el('input.input', { placeholder: I18n.t('securityAnswer') });
      const err2 = el('.err.small');
      const check = async () => {
        if (await verifyAnswer(ansIn.value)) newPinStep(container, ansIn.value);
        else err2.textContent = I18n.t('sqWrong');
      };
      ansIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
      container.append(
        el('.dim.small', { style: { textAlign: 'center' }, text: I18n.t('sqRecoverDesc') }),
        el('.field', {}, [el('.label', { text: I18n.t(c.sq) }), ansIn]),
        err2,
        el('button.btn.sm.primary', { text: I18n.t('sqCheck'), onclick: check }),
      );
    } else {
      let armed = false;
      const wipeBtn = el('button.btn.sm.danger', { text: I18n.t('forgotWipe'), onclick: async () => {
        if (!armed) { armed = true; wipeBtn.textContent = I18n.t('forgotWipeConfirm'); return; }
        for (const s of Object.keys(DB.STORES)) await DB.clearStore(s);
        try { localStorage.clear(); } catch {}
        location.reload();
      } });
      container.append(el('.dim.small', { style: { textAlign: 'center' }, text: I18n.t('forgotPinDesc') }), wipeBtn);
    }
  }
  function newPinStep(container, verifiedAnswer) {
    container.innerHTML = '';
    const p1 = el('input.input', { type: 'password', inputmode: 'numeric', dir: 'ltr', placeholder: I18n.t('pinLabel') });
    const p2 = el('input.input', { type: 'password', inputmode: 'numeric', dir: 'ltr', placeholder: I18n.t('confirmPin') });
    const err3 = el('.err.small');
    const submitNew = async () => {
      if (!/^\d{4,}$/.test(p1.value)) { err3.textContent = I18n.t('pinTooShort'); return; }
      if (p1.value !== p2.value) { err3.textContent = I18n.t('pinMismatch'); return; }
      const ok = await recoverWithAnswer(verifiedAnswer, p1.value);
      if (!ok) { err3.textContent = I18n.t('sqWrong'); return; }
      UI.toast('success', I18n.t('pinSet'));
      unlock();
    };
    p2.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitNew(); });
    container.append(
      el('.dim.small', { style: { textAlign: 'center' }, text: I18n.t('sqCorrect') }),
      el('.field', {}, [el('.label', { text: I18n.t('pinLabel') }), p1]),
      el('.field', {}, [el('.label', { text: I18n.t('confirmPin') }), p2]),
      err3,
      el('button.btn.sm.primary', { text: I18n.t('save'), onclick: submitNew }),
    );
  }

  function renderScreen() {
    const root = $('#lockScreen'); if (!root) return;
    root.innerHTML = '';
    // Numbers stay LTR even on an RTL page (same convention as the keypad,
    // money inputs, health numeric fields) — first digit fills the LEFT dot.
    // Only the dots themselves flip to ltr; box keeps rtl so Persian labels
    // (title, hints, forgot-PIN text) still read correctly.
    const box = el('.lock-box');
    const dots = el('.lock-dots', { dir: 'ltr' });
    const err = el('.lock-err');
    const pinLen = config().len || 0;
    const paint = () => {
      dots.innerHTML = '';
      const n = Math.max(pinLen || 4, entered.length);
      for (let i = 0; i < n; i++) dots.appendChild(el('.lock-dot' + (i < entered.length ? '.on' : '')));
    };
    const fail = (msg) => { err.textContent = msg; box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 420); entered = ''; paint(); };
    let busy = false;
    async function submit() {
      if (busy) return; busy = true;
      try {
        if (Date.now() < penaltyUntil) { fail(`${I18n.t('tooManyAttempts')}`); return; }
        const attempt = entered;
        if (await verify(attempt)) {
          // legacy configs (pre-`len`) learn the length on first success → auto-unlock next time
          if (!config().len) await save({ len: attempt.length });
          unlock();
        } else {
          tries++;
          if (tries >= MAX_TRIES) { penaltyUntil = Date.now() + PENALTY_MS; tries = 0; startPenaltyTick(err); fail(I18n.t('tooManyAttempts')); }
          else fail(I18n.t('wrongPin'));
        }
      } finally { busy = false; }
    }
    // iPhone-style: reaching the PIN length submits by itself — no OK button.
    const press = (d) => {
      if (busy || entered.length >= 12) return;
      entered += d; paint(); err.textContent = '';
      if (pinLen && entered.length >= pinLen) setTimeout(submit, 130);
    };
    const pad = el('.keypad', { dir: 'ltr' });
    ['1','2','3','4','5','6','7','8','9'].forEach(d => pad.appendChild(el('button', { text: d, onclick: () => press(d) })));
    if (pinLen) {
      pad.appendChild(el('span'));
      pad.appendChild(el('button', { text: '0', onclick: () => press('0') }));
      pad.appendChild(el('button.fn', { html: icon('backspace'), 'aria-label': 'backspace', onclick: () => { entered = entered.slice(0, -1); paint(); } }));
    } else {
      pad.appendChild(el('button.fn', { html: icon('backspace'), 'aria-label': 'backspace', onclick: () => { entered = entered.slice(0, -1); paint(); } }));
      pad.appendChild(el('button', { text: '0', onclick: () => press('0') }));
      pad.appendChild(el('button.fn', { html: icon('check'), 'aria-label': 'OK', onclick: submit }));
    }

    // Forgot PIN: an in-screen panel (a modal would sit UNDER the lock overlay).
    // Security-question recovery does NOT wipe data; wipe is only the fallback
    // when no question was ever set up.
    const forgot = el('.lock-forgot.hidden');
    renderForgot(forgot);

    box.append(
      el('.lock-mark', { html: icon('lock') }),
      el('.col', { style: { alignItems: 'center', gap: '4px' } }, [
        el('.h3', { text: I18n.t('unlockTitle') }), el('.dim.small', { text: I18n.t('unlockSub') }),
      ]),
      dots, err, pad,
      el('button.btn.sm.ghost', { text: I18n.t('forgotPin'), onclick: () => { forgot.classList.toggle('hidden'); renderForgot(forgot); } }),
      forgot,
    );
    paint();
    root.appendChild(box);
    // Physical keyboard works too.
    root.onkeydown = (e) => {
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') { entered = entered.slice(0, -1); paint(); }
      else if (e.key === 'Enter') submit();
    };
    root.tabIndex = -1; setTimeout(() => root.focus(), 50);
  }
  function startPenaltyTick(err) {
    const tick = () => {
      const left = Math.ceil((penaltyUntil - Date.now()) / 1000);
      if (left <= 0) { err.textContent = ''; return; }
      err.textContent = `${left} ${I18n.t('tryAgainIn')}`;
      setTimeout(tick, 1000);
    };
    tick();
  }

  /** Inactivity watchdog — reset by any real user interaction. */
  function resetIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    const mins = config().autoLockMin || 0;
    if (!config().enabled || !mins) return;
    idleTimer = setTimeout(() => { if (!locked) lock(); }, mins * 60 * 1000);
  }
  function watch() {
    ['mousedown', 'keydown', 'touchstart', 'wheel'].forEach(evt =>
      document.addEventListener(evt, () => { if (!locked) resetIdle(); }, { passive: true }));
    resetIdle();
  }
  async function init() {
    await load();
    watch();
    if (config().enabled && config().lockOnStart !== false) lock();
  }
  return { init, load, config, save, setPin, verify, removePin, lock, unlock, isLocked, available, resetIdle,
    setSecurityQuestion, hasSecurityQuestion, securityQuestion, verifyAnswer, recoverWithAnswer };
})();

/* ---------------------------------------------------------------------------
   15ad. Recovery — corruption scan, auto-repair, backup validation
   ------------------------------------------------------------------------- */
const Recovery = (() => {
  /** Issues we can resolve without inventing data. Anything else needs the
      user's judgement — silently rewriting a corrupt date would fabricate history. */
  const FIXABLE = new Set(['iss_missingMeta', 'iss_orphanTask', 'iss_orphanHabitRec', 'iss_orphanNote']);

  /** Walk every store looking for structurally broken or orphaned records. */
  async function diagnose() {
    const issues = [];
    const bump = (code, store, id) => {
      let e = issues.find(x => x.code === code);
      if (!e) { e = { code, count: 0, samples: [], fixable: FIXABLE.has(code) }; issues.push(e); }
      e.count++; if (e.samples.length < 5) e.samples.push({ store, id });
    };
    const stores = Object.keys(DB.STORES);
    let scanned = 0;
    const data = {};
    for (const s of stores) { data[s] = await DB.all(s, { includeDeleted: true }); scanned += data[s].length; }

    const goalIds = new Set(data.goals.map(g => g.id));
    const habitIds = new Set(data.habits.map(h => h.id));
    const folderIds = new Set(data.folders.map(f => f.id));

    for (const s of stores) {
      const keyField = DB.STORES[s].key;
      for (const r of data[s]) {
        if (!r || typeof r !== 'object' || r[keyField] == null) { bump('iss_missingId', s, '?'); continue; }
        if (s !== 'kv' && (!r.createdAt || !r.updatedAt || r.version == null)) bump('iss_missingMeta', s, r[keyField]);
      }
    }
    data.tasks.forEach(t => { if (t.goalId && !goalIds.has(t.goalId)) bump('iss_orphanTask', 'tasks', t.id); });
    data.habitRecords.forEach(r => { if (!habitIds.has(r.habitId)) bump('iss_orphanHabitRec', 'habitRecords', r.id); });
    data.notes.forEach(n => { if (n.folderId && !folderIds.has(n.folderId)) bump('iss_orphanNote', 'notes', n.id); });
    [...data.tasks, ...data.transactions, ...data.habitRecords].forEach(r => {
      if (r.date && !/^\d{3,4}-\d{2}-\d{2}$/.test(r.date)) bump('iss_badDate', 'record', r.id);
    });
    data.transactions.forEach(t => { if (typeof t.amount !== 'number' || !isFinite(t.amount) || t.amount < 0) bump('iss_badAmount', 'transactions', t.id); });

    return { issues, scanned, stores: stores.length, healthy: issues.length === 0,
      fixable: issues.filter(i => i.fixable), manual: issues.filter(i => !i.fixable) };
  }

  /** Explicitly discard records the scan flagged as unusable. Destructive, so
      it is never part of auto-repair — the caller must ask the user first. */
  async function discardBroken() {
    let removed = 0;
    const badDate = (d) => d && !/^\d{3,4}-\d{2}-\d{2}$/.test(d);
    for (const s of ['tasks', 'transactions', 'habitRecords']) {
      for (const r of await DB.all(s, { includeDeleted: true })) {
        const bad = badDate(r.date) || (s === 'transactions' && (typeof r.amount !== 'number' || !isFinite(r.amount) || r.amount < 0));
        if (bad) { await DB.hardDelete(s, r.id); removed++; }
      }
    }
    return { removed };
  }

  /** Fix what can be fixed safely: restore metadata, unlink dead references. */
  async function repair() {
    let fixed = 0;
    const goals = new Set((await DB.all('goals', { includeDeleted: true })).map(g => g.id));
    const habits = new Set((await DB.all('habits', { includeDeleted: true })).map(h => h.id));
    const folders = new Set((await DB.all('folders', { includeDeleted: true })).map(f => f.id));

    for (const s of Object.keys(DB.STORES)) {
      if (s === 'kv') continue;
      for (const r of await DB.all(s, { includeDeleted: true })) {
        let dirty = false;
        if (!r.createdAt) { r.createdAt = Date.now(); dirty = true; }
        if (!r.updatedAt) { r.updatedAt = r.createdAt; dirty = true; }
        if (r.version == null) { r.version = 1; dirty = true; }
        if (r.deletedAt === undefined) { r.deletedAt = null; dirty = true; }
        if (!r.syncStatus) { r.syncStatus = 'local'; dirty = true; }
        if (s === 'tasks' && r.goalId && !goals.has(r.goalId)) { r.goalId = null; dirty = true; }
        if (s === 'notes' && r.folderId && !folders.has(r.folderId)) { r.folderId = null; dirty = true; }
        if (dirty) { await DB.put(s, r); fixed++; }
      }
    }
    // Records whose parent habit is gone have no meaning — drop them.
    for (const r of await DB.all('habitRecords', { includeDeleted: true })) {
      if (!habits.has(r.habitId)) { await DB.hardDelete('habitRecords', r.id); fixed++; }
    }
    return { fixed };
  }

  /** Deep-check an exported payload before letting it overwrite live data. */
  function validateBackup(payload) {
    const problems = [];
    if (!payload || typeof payload !== 'object') return { ok: false, problems: ['not an object'], counts: {} };
    if (payload.app !== 'lifeos') problems.push('app marker missing');
    if (!payload.data || typeof payload.data !== 'object') problems.push('data section missing');
    const counts = {};
    if (payload.data) {
      for (const s of Object.keys(DB.STORES)) {
        const rows = payload.data[s];
        if (rows == null) continue;
        if (!Array.isArray(rows)) { problems.push(`${s}: not an array`); continue; }
        counts[s] = rows.length;
        const keyField = DB.STORES[s].key;
        const bad = rows.filter(r => !r || typeof r !== 'object' || r[keyField] == null).length;
        if (bad) problems.push(`${s}: ${bad} malformed`);
      }
    }
    if (payload.schema != null && payload.schema > DB.VERSION) problems.push(`schema ${payload.schema} is newer than this app (${DB.VERSION})`);
    return { ok: problems.length === 0, problems, counts, total: Object.values(counts).reduce((a, b) => a + b, 0) };
  }
  return { diagnose, repair, discardBroken, validateBackup, FIXABLE };
})();

/* ---------------------------------------------------------------------------
   15ae. Insights — deterministic local intelligence (no network, always on)
   Every recommendation here is derived from the user's own stored data, so the
   assistant stays useful with AI switched off entirely.
   ------------------------------------------------------------------------- */
const Insights = (() => {
  const P_WEIGHT = { urgent: 4, high: 3, medium: 2, low: 1, none: 0 };

  /** Rank open tasks by urgency, priority, goal linkage and effort. */
  async function rankTasks() {
    const todayK = Jalali.todayKey();
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    const goals = await DB.all('goals');
    const activeGoalIds = new Set(goals.filter(g => g.status === 'active').map(g => g.id));
    const open = (await DB.all('tasks')).filter(t => !t.completed && t.date && t.date <= todayK);

    return open.map(t => {
      let score = 0; const why = [];
      const overdueBy = Jalali.diffDays(todayK, t.date);
      if (overdueBy > 0) { score += 3 + Math.min(overdueBy, 5); why.push('because_overdue'); }
      const pw = P_WEIGHT[t.priority] || 0;
      if (pw >= 3) { why.push('because_priority'); }
      score += pw;
      if (t.dueTime) {
        const [h, m] = String(t.dueTime).split(':').map(Number);
        if (!Number.isNaN(h)) { const diff = (h * 60 + m) - nowMin;
          if (diff >= -60 && diff <= 120) { score += 2; why.push('because_dueSoon'); } }
      }
      if (t.goalId && activeGoalIds.has(t.goalId)) { score += 1.5; why.push('because_goal'); }
      if (t.estimateMin > 0 && t.estimateMin <= 15) { score += 0.5; why.push('because_quick'); }
      return { task: t, score, why, overdueBy };
    }).sort((a, b) => b.score - a.score);
  }

  /** Everything past its date and still open. */
  async function overdue() {
    const todayK = Jalali.todayKey();
    return (await DB.all('tasks'))
      .filter(t => !t.completed && t.date && t.date < todayK)
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  /** Compare today's committed minutes against what the user actually finishes. */
  async function workload() {
    const todayK = Jalali.todayKey();
    const tasks = await DB.all('tasks');
    const todayOpen = tasks.filter(t => t.date === todayK && !t.completed);
    const committed = todayOpen.reduce((s, t) => s + (t.estimateMin || 0), 0);

    // Historical throughput: minutes actually worked per active day, last 30 days.
    const since = Jalali.addDays(todayK, -30);
    const byDay = {};
    tasks.filter(t => t.completed && t.date && t.date >= since && t.date < todayK)
      .forEach(t => { byDay[t.date] = (byDay[t.date] || 0) + ((t.actualSec ? t.actualSec / 60 : t.estimateMin) || 0); });
    const daily = Object.values(byDay).filter(v => v > 0).sort((a, b) => a - b);
    const typical = daily.length ? Math.round(daily[Math.floor(daily.length / 2)]) : 0; // median
    return {
      committed, typical, count: todayOpen.length,
      over: typical > 0 && committed > typical * 1.5,
      ratio: typical > 0 ? +(committed / typical).toFixed(2) : null,
    };
  }

  /** Week-over-week completion rate, with correlated explanations when it drops. */
  async function trend() {
    const todayK = Jalali.todayKey();
    const win = (from, to) => { const a = []; for (let k = from; k <= to; k = Jalali.addDays(k, 1)) a.push(k); return a; };
    const thisWeek = win(Jalali.addDays(todayK, -6), todayK);
    const lastWeek = win(Jalali.addDays(todayK, -13), Jalali.addDays(todayK, -7));
    const tasks = await DB.all('tasks');
    const rate = (keys) => {
      const set = new Set(keys);
      const inSet = tasks.filter(t => t.date && set.has(t.date));
      return inSet.length ? Math.round(inSet.filter(t => t.completed).length / inSet.length * 100) : null;
    };
    const now = rate(thisWeek), prev = rate(lastWeek);
    const delta = (now != null && prev != null) ? now - prev : null;

    const causes = [];
    if (delta != null && delta <= -10) {
      const avg = async (keys, pick) => {
        const vals = [];
        for (const k of keys) { const d = await DB.get('days', k); const v = d && d.checkin ? pick(d.checkin) : null; if (v) vals.push(v); }
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      const sleepNow = await avg(thisWeek, c => Health.sleepHours(c)), sleepPrev = await avg(lastWeek, c => Health.sleepHours(c));
      if (sleepNow != null && sleepPrev != null && sleepNow < sleepPrev - 0.5) causes.push({ code: 'cause_sleep', from: +sleepPrev.toFixed(1), to: +sleepNow.toFixed(1) });
      const moodNow = await avg(thisWeek, c => Health.MOOD_VAL[c.mood]), moodPrev = await avg(lastWeek, c => Health.MOOD_VAL[c.mood]);
      if (moodNow != null && moodPrev != null && moodNow < moodPrev - 0.4) causes.push({ code: 'cause_mood', from: +moodPrev.toFixed(1), to: +moodNow.toFixed(1) });
      const load = (keys) => { const set = new Set(keys); return tasks.filter(t => t.date && set.has(t.date)).length; };
      if (load(thisWeek) > load(lastWeek) * 1.3) causes.push({ code: 'cause_overload', from: load(lastWeek), to: load(thisWeek) });
      const focus = await DB.all('focus');
      const fmin = (keys) => { const set = new Set(keys); return Math.round(focus.filter(f => set.has(f.date)).reduce((s, f) => s + (f.seconds || 0), 0) / 60); };
      if (fmin(lastWeek) > 0 && fmin(thisWeek) < fmin(lastWeek) * 0.7) causes.push({ code: 'cause_focus', from: fmin(lastWeek), to: fmin(thisWeek) });
    }
    return { now, prev, delta, direction: delta == null ? 'flat' : delta >= 5 ? 'up' : delta <= -5 ? 'down' : 'flat', causes };
  }

  /** Deadline outlook per active goal, with a blunt likelihood estimate. */
  async function goalOutlook() {
    const goals = await DB.all('goals'), tasks = await DB.all('tasks');
    return goals.filter(g => g.status === 'active' && g.deadline).map(g => {
      const pct = Goals.progress(g, goals, tasks);
      const f = Goals.forecast(g, pct);
      if (!f) return null;
      // Likelihood from the pace achieved so far. Early in a goal's life there
      // is genuinely nothing to extrapolate from, so report "unknown" rather
      // than inventing a confident number.
      const elapsedPct = f.expected || 0;
      const likelihood = elapsedPct < 10
        ? null
        : clamp(Math.round((pct / elapsedPct) * 100), 5, 95);
      return { goal: g, pct, expected: f.expected, remaining: f.remaining, behind: f.behind, likelihood };
    }).filter(Boolean).sort((a, b) => a.likelihood - b.likelihood);
  }

  /** Active goals that no habit currently supports. */
  async function habitIdeas() {
    const goals = await DB.all('goals'), habits = await DB.all('habits');
    const active = goals.filter(g => g.status === 'active');
    if (!active.length || !habits.length) return active.slice(0, 3).map(g => ({ goal: g }));
    const words = habits.filter(h => h.status !== 'archived').map(h => (h.title || '').toLowerCase());
    return active.filter(g => {
      const t = (g.title || '').toLowerCase();
      return !words.some(w => w && (t.includes(w) || w.includes(t.split(' ')[0])));
    }).slice(0, 3).map(g => ({ goal: g }));
  }

  /** Lay today's open tasks into time blocks, inserting a break every 90 min. */
  async function schedule() {
    const ranked = (await rankTasks()).filter(r => r.task.date === Jalali.todayKey() && r.task.estimateMin > 0);
    if (!ranked.length) return [];
    const now = new Date();
    let cursor = now.getHours() * 60 + now.getMinutes();
    const blocks = []; let sinceBreak = 0;
    for (const r of ranked) {
      if (cursor >= 23 * 60) break;
      if (sinceBreak >= 90) { blocks.push({ type: 'break', start: cursor, minutes: 10 }); cursor += 10; sinceBreak = 0; }
      blocks.push({ type: 'task', task: r.task, start: cursor, minutes: r.task.estimateMin });
      cursor += r.task.estimateMin; sinceBreak += r.task.estimateMin;
    }
    return blocks;
  }
  const fmtMin = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

  return { rankTasks, overdue, workload, trend, goalOutlook, habitIdeas, schedule, fmtMin };
})();

/* ---------------------------------------------------------------------------
   15af. AI — optional, pluggable provider adapter.
   Nothing is ever sent without an explicit, per-request confirmation, and the
   whole app works with this switched off.
   ------------------------------------------------------------------------- */
const AI = (() => {
  const KEY = 'ai';
  const PROVIDERS = {
    'openai-compatible': { label: 'OpenAI-compatible', baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini', needsKey: true },
    'ollama':            { label: 'Ollama (local)',    baseUrl: 'http://localhost:11434/v1', model: 'llama3', needsKey: false },
  };
  let cfg = null;
  async function load() { cfg = (await DB.kvGet(KEY)) || { enabled: false, provider: 'openai-compatible', baseUrl: PROVIDERS['openai-compatible'].baseUrl, model: PROVIDERS['openai-compatible'].model, apiKey: '' }; return cfg; }
  const config = () => cfg || { enabled: false };
  const save = async (next) => { cfg = { ...config(), ...next }; await DB.kvSet(KEY, cfg); return cfg; };
  const available = () => !!(config().enabled && config().baseUrl && config().model);

  /** Build the exact context object that would be transmitted. Scope-controlled
      so the user decides how much leaves the device. */
  async function buildContext(scope = {}) {
    const ctx = {};
    const todayK = Jalali.todayKey();
    if (scope.tasks) {
      ctx.today = (await Tasks.forDate(todayK)).map(t => ({ title: t.title, done: !!t.completed, priority: t.priority, estimateMin: t.estimateMin || 0, dueTime: t.dueTime || null }));
      ctx.overdue = (await Insights.overdue()).slice(0, 10).map(t => ({ title: t.title, date: t.date }));
    }
    if (scope.goals) ctx.goals = (await DB.all('goals')).filter(g => g.status === 'active')
      .slice(0, 12).map(g => ({ title: g.title, deadline: g.deadline || null }));
    if (scope.habits) {
      const hs = (await DB.all('habits')).filter(h => h.status !== 'archived').slice(0, 12);
      ctx.habits = [];
      for (const h of hs) { const st = Habits.stats(h, await Habits.recordsMap(h.id)); ctx.habits.push({ title: h.title, streak: st.streak, rate: st.rate }); }
    }
    if (scope.health) {
      const d = await DB.get('days', todayK); const c = (d && d.checkin) || {};
      ctx.health = { sleepHours: Health.sleepHours(c) || null, mood: c.mood || null, energy: c.energy || null };
    }
    if (scope.finance) {
      const [jy, jm] = todayK.split('-').map(Number);
      const t = await Finance.totals(Finance.monthKeys(jy, jm));
      ctx.finance = { income: t.income, expense: t.expense, net: t.net };
    }
    return ctx;
  }

  /** Real network call to the user-configured endpoint. Throws on failure —
      never fabricates an answer. */
  async function ask(question, context) {
    if (!available()) throw new Error('AI not configured');
    const c = config();
    const system = 'You are a concise personal productivity assistant inside an offline-first life planner. '
      + 'Answer in the user\'s language. Use only the provided context; if information is missing, say so plainly rather than guessing.';
    const body = {
      model: c.model,
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: (context && Object.keys(context).length ? `Context:\n${JSON.stringify(context, null, 1)}\n\n` : '') + question },
      ],
      temperature: 0.4,
    };
    const headers = { 'Content-Type': 'application/json' };
    if (c.apiKey) headers.Authorization = `Bearer ${c.apiKey}`;
    const res = await fetch(`${c.baseUrl.replace(/\/$/, '')}/chat/completions`, { method: 'POST', headers, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const json = await res.json();
    const text = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
    if (!text) throw new Error('empty response');
    return text.trim();
  }
  async function test() {
    if (!available()) throw new Error('AI not configured');
    return ask('Reply with the single word: ok', null);
  }
  return { load, config, save, available, buildContext, ask, test, PROVIDERS };
})();
