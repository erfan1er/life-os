/* ---------------------------------------------------------------------------
   16b. One-off migration: routines -> habits
   ------------------------------------------------------------------------- */
/* Recurring work used to exist twice: as a Habit (streaks, heatmap, skip,
   freeze, its own records store) and as a Task with kind:'routine' (per-day
   booleans on day.routineState, date:null, so Stats/Reviews/History never saw
   it). Habits win; this moves the routines across once and gets out of the way.

   Safety: an automatic backup first, soft deletes only, day.routineState left
   untouched, and a kv flag so it can never run twice. */
const MIGRATION_KEY = 'migration.routines2habits';

async function migrateRoutinesToHabits() {
  if (await DB.kvGet(MIGRATION_KEY)) return;
  const routines = (await DB.all('tasks')).filter(t => t.kind === 'routine');
  if (!routines.length) { await DB.kvSet(MIGRATION_KEY, { at: Date.now(), moved: 0 }); return; }

  await DB.backup('preMigration');

  const records = [];
  const days = await DB.all('days');
  for (const r of routines) {
    const rep = r.repeat || {};
    const weeklyDays = rep.type === 'weekly' && (rep.days || []).length ? rep.days : null;
    const habit = Habits.make({
      title: r.title, description: r.description || '', notes: r.notes || '',
      color: r.color || '#7C5CFC', icon: '🎯',
      type: weeklyDays ? 'custom' : rep.type === 'monthly' ? 'monthly' : 'daily',
      targetDays: weeklyDays || [0, 1, 2, 3, 4, 5, 6],
      target: 1, unit: '',
    });
    // Habits.units() walks forward from createdKey — get this wrong and every
    // migrated streak silently reads as zero.
    habit.createdKey = r.createdAt ? Jalali.keyFromDate(new Date(r.createdAt)) : Jalali.todayKey();
    habit.migratedFromTaskId = r.id;
    await DB.put('habits', habit);

    for (const d of days) {
      const st = (d.routineState || {})[r.id];
      if (st && st.done) records.push({ habitId: habit.id, date: d.date, done: true, value: 1, skipped: false });
    }
    await DB.softDelete('tasks', r.id);
  }
  // Written directly, never through Habits.toggle — that awards XP, and these
  // completions were already credited to xpLog when they happened.
  if (records.length) await DB.bulkPut('habitRecords', records);

  await DB.kvSet(MIGRATION_KEY, { at: Date.now(), moved: routines.length, records: records.length });
  UI.toast('info', I18n.t('routinesMigrated').replace('{n}', I18n.num(routines.length)));
}

/* ---------------------------------------------------------------------------
   17. Bootstrap
   ------------------------------------------------------------------------- */
async function boot() {
  I18n.apply();
  Theme.apply();
  if (!Prefs.get('animations')) { document.documentElement.style.setProperty('--dur-1', '0ms');
    document.documentElement.style.setProperty('--dur-2', '0ms'); document.documentElement.style.setProperty('--dur-3', '0ms'); }
  try {
    await DB.open();
    await DB.repair();
    await migrateRoutinesToHabits();
  } catch (e) {
    console.error('DB init failed', e);
    UI.toast('error', 'Database unavailable — running in memory only.');
  }
  registerRoutes();
  Layout.build();
  Router.init();
  Shortcuts.init();
  PWA.init();

  // iOS Safari ignores user-scalable=no, so pinch has to be refused directly.
  // (Harmless elsewhere — no other engine fires these gesture events.)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));

  // Live systems
  window.addEventListener('online', () => { Layout.refreshNet(); UI.toast('success', I18n.t('online')); });
  window.addEventListener('offline', () => Layout.refreshNet());
  Bus.on('lang:change', () => { Layout.build(); Router.render(); });
  // Dashboard reflects data created elsewhere; Today/Settings self-manage their own refresh.
  Bus.on('data:change', debounce(() => { if (Router.current() === 'dashboard') Router.render(); }, 600));

  // Achievements re-evaluate after data settles. Awarding XP itself fires
  // data:change, so the engine guards against re-entrancy internally.
  Bus.on('data:change', debounce(() => { Achievements.check().catch(() => {}); }, 1800));
  Achievements.check({ silent: true }).catch(() => {});

  // App lock must be armed before anything else becomes reachable.
  await Lock.init();
  await AI.load();   // config only — no network call is ever made at startup.

  // Reminder engine: scans every minute while the app is open.
  Notify.start();
  Bus.on('notify:new', () => Layout.refreshBadge());

  // Periodic auto-backup (every 10 min while open) — non-blocking.
  setInterval(() => { DB.backup('auto').catch(() => {}); }, 10 * 60 * 1000);

  // Reveal
  await sleep(220);
  $('#splash').classList.add('hide');
  setTimeout(() => $('#splash')?.remove(), 400);
  Bus.emit('app:ready');
}

document.addEventListener('DOMContentLoaded', boot);

/* Public surface (dev console / future modules) */
return { Bus, Prefs, I18n, Jalali, Theme, DB, UI, Router, Layout, Command, Views, Dashboard, Settings, PWA,
  XP, Tasks, TaskUI, Today, Week, Month, Goals, GoalsView, Roadmap, Habits, HabitsView, Markdown, Notes, NotesView, Charts, Finance, FinanceView,
  Focus, FocusView, Health, HealthView, History, HistoryView, Stats, StatsView, Search, Achievements,
  Reviews, ReviewsView, Notify, Lock, Recovery, Insights, AI, AssistantView,
  el, $, $$, icon, uid, debounce, version: '1.0.0-phase12' };
})();

window.App = App;
</script>
</body>
