    focusSec += weekly.reduce((a, t) => a + (t.actualSec || 0), 0);
    const pct = total ? Math.round(done / total * 100) : 0;
    const xpSum = Object.values(xpByDay).reduce((a, b) => a + b, 0);
    const activeDays = dayKeys.filter(dk => tasksByDay[dk].some(t => t.completed)).length;
    const moods = dayKeys.map(dk => dayRecs[dk] && dayRecs[dk].checkin && dayRecs[dk].checkin.mood).filter(Boolean).map(m => MOOD_VAL[m]);
    const moodAvg = moods.length ? moods.reduce((a, b) => a + b, 0) / moods.length : 0;
    const sleeps = dayKeys.map(dk => dayRecs[dk] && dayRecs[dk].checkin && dayRecs[dk].checkin.sleepQuality).filter(Boolean);
    const sleepAvg = sleeps.length ? sleeps.reduce((a, b) => a + b, 0) / sleeps.length : 0;
    const tiles = [
      { cap: I18n.t('completion'), num: I18n.num(pct) + '%', ic: 'check', color: 'var(--green)' },
      { cap: I18n.t('xpEarnedStat'), num: I18n.num(xpSum), ic: 'bolt', color: 'var(--orange)' },
      { cap: I18n.t('activeDays'), num: I18n.num(activeDays), ic: 'today', color: 'var(--blue)' },
      { cap: I18n.t('focusHours'), num: I18n.num((focusSec / 3600).toFixed(1)), ic: 'clock', color: 'var(--brand)' },
      { cap: I18n.t('moodAverage'), num: moodAvg ? I18n.num(moodAvg.toFixed(1)) : '—', ic: 'health', color: 'var(--pink)' },
      { cap: I18n.t('sleepAverage'), num: sleepAvg ? I18n.num(sleepAvg.toFixed(1)) : '—', ic: 'moon', color: 'var(--teal)' },
    ];
    const g = el('.grid.g-3');
    tiles.forEach(t => g.appendChild(el('.card.pad.stat', {}, [ el('.row.between', {}, [
      el('.col', {}, [ el('.cap', { text: t.cap }), el('.num', { text: t.num }) ]),
      el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) }),
    ]) ])));
    return el('.card.pad.col.gap-4', {}, [ el('.h4', { text: I18n.t('monthStats') }), g ]);
  }
  return { render, goto: (jy, jm) => { cur = { jy, jm }; Router.go('month'); } };
})();

/* ---------------------------------------------------------------------------
   15h. Goals — hierarchical goal engine (unlimited nesting, progress rollup)
   ------------------------------------------------------------------------- */
const Goals = (() => {
  const STATUSES = ['active', 'completed', 'paused', 'archived'];
  const EMOJIS = ['🎯','🚀','💪','📚','💰','💼','🧠','❤️','🌱','🏆','✈️','🎨','🏃','🧘','🎸','🏠','⭐','🔥'];
  const TEMPLATES = [
    { icon: '💪', category: 'health', title: { fa: 'سلامتی و تناسب اندام', en: 'Health & Fitness' }, subs: { fa: ['ورزش منظم', 'تغذیهٔ سالم', 'خواب کافی'], en: ['Exercise regularly', 'Eat healthy', 'Sleep enough'] } },
    { icon: '📚', category: 'study', title: { fa: 'یادگیری مهارت جدید', en: 'Learn a new skill' }, subs: { fa: ['انتخاب منبع', 'تمرین روزانه', 'پروژهٔ عملی'], en: ['Pick resources', 'Practice daily', 'Build a project'] } },
    { icon: '💰', category: 'finance', title: { fa: 'ثبات مالی', en: 'Financial stability' }, subs: { fa: ['بودجهٔ ماهانه', 'صندوق اضطراری', 'کاهش هزینه'], en: ['Monthly budget', 'Emergency fund', 'Cut expenses'] } },
    { icon: '🚀', category: 'work', title: { fa: 'پروژهٔ شخصی', en: 'Personal project' }, subs: { fa: ['برنامه‌ریزی', 'نسخهٔ اولیه', 'انتشار'], en: ['Plan it', 'Build MVP', 'Launch'] } },
  ];
  function make(over = {}) {
    return {
      title: '', description: '', vision: '', why: '',
      parentId: null, kind: 'goal', category: '', priority: 'medium', color: null, icon: '🎯',
      deadline: null, reminderAt: null, reward: '',
      progressMode: 'auto', progress: 0,
      status: 'active', completedAt: null,
      links: [], dependencies: [], notes: '', activity: [],
      ...over,
    };
  }
  async function create(data) { const g = make(data); g.activity = [{ at: Date.now(), type: 'goalCreated' }]; return DB.put('goals', g); }
  const update = (g) => DB.put('goals', g);
  function addActivity(g, type, text = '') { g.activity = g.activity || []; g.activity.unshift({ at: Date.now(), type, text }); if (g.activity.length > 60) g.activity.length = 60; }
  const children = (id, all) => all.filter(g => g.parentId === id).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const roots = (all) => all.filter(g => !g.parentId);
  function descendants(id, all, acc = []) { children(id, all).forEach(c => { acc.push(c); descendants(c.id, all, acc); }); return acc; }

  /** Roll-up progress. Pass a shared `memo` object when computing many goals in
      one render. The memo caches results AND — more importantly — holds
      by-parent / by-goal indexes: without them every goal linearly scans the
      whole goal and task arrays, which is 2,000 × (2,000 + 10,000) ≈ 24M
      operations at PRD scale. */
  function progress(goal, all, tasks, memo) {
    if (memo) {
      if (memo[goal.id] != null) return memo[goal.id];
      if (memo._busy && memo._busy.has(goal.id)) return 0;          // cycle guard
      if (!memo._kids) {
        memo._kids = new Map(); memo._tasks = new Map();
        for (const g of all) { const k = g.parentId || ''; if (!memo._kids.has(k)) memo._kids.set(k, []); memo._kids.get(k).push(g); }
        for (const t of tasks) { if (!t.goalId) continue; if (!memo._tasks.has(t.goalId)) memo._tasks.set(t.goalId, []); memo._tasks.get(t.goalId).push(t); }
      }
      (memo._busy || (memo._busy = new Set())).add(goal.id);
    }
    const done = (v) => { if (memo) { memo[goal.id] = v; memo._busy.delete(goal.id); } return v; };
    if (goal.status === 'completed') return done(100);
    if (goal.progressMode === 'manual') return done(goal.progress || 0);
    const kids = (memo ? (memo._kids.get(goal.id) || []) : children(goal.id, all)).filter(g => g.status !== 'archived');
    const gtasks = memo ? (memo._tasks.get(goal.id) || []) : tasks.filter(t => t.goalId === goal.id);
    const parts = [];
    kids.forEach(k => parts.push(progress(k, all, tasks, memo)));
    gtasks.forEach(t => parts.push(t.completed ? 100 : 0));
    if (!parts.length) return done(0);
    return done(Math.round(parts.reduce((a, b) => a + b, 0) / parts.length));
  }
  const remainingDays = (goal) => goal.deadline ? Jalali.diffDays(goal.deadline, Jalali.todayKey()) : null;
  function forecast(goal, pct) {
    if (!goal.deadline) return null;
    const start = Jalali.keyFromDate(new Date(goal.createdAt || Date.now()));
    const total = Jalali.diffDays(goal.deadline, start);
    const elapsed = Jalali.diffDays(Jalali.todayKey(), start);
    if (total <= 0) return { expected: 100, behind: pct < 100, remaining: remainingDays(goal) };
    const expected = clamp(Math.round(elapsed / total * 100), 0, 100);
    return { expected, behind: pct < expected - 5, remaining: remainingDays(goal) };
  }
  async function complete(g) { g.status = 'completed'; g.completedAt = Date.now(); addActivity(g, 'statusChanged', 'completed'); await update(g); await XP.award(50, 'goal', g.id); Bus.emit('goal:complete', g); }
  async function setStatus(g, status) { g.status = status; if (status !== 'completed') g.completedAt = null; addActivity(g, 'statusChanged', status); await update(g); }
  async function removeCascade(g, all) { for (const d of descendants(g.id, all)) await DB.softDelete('goals', d.id); await DB.softDelete('goals', g.id); }
  return { make, create, update, addActivity, children, roots, descendants, progress, remainingDays, forecast, complete, setStatus, removeCascade, STATUSES, EMOJIS, TEMPLATES };
})();

/* ---------------------------------------------------------------------------
   15i. GoalsView — goals page (list/tree + detail), editor, templates
   ------------------------------------------------------------------------- */
const GoalsView = (() => {
  let filter = 'active', expanded = new Set(), inited = false;
  const refresh = () => Router.render();
  const catColor = { work: 'var(--blue)', personal: 'var(--brand)', study: 'var(--teal)', health: 'var(--green)', finance: 'var(--orange)', other: 'var(--pink)' };
  const goalColor = (g) => g.color || catColor[g.category] || 'var(--brand)';

  async function render(params) {
    if (params && params.id) return detail(params.id);
    return list();
  }

  async function list() {
    const all = await DB.all('goals');
    const tasks = await DB.all('tasks');
    if (!inited) { Goals.roots(all).forEach(g => expanded.add(g.id)); inited = true; }
    const wrap = el('.col.gap-6');
    // header + how-it-works hint
    wrap.appendChild(Views.pageHeader(I18n.t('nav_goals'), I18n.t('goalsPageHint'), [
      el('button.btn.outline', { html: icon('roadmap') + '<span>' + I18n.t('nav_roadmap') + '</span>', onclick: () => Router.go('roadmap') }),
      el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('addGoal') + '</span>', onclick: () => openEditor(null, refresh) }),
    ]));
    // summary tiles: active count · average progress · nearest deadline · completed
    if (all.length) {
      const sMemo = {};
      const active = all.filter(g => g.status === 'active');
      const activeRoots = active.filter(g => !g.parentId);
      const avgSrc = activeRoots.length ? activeRoots : active;
      const avg = avgSrc.length ? Math.round(avgSrc.reduce((s, g) => s + Goals.progress(g, all, tasks, sMemo), 0) / avgSrc.length) : 0;
      let nearest = null;
      active.filter(g => g.deadline).forEach(g => { const rem = Goals.remainingDays(g); if (!nearest || rem < nearest.rem) nearest = { g, rem }; });
      const tiles = [
        { cap: I18n.t('activeGoals'), num: I18n.num(active.length), ic: 'goals', color: 'var(--brand)' },
        { cap: I18n.t('avgProgress'), num: I18n.num(avg) + '%', ic: 'stats', color: 'var(--green)' },
        { cap: I18n.t('nearestDeadline'), num: nearest ? (nearest.rem < 0 ? I18n.t('overdueGoal') : `${I18n.num(nearest.rem)} ${I18n.t('streakDays')}`) : '—',
          sub: nearest ? nearest.g.title : I18n.t('noDeadline'), ic: 'clock', color: nearest && nearest.rem < 3 ? 'var(--red)' : 'var(--orange)' },
        { cap: I18n.t('gs_completed'), num: I18n.num(all.filter(g => g.status === 'completed').length), ic: 'trophy', color: 'var(--blue)' },
      ];
      const tg = el('.grid.g-4');
      tiles.forEach(t => tg.appendChild(el('.card.pad.stat', {}, [el('.row.between', {}, [
        el('.col', { style: { minWidth: 0 } }, [el('.cap', { text: t.cap }), el('.num', { text: t.num }), t.sub ? el('.sub.dim.xs', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, text: t.sub }) : null]),
        el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) })])])));
      wrap.appendChild(tg);
    }
    // controls — one clear status filter; cards below carry the hierarchy
    const statusSeg = el('.seg');
    [['active', 'gs_active'], ['all', 'allStatus'], ['completed', 'gs_completed'], ['archived', 'gs_archived']].forEach(([v, k]) =>
      statusSeg.appendChild(el('button' + (filter === v ? '.on' : ''), { text: I18n.t(k), onclick: () => { filter = v; refresh(); } })));
    wrap.appendChild(el('.row', {}, [statusSeg]));

  function sparkline(tasks, color) {
    const done = tasks.filter(t => t.completed && t.completedAt).sort((a, b) => a.completedAt - b.completedAt);
    if (done.length < 2) return null;
    const w = 320, h = 56, pad = 4;
    const t0 = done[0].completedAt, t1 = done[done.length - 1].completedAt, span = Math.max(1, t1 - t0);
    const pts = [[pad, h - pad]];
    done.forEach((t, i) => { pts.push([pad + (t.completedAt - t0) / span * (w - 2 * pad), h - pad - (i + 1) / done.length * (h - 2 * pad)]); });
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = d + ` L ${w - pad} ${h - pad} Z`;
    return el('div', { html: `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${area}" fill="${color}" opacity="0.14"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>` });
  }
  function relTime(ts) {
    const diff = Date.now() - ts, day = 86400000;
    if (diff < 3600000) return I18n.get() === 'fa' ? 'چند دقیقه پیش' : 'moments ago';
    if (diff < day) return I18n.num(Math.floor(diff / 3600000)) + (I18n.get() === 'fa' ? ' ساعت پیش' : 'h ago');
    return Jalali.label(Jalali.keyFromDate(new Date(ts)));
  }

    if (v === 'save') {
      if (!g.title.trim()) { UI.toast('error', I18n.t('title') + '؟'); return; }
      if (isNew) await Goals.create(g); else { Goals.addActivity(g, 'progressUpdated'); await Goals.update(g); }
      UI.toast('success', I18n.t('saved')); onSaved && onSaved();
    } else if (v === 'delete') {
      const all2 = await DB.all('goals');
      if (await UI.confirm({ title: I18n.t('deleteGoalQ'), danger: true, confirmLabel: I18n.t('delete') })) { await Goals.removeCascade(existing, all2); onSaved && onSaved(); }
    }
  }
  return { render, openEditor, goalColor };
})();

/* ---------------------------------------------------------------------------
   15j. Roadmap — visual goal tree (auto-layout, SVG connectors, zoom)
   ------------------------------------------------------------------------- */
const Roadmap = (() => {
  // NODE_W mirrors .rm-node's CSS width — keep the two in sync.
  const NODE_W = 168, NODE_H = 54, H_GAP = 48, V_GAP = 14;
  let expanded = new Set(), inited = false, scale = 1, colorMode = 'status';
  let panX = 24, panY = 24, applyView = null;   // free pan/zoom state, survives re-renders
  const catColor = { work: '#3B82F6', personal: '#7C5CFC', study: '#14B8A6', health: '#22C55E', finance: '#F59E0B', other: '#EC4899' };
  const stColor = { active: '#7C5CFC', completed: '#22C55E', paused: '#83879A', archived: '#767B8E' };
  function nodeColor(g) { if (colorMode === 'category') return catColor[g.category] || '#7C5CFC'; if (colorMode === 'color') return g.color || '#7C5CFC'; return stColor[g.status] || '#7C5CFC'; }

  async function render() {
    const all = (await DB.all('goals')).filter(g => g.status !== 'archived');
    const tasks = await DB.all('tasks');
    if (!all.length) return el('.col.gap-6', {}, [Views.pageHeader(I18n.t('nav_roadmap'), I18n.t('roadmapHint')),
      el('.card.pad', {}, [Views.emptyState('roadmap', I18n.t('noGoals'), I18n.t('noGoalsRoadmap'),
        el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('addGoal') + '</span>', onclick: () => GoalsView.openEditor(null, () => Router.render()) }))])]);
    if (!inited) { all.forEach(g => expanded.add(g.id)); inited = true; }

    const wrap = el('.col.gap-4');
    // toolbar
    const colorSel = el('select.select', { style: { maxWidth: '150px' }, onchange: (e) => { colorMode = e.target.value; Router.render(); } },
      [['status', 'byStatus'], ['category', 'byCategory'], ['color', 'byColorGroup']].map(([v, k]) => el('option', { value: v, text: I18n.t(k), selected: colorMode === v })));
    wrap.appendChild(el('.row.between.wrap.gap-4', {}, [
      el('.col', {}, [el('.h1', { text: I18n.t('nav_roadmap') }), el('.muted.small', { text: I18n.t('roadmapHint') })]),
      el('.roadmap-toolbar', {}, [
        colorSel,
        el('button.btn.icon.outline', { html: icon('zoomOut'), 'aria-label': 'zoom out', onclick: () => zoom(-0.15) }),
        el('button.btn.icon.outline', { html: icon('zoomIn'), 'aria-label': 'zoom in', onclick: () => zoom(0.15) }),
        el('button.btn.sm.ghost', { text: I18n.t('resetView'), onclick: resetView }),
        el('button.btn.sm.ghost', { text: I18n.t('expandAll'), onclick: () => { all.forEach(g => expanded.add(g.id)); Router.render(); } }),
        el('button.btn.sm.ghost', { text: I18n.t('collapseAll'), onclick: () => { expanded.clear(); Router.render(); } }),
      ]),
    ]));

    // layout (tidy tree, left→right)
    const nodes = []; let yCur = 20;
    function layout(g, depth) {
      const kids = expanded.has(g.id) ? Goals.children(g.id, all) : [];
      g._depth = depth; g._x = 20 + depth * (NODE_W + H_GAP);
      if (!kids.length) { g._y = yCur; yCur += NODE_H + V_GAP; }
      else { kids.forEach(k => layout(k, depth + 1)); g._y = (kids[0]._y + kids[kids.length - 1]._y) / 2; }
      nodes.push(g);
    }
    Goals.roots(all).forEach(r => layout(r, 0));
    const maxX = Math.max(...nodes.map(n => n._x)) + NODE_W + 40;
    const maxY = Math.max(yCur, ...nodes.map(n => n._y + NODE_H)) + 20;

    const canvas = el('.rm-canvas', { style: { width: maxX + 'px', height: maxY + 'px' } });
    // connectors
    let paths = '';
    nodes.forEach(g => { if (!expanded.has(g.id)) return; Goals.children(g.id, all).forEach(k => {
      const x1 = g._x + NODE_W, y1 = g._y + NODE_H / 2, x2 = k._x, y2 = k._y + NODE_H / 2, mx = (x1 + x2) / 2;
      paths += `<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="var(--border-strong)" stroke-width="2"/>`;
    }); });
    canvas.appendChild(el('div', { html: `<svg class="rm-svg" width="${maxX}" height="${maxY}">${paths}</svg>` }));
    // nodes
    const rmMemo = {};
    nodes.forEach(g => {
      const kids = Goals.children(g.id, all);
      const pct = Goals.progress(g, all, tasks, rmMemo);
      const col = nodeColor(g);
      const node = el('.rm-node' + (g.status === 'completed' ? '.is-completed' : '') + (kids.length && !expanded.has(g.id) ? '.is-collapsed' : ''),
        { style: { left: g._x + 'px', top: g._y + 'px', borderInlineStartColor: col, borderInlineStartWidth: '4px' }, onclick: () => Router.go('goals', { id: g.id }) }, [
          el('.row.gap-2', {}, [el('span', { text: g.icon || '🎯' }), el('.rm-title', { text: g.title })]),
          el('.rm-meta', {}, [el('.bar.rm-bar', {}, [el('span', { style: { width: pct + '%', background: col } })]), el('.xs.dim', { text: I18n.num(pct) + '%' })]),
        ]);
      if (kids.length) node.appendChild(el('.rm-badge', { style: { background: col }, title: 'toggle',
        text: expanded.has(g.id) ? '−' : I18n.num(kids.length),
        onclick: (e) => { e.stopPropagation(); if (expanded.has(g.id)) expanded.delete(g.id); else expanded.add(g.id); Router.render(); } }));
      canvas.appendChild(node);
    });

    // Always LTR so the tree reads left→right in Persian too.
    // Pan is TRANSFORM-based (translate), not scroll-based: scrolling only moves
    // when content overflows, so with few goals the old version felt "stuck".
    const rWrap = el('.roadmap-wrap', { dir: 'ltr' }, [canvas]);
    applyView = () => { canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; };
    applyView();
    let drag = null;
    rWrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.rm-node')) return;
      drag = { x: e.clientX, y: e.clientY, px: panX, py: panY };
      rWrap.classList.add('grabbing');
      try { rWrap.setPointerCapture(e.pointerId); } catch {}
    });
    rWrap.addEventListener('pointermove', (e) => { if (!drag) return;
      panX = drag.px + (e.clientX - drag.x);
      panY = drag.py + (e.clientY - drag.y);
      applyView(); });
    const endDrag = () => { drag = null; rWrap.classList.remove('grabbing'); };
    rWrap.addEventListener('pointerup', endDrag);
    rWrap.addEventListener('pointercancel', endDrag);
    rWrap.addEventListener('wheel', (e) => { e.preventDefault();
      if (e.ctrlKey) zoom(e.deltaY > 0 ? -0.12 : 0.12);
      else { panX -= e.deltaX; panY -= e.deltaY; applyView(); } }, { passive: false });
    wrap.appendChild(rWrap);
    wrap.appendChild(el('.hint', { text: I18n.t('roadmapDragHint') }));
    return wrap;
  }
  function zoom(delta) { scale = clamp(+(scale + delta).toFixed(2), 0.4, 1.8); if (applyView) applyView(); }
  function resetView() { panX = 24; panY = 24; scale = 1; if (applyView) applyView(); }
  return { render };
})();

/* ---------------------------------------------------------------------------
   15k. Habits — streak engine (daily/weekly/monthly/custom, skip, freeze)
   ------------------------------------------------------------------------- */
const Habits = (() => {
  const TYPES = ['daily', 'weekly', 'monthly', 'custom'];
  const EMOJIS = ['💧','🏃','📖','🧘','💪','🥗','😴','✍️','🎯','🚭','🌅','🧠','☕','🙏','🎸','💊','📵','🦷'];
  const TEMPLATES = [
    { icon: '💧', type: 'daily', target: 8, color: '#3B82F6', title: { fa: 'نوشیدن آب', en: 'Drink water' }, unit: { fa: 'لیوان', en: 'glasses' } },
    { icon: '🏃', type: 'daily', target: 1, color: '#22C55E', title: { fa: 'ورزش', en: 'Exercise' } },
    { icon: '📖', type: 'daily', target: 1, color: '#7C5CFC', title: { fa: 'مطالعه', en: 'Read' } },
    { icon: '🧘', type: 'daily', target: 1, color: '#14B8A6', title: { fa: 'مدیتیشن', en: 'Meditate' } },
    { icon: '😴', type: 'daily', target: 1, color: '#EC4899', title: { fa: 'خواب زودهنگام', en: 'Sleep early' } },
  ];
  const weekStartKey = (k) => { const pref = Prefs.get('weekStart') || 0; const wd = Jalali.parseKey(k).wd; return Jalali.addDays(k, -((wd - pref + 7) % 7)); };
  function make(over = {}) {
    return { title: '', description: '', notes: '', icon: '🎯', color: '#7C5CFC',
      type: 'daily', target: 1, targetDays: [0, 1, 2, 3, 4, 5, 6], unit: '',
      reminderAt: null, status: 'active', freezeTokens: 0, createdKey: Jalali.todayKey(), ...over };
  }
  const create = (data) => DB.put('habits', make(data));
  const update = (h) => DB.put('habits', h);
  async function recordsMap(habitId) { const rows = await DB.byIndex('habitRecords', 'habitId', habitId); const m = {}; rows.forEach(r => m[r.date] = r); return m; }
  /** All habits' records in ONE query, grouped by habit id. Use this instead of
      calling recordsMap in a loop — at 100k records the per-habit form costs
      ~2.4× more because each call re-opens a transaction and re-scans an index.
      Result is briefly cached because a single page render (stats, achievements,
      habit list) can ask for it several times; any write invalidates it. */
  let _mapsCache = null, _mapsTimer = null;
  async function allRecordsMaps() {
    if (_mapsCache) return _mapsCache;
    const by = {};
    for (const r of await DB.all('habitRecords')) (by[r.habitId] || (by[r.habitId] = {}))[r.date] = r;
    _mapsCache = by;
    clearTimeout(_mapsTimer);
    _mapsTimer = setTimeout(() => { _mapsCache = null; }, 2000);
    return by;
  }
  Bus.on('data:change', ({ store }) => { if (store === 'habitRecords' || store === '*') _mapsCache = null; });

  const isScheduled = (h, key) => (h.type === 'custom') ? (h.targetDays || []).includes(Jalali.parseKey(key).wd) : true;
  const isComplete = (h, r) => !!r && (r.done || (h.target > 1 && (r.value || 0) >= h.target));
  const periodKey = (h, key) => h.type === 'monthly' ? key.slice(0, 7) : weekStartKey(key);
  function nextPeriod(h, p) { if (h.type === 'monthly') { let [y, m] = p.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${String(m).padStart(2, '0')}`; } return Jalali.addDays(p, 7); }

  function units(h, map) {
    const today = Jalali.todayKey();
    const start = h.createdKey || Object.keys(map).sort()[0] || today;
    const res = []; let guard = 0;
    if (h.type === 'daily' || h.type === 'custom') {
      if (start > today) return res;
      let k = start;
      while (k <= today && guard++ < 4000) { if (isScheduled(h, k)) { const r = map[k]; res.push({ met: isComplete(h, r), skip: !!(r && r.skipped) }); } k = Jalali.addDays(k, 1); }
    } else {
      const target = h.target || 1, counts = {};
      Object.keys(map).forEach(k => { const r = map[k]; if (r && r.done) { const p = periodKey(h, k); counts[p] = (counts[p] || 0) + 1; } });
      let p = periodKey(h, start); const pend = periodKey(h, today);
      while (guard++ < 800) { res.push({ met: (counts[p] || 0) >= target, skip: false }); if (p === pend || p > pend) break; p = nextPeriod(h, p); }
    }
    return res;
  }
  function stats(h, map) {
    const arr = units(h, map);
    const work = arr.slice();
    if (work.length && !work[work.length - 1].met && !work[work.length - 1].skip) work.pop();
    let cs = 0; for (let i = work.length - 1; i >= 0; i--) { if (work[i].met) cs++; else if (work[i].skip) continue; else break; }
    let best = 0, run = 0; arr.forEach(x => { if (x.met) { run++; if (run > best) best = run; } else if (!x.skip) run = 0; });
    const total = arr.length, metCount = arr.filter(x => x.met).length;
    return { streak: cs, best, rate: total ? Math.round(metCount / total * 100) : 0, total, metCount };
  }
  const blank = (h, key) => ({ habitId: h.id, date: key, done: false, value: 0, skipped: false });
  /** XP per completion: 10 base + 1 per full week of current streak (cap +10).
      Rewards consistency — same "auto, never manual" rule as task XP. */
  function xpFor(h, map) { const s = stats(h, map).streak; return 10 + Math.min(10, Math.floor(s / 7)); }
  async function toggle(h, key, map, atEl) { const r = map[key] || blank(h, key); r.skipped = false; r.done = !r.done; r.value = r.done ? (h.target || 1) : 0; await DB.put('habitRecords', r); map[key] = r; if (r.done) { await XP.award(xpFor(h, map), 'habit', h.id, atEl); Bus.emit('habit:complete', { habit: h, date: key }); } return r; }
  async function increment(h, key, map, delta, atEl) { const r = map[key] || blank(h, key); r.skipped = false; const was = isComplete(h, r); r.value = clamp((r.value || 0) + delta, 0, 99999); r.done = r.value >= (h.target || 1); await DB.put('habitRecords', r); map[key] = r; if (!was && r.done) { await XP.award(xpFor(h, map), 'habit', h.id, atEl); Bus.emit('habit:complete', { habit: h, date: key }); } return r; }
  async function skip(h, key, map) { const r = map[key] || blank(h, key); r.skipped = !r.skipped; if (r.skipped) { r.done = false; r.value = 0; } await DB.put('habitRecords', r); map[key] = r; return r; }
  async function freeze(h, map) { let k = Jalali.addDays(Jalali.todayKey(), -1), guard = 0;
    while (guard++ < 14) { if (isScheduled(h, k)) { const r = map[k]; if (!isComplete(h, r) && !(r && r.skipped)) { await skip(h, k, map); return k; } } k = Jalali.addDays(k, -1); } return null; }
  function level(h, r) { if (!r) return 0; if (r.skipped) return -1; if (h.target > 1) { const v = r.value || 0; return v <= 0 ? 0 : Math.min(4, Math.max(1, Math.ceil(v / h.target * 4))); } return r.done ? 4 : 0; }
  return { make, create, update, recordsMap, allRecordsMaps, isScheduled, isComplete, stats, xpFor, toggle, increment, skip, freeze, level, weekStartKey, TYPES, EMOJIS, TEMPLATES };
})();

/* ---------------------------------------------------------------------------
   15l. HabitsView — habits page (list + detail), heatmap, editor
   ------------------------------------------------------------------------- */
const HabitsView = (() => {
  let filter = 'active';
  const refresh = () => Router.render();
  const field = Views.field;
  const LV = [0, 30, 50, 72, 100];

  async function render(params) { if (params && params.id) return detail(params.id); return list(); }

  /* `key` defaults to today so every existing caller is unaffected; the Today
     page passes the day it is showing, which is what lets habits be ticked for
     a past day. `readonly` guards future days — a tick there is ignored by the
     streak walk but would still show up in History. */
  function todayControl(h, map, onChange, key = Jalali.todayKey(), readonly = false) {
    const r = map[key];
    if (h.target > 1) {
      const val = el('.hc-val', { text: `${I18n.num((r && r.value) || 0)}/${I18n.num(h.target)}` });
      return el('.habit-count', {}, [
        el('button.counter-btn', { text: '−', disabled: readonly, onclick: async (e) => { e.stopPropagation(); await Habits.increment(h, key, map, -1); onChange(); } }),
        val,
        el('button.counter-btn', { disabled: readonly, style: Habits.isComplete(h, map[key]) ? { background: h.color, color: '#fff' } : {}, text: '+', onclick: async (e) => { e.stopPropagation(); await Habits.increment(h, key, map, 1, e.currentTarget); onChange(); } }),
      ]);
    }
    const done = Habits.isComplete(h, r);
    return el('.habit-check' + (done ? '.on' : ''), { style: done ? { background: h.color, borderColor: h.color } : {}, html: done ? icon('check') : '', role: 'checkbox', 'aria-checked': String(done), tabindex: readonly ? -1 : 0,
      onclick: async (e) => { e.stopPropagation(); if (readonly) return; await Habits.toggle(h, key, map, e.currentTarget); onChange(); }, onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.click(); } } });
  }
  function row(h, map, key = Jalali.todayKey(), readonly = false) {
    const st = Habits.stats(h, map);
    const wrap = el('.habit-row');
    wrap.appendChild(el('.habit-ic', { style: { background: `color-mix(in srgb, ${h.color} 16%, transparent)` }, text: h.icon || '🎯' }));
    wrap.appendChild(el('.habit-name', { onclick: () => Router.go('habits', { id: h.id }) }, [
      el('.hn', { text: h.title }),
      el('.hsub', {}, [
        el('span.hchip', { text: I18n.t('ht_' + h.type) + (h.target > 1 ? ` · ${I18n.num(h.target)} ${h.unit || ''}`.trimEnd() : '') }),
        el('span.streak-flame' + (st.streak ? '' : '.cold'), { title: I18n.t('currentStreak') }, [el('span', { html: icon('fire') }), el('span', { text: `${I18n.num(st.streak)} ${I18n.t('streakDays')}` })]),
        el('span.hchip', { title: I18n.t('rateHint') }, [el('span', { html: icon('check') }), el('span', { text: `${I18n.num(st.rate)}% ${I18n.t('successRate')}` })]),
        el('span.hchip.hxp', { title: I18n.t('habitXpHint'), text: `+${I18n.num(Habits.xpFor(h, map))} XP` }),
      ]),
    ]));
    wrap.appendChild(weekStrip(h, map));
    wrap.appendChild(todayControl(h, map, () => refresh(), key, readonly));
    return wrap;
  }
  /** Last 7 days as clickable dots — quick backfill without opening the detail page. */
  function weekStrip(h, map) {
    const today = Jalali.todayKey();
    const strip = el('.hweek', { title: I18n.t('last7Days') });
    for (let i = 6; i >= 0; i--) {
      const key = Jalali.addDays(today, -i);
      const lv = Habits.level(h, map[key]);
      const sched = Habits.isScheduled(h, key);
      strip.appendChild(el('.hday' + (key === today ? '.is-today' : '') + (lv === -1 ? '.skip' : '') + (sched ? '' : '.off'), {
        title: Jalali.label(key),
        style: lv > 0 ? { background: `color-mix(in srgb, ${h.color} ${LV[lv]}%, transparent)` } : {},
        onclick: sched ? async (e) => { e.stopPropagation(); await Habits.toggle(h, key, map, e.currentTarget); refresh(); } : null }));
    }
    return strip;
  }

  function heatmap(h, map, weeks = 53, clickable = true) {
    const today = Jalali.todayKey();
    const startWeek = Habits.weekStartKey(Jalali.addDays(today, -(weeks - 1) * 7));
    const grid = el('.heatmap');
    for (let w = 0; w < weeks; w++) {
      const col = el('.hm-col');
      for (let d = 0; d < 7; d++) {
        const key = Jalali.addDays(startWeek, w * 7 + d);
        if (key > today) { col.appendChild(el('.hm-cell.future')); continue; }
        const lv = Habits.level(h, map[key]);
        const cell = el('.hm-cell' + (lv === -1 ? '.skip' : '') + (clickable ? '.clickable' : ''), {
          title: Jalali.label(key), style: lv > 0 ? { background: `color-mix(in srgb, ${h.color} ${LV[lv]}%, transparent)` } : {},
          onclick: clickable ? async () => { await Habits.toggle(h, key, map); refresh(); } : null });
        col.appendChild(cell);
      }
      grid.appendChild(col);
    }
    return el('.hm-wrap', {}, [grid]);
  }
  function legend(h) {
    return el('.hm-legend', {}, [el('span', { text: I18n.t('less') }),
      ...[0, 1, 2, 3, 4].map(lv => el('.hm-cell', { style: lv > 0 ? { background: `color-mix(in srgb, ${h.color} ${LV[lv]}%, transparent)` } : {} })),
      el('span', { text: I18n.t('more') })]);
  }

  async function list() {
    const allHabits = await DB.all('habits');
    const habits = allHabits.filter(h => filter === 'archived' ? h.status === 'archived' : h.status !== 'archived');
    const wrap = el('.col.gap-6');
    wrap.appendChild(Views.pageHeader(I18n.t('nav_habits'), '', [
      el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('addHabit') + '</span>', onclick: () => openEditor(null, refresh) }),
    ]));
    const seg = el('.seg');
    [['active', 'habitActive'], ['archived', 'habitArchivedFilter']].forEach(([v, k]) => seg.appendChild(el('button' + (filter === v ? '.on' : ''), { text: I18n.t(k), onclick: () => { filter = v; refresh(); } })));
    wrap.appendChild(el('.row', {}, [seg]));
    if (!allHabits.length) {
      wrap.appendChild(templatesCard());
      wrap.appendChild(el('.card.pad', {}, [Views.emptyState('habits', I18n.t('noHabits'), I18n.t('noHabitsHint'),
        el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('addFirstHabit') + '</span>', onclick: () => openEditor(null, refresh) }))]));
      return wrap;
    }
    if (!habits.length) { wrap.appendChild(el('.card.pad', {}, [Views.emptyState('habits', I18n.t('noMatchFilter'), '',
      el('button.btn.sm.outline', { text: I18n.t('clearFilter'), onclick: () => { filter = 'active'; refresh(); } }))])); return wrap; }
    const maps = await Habits.allRecordsMaps();
    // Summary strip: today done/scheduled, best active streak, completions this week.
    if (filter === 'active') {
      const today = Jalali.todayKey(), ws = Habits.weekStartKey(today);
      let doneToday = 0, schedToday = 0, bestCur = 0, weekDone = 0;
      for (const h of habits) {
        const m = maps[h.id] || {};
        if (Habits.isScheduled(h, today)) { schedToday++; if (Habits.isComplete(h, m[today])) doneToday++; }
        const s = Habits.stats(h, m); if (s.streak > bestCur) bestCur = s.streak;
        for (let i = 0; i < 7; i++) { const k = Jalali.addDays(ws, i); if (k > today) break; if (Habits.isComplete(h, m[k])) weekDone++; }
      }
      const tiles = [
        { cap: I18n.t('todaysHabits'), num: `${I18n.num(doneToday)}/${I18n.num(schedToday)}`, ic: 'habits', color: 'var(--green)' },
        { cap: I18n.t('bestActiveStreak'), num: `${I18n.num(bestCur)} ${I18n.t('streakDays')}`, ic: 'fire', color: 'var(--orange)' },
        { cap: I18n.t('weekCompletions'), num: I18n.num(weekDone), ic: 'check', color: 'var(--brand)' },
      ];
      const tg = el('.grid.g-3');

  }

/* ---------------------------------------------------------------------------
   15m. Markdown — compact vanilla renderer (escapes first, then formats)
   ------------------------------------------------------------------------- */
const Markdown = (() => {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function inline(s, titles) {
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => `<img alt="${a}" src="${u}">`);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/\[\[([^\]]+)\]\]/g, (m, t) => { const exists = titles && titles.has(t.trim().toLowerCase()); return `<a class="backlink${exists ? '' : ' missing'}" data-note="${t.trim()}">${t}</a>`; });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
  }
  function render(md, titles) {
    if (!md) return '';
    const lines = esc(md).replace(/\r\n/g, '\n').split('\n');
    let html = '', i = 0;
    const isBlockStart = (l) => /^(#{1,6}\s|>|\s*[-*+]\s|\s*\d+\.\s|```|-{3,}\s*$|\*{3,}\s*$)/.test(l) || /\|/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) { let code = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) { code += lines[i] + '\n'; i++; } i++; html += `<pre><code>${code.replace(/\n$/, '')}</code></pre>`; continue; }
      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) { const l = hm[1].length; html += `<h${l}>${inline(hm[2], titles)}</h${l}>`; i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += '<hr>'; i++; continue; }
      if (/^>\s?/.test(line)) { let q = ''; while (i < lines.length && /^>\s?/.test(lines[i])) { q += lines[i].replace(/^>\s?/, '') + '\n'; i++; } html += `<blockquote>${inline(q.trim().replace(/\n/g, '<br>'), titles)}</blockquote>`; continue; }
      if (/\|/.test(line) && i + 1 < lines.length && /^[\s|:\-]+$/.test(lines[i + 1]) && /-/.test(lines[i + 1]) && /\|/.test(lines[i + 1])) {
        const parseRow = (l) => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const headers = parseRow(line); i += 2; let rows = '';
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim() !== '') { const cells = parseRow(lines[i]); rows += '<tr>' + cells.map(c => `<td>${inline(c, titles)}</td>`).join('') + '</tr>'; i++; }
        html += `<table><thead><tr>${headers.map(h => `<th>${inline(h, titles)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`; continue;
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        let items = '';
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          const content = lines[i].replace(/^\s*[-*+]\s+/, '');
          const cm = content.match(/^\[([ xX])\]\s+(.*)$/);
          if (cm) items += `<li class="task-li"><input type="checkbox" disabled ${cm[1].toLowerCase() === 'x' ? 'checked' : ''}><span>${inline(cm[2], titles)}</span></li>`;
          else items += `<li>${inline(content, titles)}</li>`;
          i++;
        }
        html += `<ul>${items}</ul>`; continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) { let items = ''; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items += `<li>${inline(lines[i].replace(/^\s*\d+\.\s+/, ''), titles)}</li>`; i++; } html += `<ol>${items}</ol>`; continue; }
      if (line.trim() === '') { i++; continue; }
      let para = line; i++;
      while (i < lines.length && lines[i].trim() !== '' && !isBlockStart(lines[i])) { para += '\n' + lines[i]; i++; }
      html += `<p>${inline(para.replace(/\n/g, '<br>'), titles)}</p>`;
    }
    return html;
  }
  function plain(md) {
    if (!md) return '';
    return md.replace(/```[\s\S]*?```/g, ' ').replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  /** Plain text from either markdown OR rich-editor HTML (template = inert, nothing executes). */
  function plainAny(c) {
    if (!c) return '';
    if (/<[a-z][^>]*>/i.test(c)) { const t = document.createElement('template'); t.innerHTML = c; return (t.content.textContent || '').replace(/\s+/g, ' ').trim(); }
    return plain(c);
  }
  const wordCount = (c) => { const p = plainAny(c); return p ? p.split(/\s+/).length : 0; };
  const readingMin = (c) => Math.max(1, Math.ceil(wordCount(c) / 200));
  return { render, plain, plainAny, wordCount, readingMin };
})();

/* ---------------------------------------------------------------------------
   15n. Notes — knowledge base (folders, tags, versions)
   ------------------------------------------------------------------------- */
const Notes = (() => {
  const make = (over = {}) => ({ title: '', content: '', folderId: null, tags: [], pinned: false, favorite: false, color: null, icon: '', history: [], ...over });
  const create = (data) => DB.put('notes', make(data));
  const update = (n) => DB.put('notes', n);
  const createFolder = (name) => DB.put('folders', { name, parentId: null, color: null });
  const updateFolder = (f) => DB.put('folders', f);
  async function deleteFolder(id) { const notes = await DB.byIndex('notes', 'folderId', id); for (const n of notes) { n.folderId = null; await DB.put('notes', n); } await DB.softDelete('folders', id); }
  return { make, create, update, createFolder, updateFolder, deleteFolder };
})();

/* ---------------------------------------------------------------------------
   15o. NotesView — two-pane notes workspace (list + Markdown editor)
   ------------------------------------------------------------------------- */
const NotesView = (() => {
  let selectedId = null, folderFilter = 'all', query = '', sessionSnap = false;
  const refresh = () => Router.render();
  const select = (id) => { selectedId = id; sessionSnap = false; refresh(); };
  async function promptText(title, val = '') { const input = el('input.input', { value: val }); const v = await UI.modal({ title, body: input, actions: [{ label: I18n.t('cancel'), value: null, variant: 'ghost' }, { label: I18n.t('save'), value: 'ok', variant: 'primary' }] }); return v === 'ok' ? input.value.trim() : null; }
  function snapshotIfNeeded(note) { if (sessionSnap) return; if (note.content) { note.history = note.history || []; note.history.unshift({ at: Date.now(), content: note.content, format: note.format || 'md' }); if (note.history.length > 20) note.history.length = 20; } sessionSnap = true; }

  async function render() {
    const notes = await DB.all('notes');
    const folders = await DB.all('folders');
    const titles = new Set(notes.map(n => (n.title || '').trim().toLowerCase()).filter(Boolean));
    if (selectedId && !notes.find(n => n.id === selectedId)) selectedId = null;

    const wrap = el('.col.gap-4');
    wrap.appendChild(Views.pageHeader(I18n.t('nav_notes'), '', [
      el('button.btn.outline', { html: icon('folderPlus'), title: I18n.t('newFolder'), onclick: async () => { const name = await promptText(I18n.t('newFolder')); if (name) { await Notes.createFolder(name); refresh(); } } }),
      el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('newNote') + '</span>', onclick: () => createNote() }),
    ]));
    const layout = el('.notes-layout');
    const left = el('.notes-pane');
    const searchInput = el('input', { value: query, placeholder: I18n.t('searchNotes'), oninput: debounce((e) => { query = e.target.value; fillList(); }, 220) });
    left.appendChild(el('.quickadd', {}, [el('span', { html: icon('search'), style: { color: 'var(--text-3)' } }), searchInput]));
    const chips = el('.folder-chips');
    const chip = (key, label, ic) => el('.folder-chip' + (folderFilter === key ? '.on' : ''), { onclick: () => { folderFilter = key; refresh(); } }, [ic ? el('span', { html: icon(ic) }) : null, el('span', { text: label })]);
    chips.append(chip('all', I18n.t('allNotes')), chip('pinned', I18n.t('pinnedNotes'), 'pin'), chip('favorites', I18n.t('favorites'), 'star'));
    folders.forEach(f => chips.appendChild(el('.folder-chip' + (folderFilter === f.id ? '.on' : ''), {
      onclick: () => { if (folderFilter === f.id) folderMenu(f); else { folderFilter = f.id; refresh(); } } }, [el('span', { html: icon('folder') }), el('span', { text: f.name })])));
    chips.appendChild(chip('uncat', I18n.t('uncategorized'), 'folder'));
    left.appendChild(chips);
    const listWrap = el('.notes-list');
    left.appendChild(listWrap);
    layout.appendChild(left);
    const right = el('.notes-pane');
    right.appendChild(editor(selectedId ? notes.find(n => n.id === selectedId) : null, folders, titles));
    layout.appendChild(right);
    wrap.appendChild(layout);

    function fillList() {
      let l = notes.slice();
      if (folderFilter === 'favorites') l = l.filter(n => n.favorite);
      else if (folderFilter === 'pinned') l = l.filter(n => n.pinned);
      else if (folderFilter === 'uncat') l = l.filter(n => !n.folderId);
      else if (folderFilter !== 'all') l = l.filter(n => n.folderId === folderFilter);
      if (query) { const q = query.toLowerCase(); l = l.filter(n => (n.title || '').toLowerCase().includes(q) || Markdown.plainAny(n.content).toLowerCase().includes(q)); }
      l.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.updatedAt || 0) - (a.updatedAt || 0)));
      listWrap.innerHTML = '';
      if (!l.length) { listWrap.appendChild(el('.dim.small', { style: { padding: '12px' }, text: notes.length ? I18n.t('noData') : I18n.t('noNotesHint') })); return; }
      l.forEach(n => listWrap.appendChild(noteCard(n)));
    }
    fillList();
    return wrap;
  }

  function noteCard(n) {
    const snip = Markdown.plainAny(n.content).slice(0, 120);
    return el('.note-card' + (n.id === selectedId ? '.sel' : ''), { onclick: () => select(n.id) }, [
      el('.nt', {}, [n.pinned ? el('span.note-pin', { html: icon('pin') }) : null, n.favorite ? el('span.note-fav', { html: icon('star') }) : null, el('span', { text: n.title || I18n.t('emptyNote') })]),
      snip ? el('.nsnip', { text: snip }) : null,
      el('.nmeta', {}, [
        el('span', { text: n.updatedAt ? Jalali.label(Jalali.keyFromDate(new Date(n.updatedAt))) : '' }),
        ...(n.tags || []).slice(0, 3).map(t => el('span', { text: '#' + t })),
      ]),
    ]);
  }

  async function createNote() {
    const real = !['all', 'favorites', 'pinned', 'uncat'].includes(folderFilter);
    const n = await Notes.create({ folderId: real ? folderFilter : null, favorite: folderFilter === 'favorites', pinned: folderFilter === 'pinned' });
    select(n.id);
  }
  async function openByTitle(t) {
    const notes = await DB.all('notes');
    const found = notes.find(n => (n.title || '').trim().toLowerCase() === t.trim().toLowerCase());
    select(found ? found.id : (await Notes.create({ title: t })).id);
  }
  async function folderMenu(f) {
    const input = el('input.input', { value: f.name });
    const v = await UI.modal({ title: f.name, body: el('.col.gap-2', {}, [el('.label', { text: I18n.t('folderName') }), input]), actions: [
      { label: I18n.t('deleteFolder'), value: 'del', variant: 'danger' }, { label: I18n.t('cancel'), value: null, variant: 'ghost' }, { label: I18n.t('renameFolder'), value: 'ren', variant: 'primary' }] });
    if (v === 'ren' && input.value.trim()) { f.name = input.value.trim(); await Notes.updateFolder(f); refresh(); }
    else if (v === 'del') { if (await UI.confirm({ title: I18n.t('deleteFolderQ'), danger: true, confirmLabel: I18n.t('delete') })) { await Notes.deleteFolder(f.id); if (folderFilter === f.id) folderFilter = 'all'; refresh(); } }
  }

  /** Strip anything executable before storing editor HTML (user's own content,
      but paste can smuggle scripts/handlers). */
  function sanitizeHtml(html) {
    const t = document.createElement('template'); t.innerHTML = html;
    t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
    t.content.querySelectorAll('*').forEach(n => {
      [...n.attributes].forEach(a => {
        const name = a.name.toLowerCase();
        if (name.startsWith('on')) n.removeAttribute(a.name);
        else if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
      });
      // transparent "un-highlight" spans from execCommand are noise: they'd still
      // match the dark-ink highlight rule and go unreadable in dark mode.
      if (n.style && (n.style.backgroundColor === 'transparent' || n.style.backgroundColor === 'inherit')) n.style.backgroundColor = '';
      if (n.getAttribute && n.getAttribute('style') === '') n.removeAttribute('style');
    });
    const d = document.createElement('div'); d.appendChild(t.content); return d.innerHTML;
  }

  const TEXT_COLORS = ['#EF4444', '#F97316', '#F59E0B', '#22C55E', '#14B8A6', '#3B82F6', '#7C5CFC', '#EC4899', '#64748B'];
  const HILITE_COLORS = ['#FEF08A', '#FED7AA', '#FECACA', '#BBF7D0', '#BFDBFE', '#DDD6FE', '#FBCFE8', '#99F6E4'];

  /** WYSIWYG toolbar — formatting applies live in the editing surface itself. */
  function richToolbar(ed, onChanged) {
    const exec = (c, v = null) => { ed.focus(); document.execCommand('styleWithCSS', false, c === 'foreColor' || c === 'hiliteColor'); document.execCommand(c, false, v); onChanged(); };
    // mousedown preventDefault keeps the editor selection alive while clicking the bar
    const btn = (opts, fn) => el('button.tb-btn', { ...opts, type: 'button', onmousedown: (e) => e.preventDefault(), onclick: fn });
    const sep = () => el('span.tb-sep');
    const bar = el('.note-toolbar');

    /** Remove an inline style from every element the selection touches (and its
        ancestors). execCommand can't "un-highlight": it nests a transparent span
        INSIDE the colored one, so the parent's color still shows through. */
    const clearStyle = (prop) => {
      ed.focus();
      const sel = window.getSelection(); if (!sel || !sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      $$('[style]', ed).forEach(n => { if (n.style[prop] && range.intersectsNode(n)) n.style[prop] = ''; });
      let a = range.commonAncestorContainer; if (a.nodeType === 3) a = a.parentElement;
      while (a && a !== ed) { if (a.style && a.style[prop]) a.style[prop] = ''; a = a.parentElement; }
      onChanged();
    };
    const swatchPop = (anchor, colors, apply, onClear) => {
      const pop = el('.card.swatch-pop', { onmousedown: (e) => e.preventDefault() });
      colors.forEach(c => pop.appendChild(el('.swatch', { style: { background: c }, onclick: () => { close(); apply(c); } })));
      pop.appendChild(el('.swatch.sw-clear', { title: I18n.t('tbClear'), html: icon('x'), onclick: () => { close(); onClear(); } }));
      document.body.appendChild(pop);
      const r = anchor.getBoundingClientRect();
      pop.style.top = Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 8) + 'px';
      pop.style.left = clamp(I18n.dir() === 'rtl' ? r.right - pop.offsetWidth : r.left, 8, window.innerWidth - pop.offsetWidth - 8) + 'px';
      const close = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); };
      function outside(e) { if (!pop.contains(e.target)) close(); }
      setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    };

    bar.append(
      btn({ text: 'H1', title: I18n.t('tbH') + ' ۱' }, () => exec('formatBlock', '<h1>')),
      btn({ text: 'H2', title: I18n.t('tbH') + ' ۲' }, () => exec('formatBlock', '<h2>')),
      btn({ text: 'H3', title: I18n.t('tbH') + ' ۳' }, () => exec('formatBlock', '<h3>')),
      btn({ text: 'P', title: I18n.t('tbP') }, () => exec('formatBlock', '<p>')),
      sep(),
      btn({ text: 'B', title: I18n.t('tbBold'), style: { fontWeight: '900' } }, () => exec('bold')),
      btn({ text: 'I', title: I18n.t('tbItalic'), style: { fontStyle: 'italic' } }, () => exec('italic')),
      btn({ text: 'U', title: I18n.t('tbUnderline'), style: { textDecoration: 'underline' } }, () => exec('underline')),
      btn({ text: 'S', title: I18n.t('tbStrike'), style: { textDecoration: 'line-through' } }, () => exec('strikeThrough')),
      sep(),
      btn({ html: '<span class="tb-color">A</span>', title: I18n.t('tbColor') }, (e) => swatchPop(e.currentTarget, TEXT_COLORS, (c) => exec('foreColor', c), () => clearStyle('color'))),
      btn({ html: '<span class="tb-hilite">A</span>', title: I18n.t('tbHilite') }, (e) => swatchPop(e.currentTarget, HILITE_COLORS, (c) => exec('hiliteColor', c), () => clearStyle('backgroundColor'))),
      sep(),
      btn({ html: icon('menu'), title: I18n.t('tbUl') }, () => exec('insertUnorderedList')),
      btn({ text: '۱.', title: I18n.t('tbOl') }, () => exec('insertOrderedList')),
      btn({ html: icon('book'), title: I18n.t('tbQuote') }, () => exec('formatBlock', '<blockquote>')),
      btn({ html: icon('code'), title: I18n.t('tbCode') }, () => exec('formatBlock', '<pre>')),
      sep(),
      btn({ html: icon('link'), title: I18n.t('tbLink') }, async () => {
        const sel = window.getSelection();
        const range = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
        const url = await promptText(I18n.t('tbLink'), 'https://');
        if (!url) return;
        ed.focus();
        if (range) { sel.removeAllRanges(); sel.addRange(range); }
        document.execCommand('createLink', false, url); onChanged();
      }),
      btn({ html: icon('x'), title: I18n.t('tbClear') }, () => { exec('removeFormat'); exec('formatBlock', '<p>'); }),
    );
    return bar;
  }

  function editor(note, folders, titles) {
    if (!note) return el('.card.pad.note-editor', {}, [Views.emptyState('notes', I18n.t('selectNote'), '',
      el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('newNote') + '</span>', onclick: () => createNote() }))]);
    const card = el('.card.pad.note-editor');
    const titleInput = el('input.note-title-input', { value: note.title, placeholder: I18n.t('noteTitlePh'), oninput: debounce((e) => { note.title = e.target.value; Notes.update(note); }, 400) });
    const actions = el('.row.gap-1.none', {}, [
      el('button.tb-btn', { title: I18n.t(note.pinned ? 'unpinNote' : 'pinNote'), style: note.pinned ? { color: 'var(--orange)' } : {}, html: icon('pin'), onclick: async () => { note.pinned = !note.pinned; await Notes.update(note); refresh(); } }),
      el('button.tb-btn', { title: I18n.t(note.favorite ? 'unfavNote' : 'favNote'), style: note.favorite ? { color: 'var(--red)' } : {}, html: icon('star'), onclick: async () => { note.favorite = !note.favorite; await Notes.update(note); refresh(); } }),
      el('button.tb-btn', { title: I18n.t('versionHistory'), html: icon('history'), onclick: () => historyModal(note) }),
      el('button.tb-btn', { title: I18n.t('delete'), html: icon('trash'), style: { color: 'var(--red)' }, onclick: async () => { if (await UI.confirm({ title: I18n.t('deleteNoteQ'), danger: true, confirmLabel: I18n.t('delete') })) { await DB.softDelete('notes', note.id); selectedId = null; UI.toast('info', I18n.t('noteDeleted')); refresh(); } } }),
    ]);
    card.appendChild(el('.row.between.gap-2', {}, [titleInput, actions]));
    const folderSel = el('select.select', { style: { maxWidth: '170px' }, onchange: (e) => { note.folderId = e.target.value || null; Notes.update(note); } },
      [el('option', { value: '', text: I18n.t('uncategorized'), selected: !note.folderId }), ...folders.map(f => el('option', { value: f.id, text: f.name, selected: note.folderId === f.id }))]);
    const tagsInput = el('input.input', { value: (note.tags || []).join('، '), placeholder: I18n.t('addTagPh'), oninput: debounce((e) => { note.tags = e.target.value.split(/[،,]/).map(s => s.trim()).filter(Boolean); Notes.update(note); }, 400) });
    card.appendChild(el('.row.gap-2.wrap', {}, [folderSel, el('.grow', {}, [tagsInput])]));
    const wc = el('.note-stat'), rt = el('.note-stat');
    // WYSIWYG: the surface you type in IS the preview — no separate tab.
    const ed = el('.rich-editor.md-preview', { contenteditable: 'true', 'data-ph': I18n.t('contentPh'), dir: 'auto' });
    // Legacy markdown notes are converted to rich HTML once, on open.
    ed.innerHTML = note.format === 'html' ? (note.content || '') : (note.content ? Markdown.render(note.content, titles) : '');
    const updateStats = () => { const p = Markdown.plainAny(ed.innerHTML); const n = p ? p.split(/\s+/).length : 0;
      wc.textContent = `${I18n.num(n)} ${I18n.t('wordCount')}`; rt.textContent = `${I18n.num(Math.max(1, Math.ceil(n / 200)))} ${I18n.t('readingTime')}`; };
    const save = () => { snapshotIfNeeded(note); note.content = sanitizeHtml(ed.innerHTML); note.format = 'html'; Notes.update(note); updateStats(); };
    ed.addEventListener('input', debounce(save, 400));
    // Ctrl+click follows links / backlinks even while editing
    ed.addEventListener('click', (e) => {
      const a = e.target.closest('a'); if (!a || !e.ctrlKey) return;
      e.preventDefault();
      if (a.classList.contains('backlink')) openByTitle(a.dataset.note || a.textContent);
      else if (a.href) window.open(a.href, '_blank', 'noopener');
    });
    card.appendChild(el('.row.between.wrap.gap-2', {}, [richToolbar(ed, save), el('.row.gap-4', {}, [wc, rt])]));
    card.appendChild(ed);
    updateStats();
    return card;
  }

  function historyModal(note) {
    const body = el('.col.gap-2');
    if (!note.history || !note.history.length) body.appendChild(el('.dim', { text: I18n.t('noVersions') }));
    else note.history.forEach(v => body.appendChild(el('.row.between.gap-2', { style: { padding: '8px 11px', background: 'var(--surface-2)', borderRadius: 'var(--r-md)' } }, [
      el('.col.grow', {}, [el('.small', { text: new Date(v.at).toLocaleString(I18n.get() === 'fa' ? 'fa-IR' : 'en-US') }), el('.hint', { text: Markdown.plainAny(v.content).slice(0, 60) || '—' })]),
      el('button.btn.sm', { text: I18n.t('restoreVersion'), onclick: async () => { snapshotIfNeeded(note); note.content = v.content; note.format = v.format || 'md'; await Notes.update(note); UI.toast('success', I18n.t('saved')); refresh(); } }),
    ])));
    UI.modal({ title: I18n.t('versionHistory'), body, width: '540px' });
  }
  /** Set selection without rendering, then navigate (used from other modules). */
  const open = (id) => { selectedId = id; sessionSnap = false; Router.go('notes'); };
  return { render, select, open, createNote };
})();

/* ---------------------------------------------------------------------------
   15p. Charts — dependency-free SVG charts (donut / bars / line)
   ------------------------------------------------------------------------- */
const Charts = (() => {
  const PALETTE = ['#7C5CFC', '#3B82F6', '#22C55E', '#F59E0B', '#EF4444', '#EC4899', '#14B8A6', '#F97316', '#8B5CF6', '#06B6D4'];
  function donut(items, { size = 168, thickness = 22, center } = {}) {
    const total = items.reduce((s, i) => s + i.value, 0);
    const r = (size - thickness) / 2, c = 2 * Math.PI * r, cx = size / 2;
    let off = 0, segs = '';
    if (total > 0) items.forEach(it => {
      const len = (it.value / total) * c;
      segs += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"><title>${it.label}</title></circle>`;
      off += len;
    });
    return el('div', { html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="donut chart">
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thickness}"/>${segs}
      ${center ? `<text x="${cx}" y="${cx - 2}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text)">${center.main}</text><text x="${cx}" y="${cx + 15}" text-anchor="middle" font-size="10" fill="var(--text-3)">${center.sub || ''}</text>` : ''}</svg>` });
  }
  const legend = (items, fmt) => el('.chart-legend', {}, items.map(it => el('.lg-item', {}, [
    el('.lg-dot', { style: { background: it.color } }), el('span.grow', { text: it.label }), el('.lg-val', { text: fmt ? fmt(it.value) : String(it.value) })])));
  function bars(groups, { fmt } = {}) {
    const top = Math.max(1, ...groups.map(g => Math.max(...g.segments.map(s => s.value), 0)));
    const wrap = el('.bar-chart');
    groups.forEach(g => {
      const col = el('.bar-col'), stack = el('.bar-stack');
      g.segments.forEach(s => { if (s.value <= 0) return;
        stack.appendChild(el('.bar-seg', { style: { height: `${Math.max(3, (s.value / top) * 130)}px`, background: s.color }, title: `${g.label}: ${fmt ? fmt(s.value) : s.value}` })); });
      if (!stack.childNodes.length) stack.appendChild(el('.bar-seg', { style: { height: '3px', background: 'var(--surface-3)' } }));
      col.append(stack, el('.bar-lbl', { text: g.label }));
      wrap.appendChild(col);
    });
    return wrap;
  }
  function line(points, { height = 150, color = 'var(--brand)', fmt } = {}) {
    if (!points.length) return el('div');
    const w = 600, h = height, pad = 10;
    const vals = points.map(p => p.value), min = Math.min(0, ...vals), max = Math.max(1, ...vals), span = (max - min) || 1;
    const x = (i) => pad + (i * (w - pad * 2)) / Math.max(1, points.length - 1);
    const y = (v) => h - pad - ((v - min) / span) * (h - pad * 2);
    const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    const area = `${path} L${x(points.length - 1).toFixed(1)},${(h - pad).toFixed(1)} L${x(0).toFixed(1)},${(h - pad).toFixed(1)} Z`;
    const dots = points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="2.5" fill="${color}"><title>${p.label}: ${fmt ? fmt(p.value) : p.value}</title></circle>`).join('');
    return el('div', { html: `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="line chart">
      <line x1="${pad}" y1="${y(0).toFixed(1)}" x2="${w - pad}" y2="${y(0).toFixed(1)}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${area}" fill="${color}" opacity=".14"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>` });
  }
  return { donut, bars, line, legend, PALETTE };
})();

/* ---------------------------------------------------------------------------
   15q. Finance — accounts, transactions, budgets, savings goals
   ------------------------------------------------------------------------- */
const Finance = (() => {
  const CATS = {
    expense: [{ k: 'food', icon: '🍽️', color: '#F59E0B' }, { k: 'transport', icon: '🚕', color: '#3B82F6' }, { k: 'housing', icon: '🏠', color: '#7C5CFC' },
      { k: 'bills', icon: '🧾', color: '#14B8A6' }, { k: 'healthc', icon: '💊', color: '#EF4444' }, { k: 'education', icon: '📚', color: '#8B5CF6' },
      { k: 'shopping', icon: '🛍️', color: '#EC4899' }, { k: 'fun', icon: '🎬', color: '#F97316' }, { k: 'sport', icon: '🏋️', color: '#22C55E' }, { k: 'otherx', icon: '📦', color: '#94A3B8' }],
    income: [{ k: 'salary', icon: '💼', color: '#22C55E' }, { k: 'freelance', icon: '💻', color: '#06B6D4' }, { k: 'gift', icon: '🎁', color: '#EC4899' },
      { k: 'invest', icon: '📈', color: '#7C5CFC' }, { k: 'otherx', icon: '📦', color: '#94A3B8' }],
  };
  const ACCOUNT_TYPES = ['cash', 'bank', 'card', 'savings', 'investment', 'gold', 'silver', 'asset', 'loan'];
  const REPEATS = ['none', 'daily', 'weekly', 'monthly', 'yearly'];
  const SYM = { IRT: 'تومان', IRR: 'ریال', USD: '$', EUR: '€', CNY: '¥' };
  const catInfo = (type, k) => (CATS[type] || CATS.expense).find(c => c.k === k) || { k, icon: '📦', color: '#94A3B8' };
  function fmt(n) {
    const cur = Prefs.get('currency') || 'IRT', sym = SYM[cur] || cur;
    const sign = n < 0 ? '−' : '', s = Math.abs(Math.round(n)).toLocaleString('en-US');
    if (cur === 'USD' || cur === 'EUR' || cur === 'CNY') return `${sign}${sym}${I18n.num(s)}`;
    return `${sign}${I18n.num(s)} ${sym}`;
  }
  const makeTx = (o = {}) => ({ type: 'expense', amount: 0, category: 'otherx', accountId: null, toAccountId: null, date: Jalali.todayKey(),
    time: '', description: '', tags: [], receipt: '', repeat: 'none', reminder: null, status: 'cleared', ...o });
  const makeAccount = (o = {}) => ({ name: '', type: 'cash', opening: 0, color: '#7C5CFC', icon: '💳', archived: false, ...o });
  const makeBudget = (o = {}) => ({ kind: 'budget', category: 'food', amount: 0, period: 'monthly', ...o });
  const makeGoal = (o = {}) => ({ kind: 'goal', name: '', target: 0, saved: 0, color: '#22C55E', icon: '🎯', ...o });
  const createTx = (d) => DB.put('transactions', makeTx(d));
  const updateTx = (t) => DB.put('transactions', t);
  const createAccount = (d) => DB.put('accounts', makeAccount(d));
  const updateAccount = (a) => DB.put('accounts', a);
  function balance(acc, txs) {
    let b = acc.opening || 0;
    txs.forEach(t => {
      if (t.status === 'pending') return;
      if (t.accountId === acc.id) { if (t.type === 'income') b += t.amount; else b -= t.amount; }
      if (t.type === 'transfer' && t.toAccountId === acc.id) b += t.amount;
    });
    return b;
  }
  const monthKeys = (jy, jm) => Array.from({ length: Jalali.monthLen(jy, jm) }, (_, i) => Jalali.key({ jy, jm, jd: i + 1 }));
  function totals(txs) {
    let income = 0, expense = 0;
    txs.forEach(t => { if (t.status === 'pending') return; if (t.type === 'income') income += t.amount; else if (t.type === 'expense') expense += t.amount; });
    return { income, expense, net: income - expense };
  }
  function nextDue(t) {
    if (!t.repeat || t.repeat === 'none') return null;
    const today = Jalali.todayKey(); let k = t.date, guard = 0;
    const step = { daily: 1, weekly: 7 }[t.repeat];
    while (k < today && guard++ < 800) {
      if (step) k = Jalali.addDays(k, step);
      else { const j = Jalali.parseKey(k);
        if (t.repeat === 'monthly') { let m = j.jm + 1, y = j.jy; if (m > 12) { m = 1; y++; } k = Jalali.key({ jy: y, jm: m, jd: Math.min(j.jd, Jalali.monthLen(y, m)) }); }
        else { k = Jalali.key({ jy: j.jy + 1, jm: j.jm, jd: Math.min(j.jd, Jalali.monthLen(j.jy + 1, j.jm)) }); } }
    }
    return k;
  }
  /** Currency unit word for the words-line under money inputs. */
  const UNIT_WORD = { IRT: { fa: 'تومان', en: 'Toman' }, IRR: { fa: 'ریال', en: 'Rial' }, USD: { fa: 'دلار', en: 'USD' }, EUR: { fa: 'یورو', en: 'EUR' }, CNY: { fa: 'یوان', en: 'CNY' } };
  const unitName = () => { const cur = Prefs.get('currency') || 'IRT'; const u = UNIT_WORD[cur] || { fa: cur, en: cur }; return u[I18n.get()] || u.en; };
  /** Integer → Persian words (up to هزار میلیارد). */
  function numWordsFa(n) {
    n = Math.floor(Math.abs(+n || 0)); if (!n) return '';
    const ones = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
    const teens = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
    const tens = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
    const hunds = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
    const three = (x) => { const p = []; const h = Math.floor(x / 100), r = x % 100;
      if (h) p.push(hunds[h]);
      if (r >= 10 && r < 20) p.push(teens[r - 10]);
      else { if (Math.floor(r / 10)) p.push(tens[Math.floor(r / 10)]); if (r % 10) p.push(ones[r % 10]); }
      return p.join(' و '); };
    const scales = ['', 'هزار', 'میلیون', 'میلیارد', 'هزار میلیارد'];
    const chunks = []; let i = 0;
    while (n > 0 && i < scales.length) { const c = n % 1000;
      if (c) chunks.unshift((c === 1 && i === 1) ? 'هزار' : three(c) + (scales[i] ? ' ' + scales[i] : ''));
      n = Math.floor(n / 1000); i++; }
    return chunks.join(' و ');
  }
  /** Compact money for chart centers/badges: ۱۲.۵ میلیون. */
  function compact(n) {
    const a = Math.abs(n), sign = n < 0 ? '−' : '';
    const f = (v, u) => sign + I18n.num((Math.round(v * 10) / 10).toString()) + ' ' + u;
    if (a >= 1e12) return f(a / 1e12, I18n.get() === 'fa' ? 'هزار میلیارد' : 'T');
    if (a >= 1e9) return f(a / 1e9, I18n.get() === 'fa' ? 'میلیارد' : 'B');
    if (a >= 1e6) return f(a / 1e6, I18n.get() === 'fa' ? 'میلیون' : 'M');
    if (a >= 1e3) return f(a / 1e3, I18n.get() === 'fa' ? 'هزار' : 'K');
    return sign + I18n.num(String(Math.round(a)));
  }
  return { CATS, ACCOUNT_TYPES, REPEATS, catInfo, fmt, unitName, numWordsFa, compact, makeTx, makeAccount, makeBudget, makeGoal, createTx, updateTx, createAccount, updateAccount, balance, monthKeys, totals, nextDue };
})();

/* ---------------------------------------------------------------------------
   15r. FinanceView — overview / transactions / accounts / budgets / goals
   ------------------------------------------------------------------------- */
const FinanceView = (() => {
  let tab = 'overview', cur = (() => { const j = Jalali.fromDate(); return { jy: j.jy, jm: j.jm }; })();
  let fType = 'all', fAcct = 'all', fCat = 'all', q = '';
  const refresh = () => Router.render();
  const field = Views.field;

  /** Money input: live 3-digit grouping, accepts Persian/Arabic/Latin digits
      (type=number silently rejected Persian keyboards — THE cause of "empty"
      overview stats), with the amount spelled out in words underneath. */
  function moneyInput({ value = 0, onChange }) {
    const toLatin = (s) => s.replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const wrap = el('.money-in');
    const inp = el('input.input.money', { inputmode: 'numeric', dir: 'ltr', placeholder: '0' });
    const words = el('.money-words');
    const render = (n) => {
      inp.value = n ? I18n.num(n.toLocaleString('en-US')) : '';
      const w = I18n.get() === 'fa' ? Finance.numWordsFa(n) : (n ? Finance.compact(n) : '');
      words.textContent = n ? `${w} ${Finance.unitName()}` : '';
    };
    inp.addEventListener('input', () => {
      const raw = toLatin(inp.value).replace(/\D/g, '').slice(0, 15);
      const n = raw ? parseInt(raw, 10) : 0;
      render(n);
      try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch {}
      onChange && onChange(n);
    });
    render(+value || 0);
    wrap.append(inp, words);
    return wrap;
  }

  async function overview() {
    const accounts = (await DB.all('accounts')).filter(a => !a.archived);
    const accMap = Object.fromEntries(accounts.map(a => [a.id, a]));
    const keys = Finance.monthKeys(cur.jy, cur.jm);
    // Balances need the full ledger, but the month view only needs its month —
    // read that slice through the date index rather than filtering everything.
    const txs = await DB.all('transactions');
    const monthTx = await DB.range('transactions', 'date', keys[0], keys[keys.length - 1]);
    const tot = Finance.totals(monthTx);
    // previous month for economist-style deltas
    let pm = cur.jm - 1, py = cur.jy; if (pm < 1) { pm = 12; py--; }
    const pKeys = Finance.monthKeys(py, pm);
    const prevTot = Finance.totals(await DB.range('transactions', 'date', pKeys[0], pKeys[pKeys.length - 1]));
    // Real balance = account openings + their ledgers, PLUS transactions that
    // were never tied to an account (legacy rows) so nothing is missing.
    const orphanNet = Finance.totals(txs.filter(t => !t.accountId && t.type !== 'transfer')).net;
    const worth = accounts.reduce((s, a) => s + Finance.balance(a, txs), 0) + orphanNet;
    const savings = tot.income > 0 ? Math.round(tot.net / tot.income * 100) : null;
    const box = el('.col.gap-5');
    box.appendChild(monthNav());

    // KPI row: month totals + Δ vs previous month + savings rate
    const delta = (nowV, prevV, goodWhenUp) => {
      if (!prevV) return null;
      // abs() denominator: a negative baseline must not flip the direction
      const d = Math.round((nowV - prevV) / Math.abs(prevV) * 100); if (!d) return null;
      const up = d > 0, good = goodWhenUp ? up : !up;
      return el('span.kpi-delta' + (good ? '.good' : '.bad'), { title: I18n.t('vsPrevMonth') },
        [el('span', { text: (up ? '▲' : '▼') + ' ' + I18n.num(Math.abs(d)) + '%' })]);
    };
    const nTx = monthTx.filter(t => t.status !== 'pending').length;
    const tiles = [
      { cap: I18n.t('income'), num: Finance.fmt(tot.income), ic: 'up', color: 'var(--green)', d: delta(tot.income, prevTot.income, true) },
      { cap: I18n.t('expense'), num: Finance.fmt(tot.expense), ic: 'down', color: 'var(--red)', d: delta(tot.expense, prevTot.expense, false) },
      // «مانده» = the money you actually HAVE (openings + full ledger), not the
      // month's income−expense — that reads as "wrong" next to a funded account.
      { cap: I18n.t('netBalance'), num: Finance.fmt(worth), ic: 'coins', color: worth >= 0 ? 'var(--brand)' : 'var(--red)', d: null,
        sub: `${I18n.t('monthNet')}: ${(tot.net < 0 ? '−' : '+') + Finance.compact(Math.abs(tot.net))}` },
      { cap: I18n.t('savingsRate'), num: savings == null ? '—' : I18n.num(savings) + '%', ic: 'trophy', color: savings != null && savings >= 20 ? 'var(--green)' : savings != null && savings >= 0 ? 'var(--orange)' : 'var(--red)', d: null,
        sub: savings == null ? I18n.t('noIncomeYet') : `${I18n.num(nTx)} ${I18n.t('txCount')}` },
    ];
    const g = el('.grid.g-4.fin-kpis');
    tiles.forEach(t => g.appendChild(el('.card.pad.stat.fin-kpi', { style: { '--kc': t.color } }, [el('.row.between', {}, [
      el('.col.gap-1', {}, [el('.cap', { text: t.cap }),
        el('.num', { text: t.num, style: { fontSize: 'var(--fs-lg)' } }),
        t.d || (t.sub ? el('.xs.dim', { text: t.sub }) : null)]),
      el('.stat-ic', { style: { background: `color-mix(in srgb, ${t.color} 15%, transparent)`, color: t.color }, html: icon(t.ic) })])])));
    box.appendChild(g);

    // Recent transactions FIRST — the thing you check most often lives on top.
    const recent = txs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || ((b.updatedAt || 0) - (a.updatedAt || 0))).slice(0, 5);
    if (recent.length) {
      const l = el('.col.gap-2'); recent.forEach(t => l.appendChild(txRow(t, accMap)));
      box.appendChild(el('.card.pad.col.gap-3', {}, [el('.row.between', {}, [el('.h4', { text: I18n.t('recentTx') }),
        el('button.btn.sm.ghost', { html: '<span>' + I18n.t('fin_transactions') + '</span>' + icon('arrowR'), onclick: () => { tab = 'transactions'; refresh(); } })]), l]));
    } else box.appendChild(el('.card.pad', {}, [Views.emptyState('finance', I18n.t('noTx'), I18n.t('noTxHint'),
      el('button.btn.add', { html: icon('plus') + '<span>' + I18n.t('newTransaction') + '</span>', onclick: () => txEditor(null, refresh) }))]));

    // Donut: top 5 categories + "other" bucket, % in the legend, total in the center.
    const byCat = {};
    monthTx.filter(t => t.type === 'expense' && t.status !== 'pending').forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
    let items = Object.entries(byCat).map(([k, v]) => ({ label: I18n.t('cat_' + k), value: v, color: Finance.catInfo('expense', k).color })).sort((a, b) => b.value - a.value);
    const catTotal = items.reduce((s, i) => s + i.value, 0);
    if (items.length > 6) {
      const rest = items.slice(5).reduce((s, i) => s + i.value, 0);
      items = items.slice(0, 5); items.push({ label: I18n.t('cat_otherx'), value: rest, color: '#94A3B8' });
    }
    if (items.length) box.appendChild(el('.card.pad.col.gap-4', {}, [el('.h4', { text: I18n.t('byCategory') }),
      el('.chart-wrap', {}, [Charts.donut(items, { center: { main: Finance.compact(catTotal), sub: I18n.t('expense') } }),
        Charts.legend(items, (v) => `${Finance.fmt(v)} · ${I18n.num(catTotal ? Math.round(v / catTotal * 100) : 0)}%`)])]));

    // 6-month comparison — one pass over the ledger instead of 6 × month-scan.
    const months = [];
    for (let i = 5; i >= 0; i--) { let mm = cur.jm - i, yy = cur.jy; while (mm < 1) { mm += 12; yy--; } months.push({ jy: yy, jm: mm }); }
    const byMonth = {};
    txs.forEach(t => { if (t.status === 'pending' || !t.date) return; const mk = t.date.slice(0, 7);
      const b = byMonth[mk] || (byMonth[mk] = { income: 0, expense: 0 });
      if (t.type === 'income') b.income += t.amount; else if (t.type === 'expense') b.expense += t.amount; });
    const groups = months.map(mo => {
      const mk = `${mo.jy}-${String(mo.jm).padStart(2, '0')}`, t2 = byMonth[mk] || { income: 0, expense: 0 };
      return { label: Jalali.months[I18n.get()][mo.jm - 1], segments: [{ value: t2.income, color: 'var(--green)' }, { value: t2.expense, color: 'var(--red)' }] };
    });
    box.appendChild(el('.card.pad.col.gap-4', {}, [
      el('.row.between.wrap.gap-2', {}, [el('.h4', { text: I18n.t('monthlyComparison') }),
        el('.row.gap-3', {}, [el('.lg-item', {}, [el('.lg-dot', { style: { background: 'var(--green)' } }), el('span.xs', { text: I18n.t('income') })]),
          el('.lg-item', {}, [el('.lg-dot', { style: { background: 'var(--red)' } }), el('span.xs', { text: I18n.t('expense') })])])]),
      Charts.bars(groups, { fmt: Finance.fmt })]));

    let run = 0;
    const pts = keys.map(k => { run += Finance.totals(monthTx.filter(t => t.date === k)).net; return { label: Jalali.label(k), value: run }; });
    box.appendChild(el('.card.pad.col.gap-4', {}, [el('.h4', { text: I18n.t('cashFlow') }), Charts.line(pts, { fmt: Finance.fmt })]));

    const recur = txs.filter(t => t.repeat && t.repeat !== 'none');
    if (recur.length) {
      recur.sort((a, b) => (Finance.nextDue(a) || '').localeCompare(Finance.nextDue(b) || ''));
      const l = el('.col.gap-2');
      recur.slice(0, 6).forEach(t => l.appendChild(el('.row.between.gap-2.wrap', { style: { padding: '9px 12px', background: 'var(--surface-2)', borderRadius: 'var(--r-md)' } }, [
        el('.row.gap-2', {}, [el('span', { text: Finance.catInfo(t.type, t.category).icon }), el('span', { text: t.description || I18n.t('cat_' + t.category) })]),
        el('.row.gap-3', {}, [el('.xs.dim', { text: `${I18n.t('nextDue')}: ${Jalali.label(Finance.nextDue(t))}` }),
          el('.tx-amt.' + (t.type === 'income' ? 'in' : 'out'), { text: Finance.fmt(t.amount) })])])));
      box.appendChild(el('.card.pad.col.gap-3', {}, [el('.h4', { text: I18n.t('subscriptions') }), l]));
    }
    return box;
  }
